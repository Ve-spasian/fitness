function renderMonthView(){
  const first = tMonth, last = new Date(first.getFullYear(), first.getMonth()+1, 0);
  $('tTitle').textContent = first.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const today = startOfToday(), todayK = dkey(today);
  const gridStart = sundayOf(first), gridEnd = addDays(sundayOf(last), 6);
  const seq = sequence(gridEnd), map = {};
  let total = 0, done = 0;
  seq.forEach(it=>{
    const k = dkey(it.date);
    if(it.date >= gridStart && it.date <= gridEnd && !map[k]) map[k] = it;
    if(it.date.getMonth() === first.getMonth() && it.date.getFullYear() === first.getFullYear() && it.date <= last){ total++; if(it.fin) done++; }
  });
  $('tSub').textContent = total ? `${done} of ${total} workouts finished` : 'No workouts this month';

  let cells = '';
  for(let dt = gridStart; dt <= gridEnd; dt = addDays(dt,1)){
    const k = dkey(dt), it = map[k], cls = ['day'];
    if(dt.getMonth() !== first.getMonth()) cls.push('out');
    if(k === todayK) cls.push('today');
    if(it){
      const tp = tplOf(it.n);
      cls.push(tp.type); if(it.fin) cls.push('done');
      cells += `<button class="${cls.join(' ')}" data-n="${it.n}" aria-label="${esc(tp.name+', '+longDate(dt)+(it.fin?', finished':''))}"><span class="dn">${dt.getDate()}</span><span class="dl">${tp.type}</span><i class="tk ${it.fin ? 'done' : 'plan'}"></i></button>`;
    }else{
      cells += `<div class="${cls.join(' ')} rest"><span class="dn">${dt.getDate()}</span><span class="dl"></span><i class="tk none"></i></div>`;
    }
  }

  const wkStart = sundayOf(today), wkEnd = addDays(wkStart, 6);
  const inWeek = sequence(wkEnd).filter(it=>it.date >= wkStart && it.date <= wkEnd);
  const rows = inWeek.map(it=>{
    const tp = tplOf(it.n), k = dkey(it.date);
    const tag = it.fin ? '<span class="tag fin">Finished</span>' : k === todayK ? '<span class="tag now">Today</span>' : '';
    return `<button class="wrow" data-n="${it.n}"><div><b>${tp.name}</b><span class="s">${shortDate(it.date)}, ${tp.focus}</span></div>${tag}</button>`;
  }).join('');
  const busy = new Set(inWeek.map(it=>it.date.getDay()));
  const free = [0,1,2,3,4,5,6].filter(o=>!busy.has(o)).map(o=>DAYS[o]);
  const freeText = free.length ? `No workout is planned on ${free.join(' or ')} this week.` : 'Every day this week has a workout planned.';

  let startCard = '';
  if(nextIdx() === 0){
    const s0 = sequence(today)[0].date;
    startCard = `<section class="card"><label class="f" for="startDate">First workout</label>
      <input id="startDate" type="date" value="${dkey(s0)}">
      <button class="tool" id="startApply" type="button" style="margin-top:10px">Use this date</button>
      <p class="muted" style="margin-top:8px">The first workout is on ${esc(longDate(s0))} right now.</p>
      <p class="muted">The first workout starts on this date, with the next four on the following days and two rest days after that. Pick yesterday or an earlier day if you already did it, then open it from the calendar to fill it in.</p></section>`;
  }

  // week check: five finished workouts inside one Sunday to Saturday week earns the mark
  let wkRows = '', fullWeeks = 0;
  for(let ws = gridStart; ws <= gridEnd; ws = addDays(ws, 7)){
    const we = addDays(ws, 6), a = dkey(ws), b = dkey(we);
    const cnt = seq.filter(it => it.fin && dkey(it.date) >= a && dkey(it.date) <= b).length;
    const full = cnt >= TPL.length, past = we < today, cur = ws <= today && today <= we;
    if(full && ws.getMonth() === first.getMonth() || full && we.getMonth() === first.getMonth()) fullWeeks++;
    const dots = Array.from({length:TPL.length}, (_, i) => `<i class="${i < cnt ? 'on' : ''}"></i>`).join('');
    const lbl = ws.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' to ' + we.toLocaleDateString(undefined,{month:'short',day:'numeric'});
    wkRows += `<div class="wk ${full ? 'full' : ''} ${cur ? 'cur' : ''} ${past && !full ? 'miss' : ''}"><span class="wl">${lbl}</span><span class="wd">${dots}</span><span class="wm">${full ? '\u2713' : (cnt ? cnt + ' of ' + TPL.length : (past ? '' : ''))}</span></div>`;
  }

  // the top: today's workout (or the next one), what it works, and one button to do it
  const items = sequence(addDays(today, 30)), tIt = items.find(it => dkey(it.date) === todayK) || items.find(it => !it.fin && it.date >= today);
  let hero = '';
  if(tIt && nextIdx() > 0 || tIt && state.train.start){
    const tp = tplOf(tIt.n), rec = sessRec(tIt.n), exs = rec && rec.ex ? rec.ex.map((e, j) => ({n:e.n, sets:e.sets.length || tp.ex[j].sets})) : tp.ex;
    const isToday = dkey(tIt.date) === todayK, logged = rec ? rec.ex.reduce((a, e) => a + e.sets.filter(x => x.ok).length, 0) : 0;
    const nSets = exs.reduce((a, e) => a + e.sets, 0), burn = workoutBurn(tp), mm = muscleMap(exs);
    const eyebrow = tIt.fin ? 'Done today' : isToday ? 'Today' : 'Next \u00b7 ' + tIt.date.toLocaleDateString(undefined, {weekday:'long'});
    // can't do this one today: swap in another from this block of five, or push everything back a day
    let heroOpts = '';
    if(!tIt.fin && tIt.n === nextIdx()){
      const end = (Math.floor(tIt.n / TPL.length) + 1) * TPL.length - 1, opts = [];
      for(let m = tIt.n + 1; m <= end; m++) opts.push(`<option value="${m}">${esc(tplOf(m).name)}, ${esc(tplOf(m).focus)}</option>`);
      heroOpts = `<div class="tOpts">${opts.length ? `<label class="chipB chipSel">Swap workout<select id="heroSwap" data-n="${tIt.n}" aria-label="Swap in a different workout"><option value="">Swap workout</option>${opts.join('')}</select></label>` : ''}<button class="chipB" id="heroPush" type="button">Push back a day</button></div>`;
    }
    const btn = tIt.fin ? 'Review today\u2019s workout' : logged ? 'Continue today\u2019s workout' : isToday ? 'Start today\u2019s workout' : 'Rest day \u00b7 open ' + tp.name;
    hero = `<section class="card obj tHero ${tIt.fin ? 'fin' : ''}">
        <div class="tHeroTx">
          <div class="heroLbl">${eyebrow}</div>
          <div class="heroNum tName">${esc(tp.name)}</div>
          <div class="tFocus">${esc(tp.focus.charAt(0).toUpperCase() + tp.focus.slice(1))}</div>
          <div class="tStats"><span><b class="num">${exs.length}</b> exercises</span><span><b class="num">${logged ? logged + '/' : ''}${nSets}</b> sets</span><span><b class="num">~${burn.cal}</b> cal</span></div>
        </div>
        <div class="tFigs">${bodySVG('front', mm, tIt.fin)}${bodySVG('back', mm, tIt.fin)}</div>
      </section>
      <button class="bigBtn" type="button" data-open="${tIt.n}">${btn}</button>${heroOpts}`;
  }
  $('tBody').innerHTML = hero + `
    <section class="card cal">
      <div class="dow"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
      <div class="grid">${cells}</div>
    </section>
    <p class="legend">U marks an upper body day and L a lower body day; a solid blue line under it means finished. If you skip a day, that workout and every one after it slides back a day on its own. Tap any of them to open it, log your sets, and check it off when you finish.</p>
    ${startCard}
    <section class="card"><h2>This week</h2><div class="wrows">${rows || '<p class="empty">Nothing is scheduled this week.</p>'}</div>
      <p class="muted">${freeText}</p></section>`;

function renderSessionView(){
  const n = openN, s = infoOf(n), ni = nextIdx();
  let rec = sessRec(n);
  if(!rec) rec = state.train.sessions[sKey(n)] = makeRec(n);
  const todayK = dkey(startOfToday());
  let when;
  if(s.fin) when = `Finished on ${longDate(pd(rec.doneOn))}.`;
  else if(s.dk === todayK) when = 'Planned for today.';
  else when = `Planned for ${longDate(s.date)}.`;

  // untouched sets follow the latest suggestion, sets you have edited or checked stay as you left them
  rec.ex.forEach((e,j)=>{
    const sg = suggest(s.tpl.ex[j], e.n, n);
    e.sets.forEach(st=>{ if(st.auto && !st.ok) st.w = sg.w; });
  });

  const nAll = rec.ex.reduce((a,e)=>a+e.sets.length, 0);
  const nOk = rec.ex.reduce((a,e)=>a+e.sets.filter(x=>x.ok).length, 0);

  const exHtml = rec.ex.map((e,j)=>{
    const te = s.tpl.ex[j], sg = suggest(te, e.n, n);
    const alts = [te.n].concat(te.alts).filter(x=>x !== e.n);
    const head = te.ab && !(j > 0 && s.tpl.ex[j-1].ab) ? '<h2 style="margin:26px 0 0">Ab work</h2>' : '';
    const bw = BW_EX.has(e.n);
    const sets = e.sets.map((st,k)=>`

    return `${head}<section class="ex" data-j="${j}">
      <div class="exHead"><b>${esc(e.n)}</b><span>${te.sets} sets of ${te.lo} to ${te.hi}</span></div>
      <div class="exMeta"><span class="exMus">${esc(exMuscles(e.n))}</span>${EX_HOW[e.n] ? `<button class="howBtn" type="button" data-how="${esc(e.n)}">How to</button>` : ''}</div>

    </section>`;
  }).join('');

  let footer;
  if(n === ni && !rec.done) footer = `<button class="primary" id="doneBtn">Mark workout as finished</button>`;

    ? `<button class="tool" id="pushBtn" type="button">Push back a day</button>
       <p class="muted">Pushing back moves this workout and every one after it a day later.</p>` : '';

    for(let m = n + 1; m <= end; m++) opts.push(`<option value="${m}">${esc(tplOf(m).name)}, ${esc(tplOf(m).focus)}</option>`);

       <p class="muted">Picking one trades places with this workout, so nothing gets skipped and the rest of the week keeps its order.</p>`;
  }

  $('tBody').innerHTML = `
    <button class="back" id="tBack">‹ Back to the calendar</button>
    <div class="sessTitle">${s.tpl.name}</div>
    <p class="sessSub">${esc(s.tpl.focus.charAt(0).toUpperCase()+s.tpl.focus.slice(1))}. ${when}</p>
    <p class="burn"><b class="num">~${workoutBurn(s.tpl).cal}</b> cal burned, about ${workoutBurn(s.tpl).min} min</p>

    ${exHtml}
    ${footer}
    ${push || swapUI ? `<details class="more"><summary>Can\u2019t train today?</summary>${push}${swapUI}</details>` : ''}`;
}

/* ---------- progress: weigh-ins, body fat estimate, lift history ---------- */
let pRange = 84, pLift = null;
const RANGES = [[28,'4 weeks'],[84,'12 weeks'],[0,'All time']];
const fmt1 = n => String(Math.round(n*10)/10);
const longShort = d => d.toLocaleDateString(undefined,{month:'short',day:'numeric'});

function niceStep(x){
  const p = Math.pow(10, Math.floor(Math.log10(x))), f = x/p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
function movingAvg(pts, days){
  return pts.map(p=>{
    const lo = addDays(p.d, -(days-1)), w = pts.filter(q=>q.d <= p.d && q.d >= lo);
    return {d:p.d, v:w.reduce((a,q)=>a+q.v, 0)/w.length};
  });
}
// YMCA estimate for men: needs only weight in pounds and waist in inches at the navel
function bodyFatPct(w, wa){ return Math.max(3, Math.min(60, (-98.42 + 4.15*wa - 0.082*w)/w*100)); }

function bodySeries(){
  const keys = Object.keys(state.body).sort(), out = {w:[], wa:[], bf:[], lean:[]};
  let lw = null, lwa = null;
  keys.forEach(k=>{
    const b = state.body[k], d = pd(k);
    if(b.w){ out.w.push({d, v:+b.w}); lw = {d, v:+b.w}; }
    if(b.wa){ out.wa.push({d, v:+b.wa}); lwa = {d, v:+b.wa}; }
    const w = b.w ? +b.w : (lw && (d - lw.d)/864e5 <= 10 ? lw.v : null);
    const wa = b.wa ? +b.wa : (lwa && (d - lwa.d)/864e5 <= 10 ? lwa.v : null);
    if(w && wa){ const bf = bodyFatPct(w, wa); out.bf.push({d, v:bf}); out.lean.push({d, v:w*(1-bf/100)}); }
  });
  return out;
}
const inRange = pts => {
  if(!pRange) return pts;
  const lo = addDays(startOfToday(), -pRange);
  return pts.filter(p=>p.d >= lo);
};

function chartSVG(raw, opt){
  opt = opt || {};
  const W = 340, H = 190, L = 6, R = 46, T = 16, B = 26;
  const trend = opt.trend ? movingAvg(raw, 7) : null;
  const vals = raw.concat(trend || []).map(p=>p.v);
  let lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if(hi - lo < (opt.minSpan || 1)){ const m = (hi+lo)/2; lo = m - (opt.minSpan || 1)/2; hi = m + (opt.minSpan || 1)/2; }
  const pad = (hi-lo)*0.14; lo -= pad; hi += pad;
  const step = niceStep((hi-lo)/3);
  const t0 = raw[0].d.getTime(), t1 = Math.max(raw[raw.length-1].d.getTime(), t0 + 6*864e5);
  const X = d => L + (d.getTime()-t0)/(t1-t0)*(W-L-R), Y = v => T + (hi-v)/(hi-lo)*(H-T-B);
  let g = '';
  for(let v = Math.ceil(lo/step)*step; v <= hi; v += step){
    g += `<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" class="cg"/><text x="${W-R+7}" y="${(Y(v)+3.5).toFixed(1)}" class="ct">${fmt1(v)}</text>`;
  }
  const path = pts => pts.map((p,i)=>(i ? 'L' : 'M') + X(p.d).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  let body = '';
  if(trend){
    body += `<path d="${path(raw)}" class="cr"/>` + raw.map(p=>`<circle cx="${X(p.d).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.6" class="cd"/>`).join('') + `<path d="${path(trend)}" class="cl"/><circle cx="${X(trend[trend.length-1].d).toFixed(1)}" cy="${Y(trend[trend.length-1].v).toFixed(1)}" r="3.6" class="cn"/>`;
  }else{
    body += `<path d="${path(raw)}" class="cl thin"/>` + raw.map(p=>`<circle cx="${X(p.d).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" class="cf"/>`).join('');
    if(opt.pr){ const px = X(opt.pr.d), py = Y(opt.pr.v);
      body += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="7" class="cpr"/><text x="${px.toFixed(1)}" y="${(py-11).toFixed(1)}" class="cs" text-anchor="middle">✦</text>`; }
  }
  const mid = new Date((t0+t1)/2);
  const xl = `<text x="${L}" y="${H-6}" class="ct">${longShort(raw[0].d)}</text>` +
             `<text x="${(L+W-R)/2}" y="${H-6}" class="ct" text-anchor="middle">${longShort(mid)}</text>` +
             `<text x="${W-R}" y="${H-6}" class="ct" text-anchor="end">${longShort(new Date(t1))}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || 'Chart')}">${g}${body}${xl}</svg>`;
}

function measureCard(title, pts, unit, opts){
  const r = inRange(pts);
  if(r.length < 2) return `<section class="card"><h2>${title}</h2><p class="empty">${pts.length ? 'One more entry and the line starts to draw.' : opts.empty}</p></section>`;
  const tr = movingAvg(r, 7), now = tr[tr.length-1].v, first = tr[0].v, d = now - first;
  const days = Math.max(1, Math.round((r[r.length-1].d - r[0].d)/864e5)), span = days >= 14 ? Math.round(days/7) + ' weeks' : days + ' days';
  const delta = Math.abs(d) < 0.05 ? `holding steady over ${span}` : `${d < 0 ? 'down' : 'up'} ${fmt1(Math.abs(d))}${unit === '%' ? ' points' : ' ' + unit} over ${span}`;
  return `<section class="card"><h2>${title}</h2>
    <div class="big num">${fmt1(r[r.length-1].v)}<span class="unit">${unit}</span></div>
    <p class="delta">${delta}, going by the seven day average.</p>
    ${chartSVG(r, {trend:true, label:title, minSpan:opts.minSpan})}
    <p class="muted">${opts.foot || 'The line is a seven day average, and the dots are single readings.'}</p></section>`;
}

function liftHistory(){
  const h = {};
  Object.keys(state.train.sessions).forEach(k=>{
    const rec = state.train.sessions[k], date = rec.doneOn || rec.when; if(!date) return;
    (rec.ex || []).forEach(e=>{
      const ok = e.sets.filter(s=>s.ok && s.r > 0); if(!ok.length) return;
      const top = Math.max.apply(null, ok.map(s=>+s.w || 0));
      const best = ok.filter(s=>(+s.w || 0) === top).sort((a,b)=>b.r - a.r)[0];
      (h[e.n] = h[e.n] || []).push({d:pd(date), top, reps:best.r, sets:ok});
    });
  });
  Object.keys(h).forEach(n=>h[n].sort((a,b)=>a.d - b.d));
  return h;
}

function liftCard(){
  const h = liftHistory(), names = Object.keys(h).sort((a,b)=>h[b][h[b].length-1].d - h[a][h[a].length-1].d);
  if(!names.length) return `<section class="card"><h2>Lift history</h2><p class="empty">Finish a set in the training tab and the lift shows up here with a line that tracks it session by session.</p></section>`;
  if(!pLift || !h[pLift]) pLift = names[0];
  const all = h[pLift], bw = all.every(x=>x.top === 0);
  const val = x => bw ? x.reps : x.top;
  let pr = all[0]; all.forEach(x=>{ if(val(x) > val(pr) || (val(x) === val(pr) && x.reps > pr.reps)) pr = x; });
  const r = pRange ? all.filter(x=>x.d >= addDays(startOfToday(), -pRange)) : all;
  const prTxt = bw ? `${pr.reps} reps` : `${pr.top} lb for ${pr.reps}`;
  const chart = r.length >= 2
    ? chartSVG(r.map(x=>({d:x.d, v:val(x)})), {label:pLift, minSpan:bw ? 4 : 10, pr: r.indexOf(pr) >= 0 ? {d:pr.d, v:val(pr)} : null})
    : `<p class="empty">${all.length < 2 ? 'Do this lift once more and the line starts to draw.' : 'Only one session falls in this stretch of time, so try a longer range.'}</p>`;
  const recent = all.slice(-5).reverse().map(x=>`<div class="hist"><span>${longShort(x.d)}</span><span class="num">${x.sets.map(s=>`${s.w ? s.w : 'bw'}×${s.r}`).join(', ')}</span></div>`).join('');
  return `<section class="card"><h2>Lift history</h2>
    <label class="f" for="liftSel">Exercise</label>
    <select id="liftSel">${names.map(n=>`<option ${n === pLift ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
    <div class="big num" style="margin-top:18px">${bw ? pr.reps : pr.top}<span class="unit">${bw ? 'reps' : 'lb'}</span></div>
    <p class="delta">✦ best set, ${prTxt}, on ${longShort(pr.d)}. ${all.length} session${all.length > 1 ? 's' : ''} logged.</p>
    ${chart}<div style="margin-top:14px">${recent}</div></section>`;
}

function backupCard(){

// expenditure: over the last four weeks, what you ate minus what went into (or came out of) body weight.
// weight slope is a straight-line fit through the weigh-ins, so one salty day doesn't swing it; ~3,500 cal per lb.
// today is left out (still being logged), and days with almost nothing logged are skipped rather than read as fasting.
function expenditure(){
  const end = addDays(startOfToday(), -1), start = addDays(end, -27);
  const ws = Object.keys(state.body).sort().map(k => ({d:pd(k), v:+state.body[k].w})).filter(p => p.v && p.d >= start && p.d <= end);
  const eats = [];
  for(let d = new Date(start); d <= end; d = addDays(d, 1)){
    const l = state.days[dkey(d)]; if(!l || !l.length || isOff(dkey(d))) continue;
    const c = totals(l).cal; if(c >= 800) eats.push(c);
  }
  const span = ws.length >= 2 ? Math.round((ws[ws.length-1].d - ws[0].d)/864e5) : 0;
  const need = {days: Math.max(0, 14 - eats.length), weighins: Math.max(0, 6 - ws.length), span: Math.max(0, 14 - span)};
  if(need.days || need.weighins || need.span) return {ready:false, need, eats:eats.length, ws:ws.length};
  const x = ws.map(p => (p.d - ws[0].d)/864e5), y = ws.map(p => p.v);
  const mx = x.reduce((a,b)=>a+b,0)/x.length, my = y.reduce((a,b)=>a+b,0)/y.length;
  const slope = x.reduce((a,xi,i)=>a + (xi-mx)*(y[i]-my), 0) / x.reduce((a,xi)=>a + (xi-mx)**2, 0);   // lb per day
  const intake = eats.reduce((a,b)=>a+b,0)/eats.length;
  return {ready:true, tdee: Math.round((intake - slope*3500)/10)*10, week: slope*7, intake: Math.round(intake), days: eats.length, ws: ws.length};
}
function expenditureCard(){
  const x = expenditure();
  if(!x.ready){
    const left = Math.max(x.need.days, x.need.span);
    const bits = [];
    if(x.need.days) bits.push(`${x.need.days} more ${x.need.days === 1 ? 'day' : 'days'} of logged food`);
    if(x.need.weighins) bits.push(`${x.need.weighins} more ${x.need.weighins === 1 ? 'weigh-in' : 'weigh-ins'}`);
    if(!x.need.days && x.need.span) bits.push(`weigh-ins spread over ${x.need.span} more days`);
    return `<section class="card xp"><h2>Expenditure</h2>
      <div class="xpCal"><div class="xpBar"><i style="width:${Math.round(100*(1 - left/14))}%"></i></div><span class="num">${left ? left + (left === 1 ? ' day' : ' days') + ' to go' : 'almost there'}</span></div>
      <p class="muted">Calibrating. It needs ${bits.join(' and ')} in the last four weeks to read what you burn from what you eat and how your weight moves.</p></section>`;
  }
  const w = x.week, steady = Math.abs(w) < 0.1;
  const rate = steady ? '0.0' : (w < 0 ? '\u2212' : '+') + Math.abs(w).toFixed(1);
  return `<section class="card xp"><h2>Expenditure</h2>
    <div class="xpGrid">
      <div><div class="big num">${x.tdee.toLocaleString()}<span class="unit">cal</span></div><small>burned a day</small></div>
      <div><div class="big num">${rate}<span class="unit">lb/wk</span></div><small>${steady ? 'holding steady' : w < 0 ? 'average loss' : 'average gain'}</small></div>
    </div>
    <p class="muted">From the last four weeks: ${x.days} days of food averaging ${x.intake.toLocaleString()} cal, and ${x.ws} weigh-ins.</p></section>`;
}

function renderProgress(){
  const s = bodySeries();
  const range = `<div class="range">${RANGES.map(([d,l])=>`<button type="button" data-r="${d}" class="${d === pRange ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  $('pBody').innerHTML = expenditureCard() + range +
    measureCard('Weight', s.w, 'lb', {empty:'Log your weight in the nutrition tab and a line starts here after the second entry.'}) +
    measureCard('Waist', s.wa, 'in', {minSpan:1, empty:'Log your waist in the nutrition tab to start this line.'}) +
    measureCard('Body fat estimate', s.bf, '%', {minSpan:2, empty:'Log your weight and your waist, and an estimate appears here.',
      foot:'This uses a standard formula for men that needs only weight and waist at the navel, and it can be off by several points. The direction of the line is the useful part.'}) +
    (s.lean.length >= 2 ? measureCard('Lean mass estimate', s.lean, 'lb', {minSpan:2, foot:'Weight minus the estimated fat. If this holds or rises while your waist shrinks, the recomp is working.'}) : '') +
    liftCard() + backupCard();
  $('pSub').textContent = (Object.keys(state.body).length || Object.keys(state.train.sessions).length) ? '' : 'Nothing to chart yet';
}

/* ---------- backup and restore ---------- */
function bkMsg(t){ const el = $('bkMsg'); if(el) el.textContent = t; }
async function exportData(){
  state.meta = state.meta || {}; state.meta.lastBackup = dkey(new Date()); save();
  const name = 'macro-log-backup-' + dkey(new Date()) + '.json';
  const file = new File([JSON.stringify({app:'macro-log', version:1, saved:new Date().toISOString(), state}, null, 1)], name, {type:'application/json'});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Macro Log backup'}); renderProgress(); return; }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  renderProgress(); bkMsg('The backup was saved as ' + name + '.');
}
function importData(file){
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const j = JSON.parse(rd.result), st = j && j.state ? j.state : j;
      if(!st || typeof st !== 'object' || typeof st.days !== 'object' || typeof st.targets !== 'object') throw new Error('shape');
      const when = j && j.saved ? j.saved.slice(0,10) : 'this file';
      if(!confirm('Replace everything on this phone with the backup from ' + when + '?')) return;
      state = st; normalizeState(); applyTheme(); save();
      current = new Date(); render(); renderTrain(); renderProgress(); bkMsg('The backup was restored.');
    }catch(e){ bkMsg('That file did not look like a Macro Log backup, so nothing was changed.'); }
  };
  rd.readAsText(file);
}

/* ---------- copy the previous day ---------- */
$('copyPrev').onclick = () => {
  const prev = state.days[dkey(addDays(current, -1))] || [];
  if(!prev.length) return;
  const k = dkey(current);
  state.days[k] = (state.days[k] || []).concat(prev.map(e=>Object.assign({}, e, {t:Date.now()})));
  save(); render();
};

function normalizeState(){
  state.targets = state.targets || {cal:2400, pro:180, carb:250, fat:70};
  state.days = state.days || {}; state.body = state.body || {}; state.custom = state.custom || [];
  state.train = state.train || {}; state.train.sessions = state.train.sessions || {}; state.meta = state.meta || {};
  state.recipes = state.recipes || []; state.off = state.off || {}; state.train.plates = state.train.plates || {};
  renameLifts();
  fixFutureDates();
}
// his gym has a V squat, a linear leg press and a seated leg press (no hack squat): older logs carry the old names
function renameLifts(){
  const MAP = {'Hack squat':'V squat','Leg press':'Linear leg press','Leg press, feet high and wide':'Linear leg press, feet high and wide','Hack squat, feet high':'V squat, feet high'};
  let changed = false;
  Object.values(state.train.sessions).forEach(ss => (ss.ex || []).forEach(x => { if(MAP[x.n]){ x.n = MAP[x.n]; changed = true; } }));
  if(changed) save();
}
// older versions saved a weigh-in to whatever day was on screen, so a day swiped ahead by mistake could hold
// tomorrow's weight. a weigh-in can't be in the future: move it to today (if today has none) or drop it.
// food goes back to the day it was logged (or today).
function fixFutureDates(){
  const tk = dkey(new Date()); let changed = false;
  Object.keys(state.body).filter(k => k > tk).sort().forEach(k => {
    if(!state.body[tk]) state.body[tk] = state.body[k];
    delete state.body[k]; changed = true;
  });
  Object.keys(state.days).filter(k => k > tk).forEach(k => {
    // food on a future day can't have been eaten then: back to the day it was logged, or today if that's unknown
    state.days[k].forEach(e => { const rk = e.t ? dkey(new Date(e.t)) : tk; (state.days[rk > tk ? tk : rk] = state.days[rk > tk ? tk : rk] || []).push(e); });
    delete state.days[k]; changed = true;
  });
  if(changed) save();
}

/* ---------- swipe gestures ---------- */
// only the content below each header moves, so the frosted header never has to re-blur a moving page
(function(){
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const views = () => ['viewN','viewL','viewT','viewP'].map($);
  const current = () => views().find(v => !v.hidden);
  const parts = v => v ? [...v.children].filter(c => c.tagName !== 'HEADER') : [];
  const W = () => window.innerWidth;
  const ease = 'cubic-bezier(.2,.8,.2,1)';
  let busy = false;

  const setX = (els, x) => { const o = String(1 - Math.min(Math.abs(x), W())/W()*.6);
    els.forEach(e => { e.style.transform = x ? `translate3d(${x}px,0,0)` : ''; e.style.opacity = x ? o : ''; }); };
  const prep = (els, on) => els.forEach(e => e.style.willChange = on ? 'transform, opacity' : '');
  // never wait on an animation longer than it should take, so a paused page can't leave a swipe stuck
  const done = (a, ms) => Promise.race([a.finished.catch(()=>{}), new Promise(r => setTimeout(r, ms + 120))]);
  const run = (els, frames, opts) => Promise.all(els.map(e => e.animate ? done(e.animate(frames, opts), opts.duration) : null));
  const op = x => 1 - Math.min(Math.abs(x), W())/W()*.6;

  // new content glides in from side `from` (+1 right, -1 left)
  async function slideIn(view, from){
    const els = parts(view); if(!els.length) return;
    if(reduce){ await run(els, [{opacity:0},{opacity:1}], {duration:160}); return; }
    prep(els, true);
    await run(els, [{transform:`translate3d(${from*56}px,0,0)`,opacity:0},{transform:'translate3d(0,0,0)',opacity:1}], {duration:260, easing:ease});
    prep(els, false);
  }
  // current content leaves toward `dir` starting from wherever the finger left it, then fn swaps it, then the new one arrives
  async function leave(view, dir, x0, fn){
    if(busy) return; busy = true;
    try { await leaveRun(view, dir, x0, fn); } finally { busy = false; }
  }
  async function leaveRun(view, dir, x0, fn){
    const els = parts(view);
    if(els.length && !reduce){
      const x1 = dir*W()*.45, dur = Math.max(90, Math.min(180, Math.abs(x1 - x0)/1.8));
      prep(els, true);
      const anims = els.map(e => e.animate([{transform:`translate3d(${x0}px,0,0)`,opacity:op(x0)},{transform:`translate3d(${x1}px,0,0)`,opacity:0}], {duration:dur, easing:'cubic-bezier(.4,0,1,1)', fill:'forwards'}));
      setX(els, 0);
      await Promise.all(anims.map(a => done(a, dur)));
      fn(); anims.forEach(a => a.cancel()); prep(els, false);
      await slideIn(current(), -dir);
    } else { setX(els, 0); fn(); await slideIn(current(), -dir); }
  }
  async function snapBack(view, x0){
    const els = parts(view); setX(els, 0);
    if(!x0 || reduce){ prep(els, false); return; }
    await run(els, [{transform:`translate3d(${x0}px,0,0)`,opacity:op(x0)},{transform:'translate3d(0,0,0)',opacity:1}], {duration:220, easing:ease});
    prep(els, false);
  }

  // arrows and tab taps slide the content the same way a swipe does
  [['prev',-1],['next',1],['lPrev',-1],['lNext',1],['tPrev',-1],['tNext',1]].forEach(([id,d])=>$(id).addEventListener('click',ev=>{ if(!busy && ev.isTrusted) slideIn(current(), d); }));
  const order = ['tabN','tabL','tabT','tabP'];
  order.forEach((id,i)=>$(id).addEventListener('click',ev=>{ const was = window.__tabI; window.__tabI = i; if(ev.isTrusted && was != null && was !== i) slideIn(current(), i > was ? 1 : -1); }));

  // where a swipe goes: always the next section (an open workout too; its back button or an edge swipe returns
  // to the calendar). dir -1 means the finger moved left.
  function swipeTarget(dir){
    const v = current(); if(!v) return null;
    if(v.id === 'viewN' && nMode === 'day') return () => (dir < 0 ? $('next') : $('prev')).click();
    const i = order.findIndex(id => $(id).getAttribute('aria-current') === 'page'), j = i - dir;
    if(i < 0 || j < 0 || j >= order.length) return null;
    return () => $(order[j]).click();
  }
  window.__tabI = 0;

  // a subsection that an edge swipe backs out of; add more here as they appear
  const subBack = () => (!$('viewT').hidden && openN !== null) ? $('tBack') : (!$('viewN').hidden && nMode === 'day') ? $('nBack') : null;

  const EDGE = 28;
  let sx = 0, sy = 0, st0 = 0, st = null, mode = null, view = null, lock = false, dx = 0, raf = 0, els = [], back = null;
  const paint = () => { raf = 0; setX(els, dx); };
  document.addEventListener('touchstart', ev=>{
    if(busy || ev.touches.length > 1){ mode = null; return; }
    const t = ev.touches[0]; sx = t.clientX; sy = t.clientY; st0 = ev.timeStamp; st = ev.target; lock = false; dx = 0; view = current(); els = [];
    if(st.closest('input, select, textarea, button.chk, #scanModal, #howModal, #plateModal, .eEdit, #composer')){ mode = null; return; }
    const edge = sx <= EDGE ? 1 : sx >= W() - EDGE ? -1 : 0;   // 1 = left edge, -1 = right edge
    back = edge ? subBack() : null;
    mode = !back ? 'page' : edge === 1 ? 'backL' : 'backR';
  }, {passive:true});
  document.addEventListener('touchmove', ev=>{
    if(!mode || !view) return;
    const t = ev.touches[0], mx = t.clientX - sx, my = t.clientY - sy;
    if(!lock){ if(Math.abs(mx) > 10 && Math.abs(mx) > 1.5*Math.abs(my)) { lock = true; sx += Math.sign(mx)*10; } else { if(Math.abs(my) > 14) mode = null; return; } }
    dx = t.clientX - sx;
    if(mode === 'backL') dx = Math.max(0, dx);
    else if(mode === 'backR') dx = Math.min(0, dx);
    else if(st.closest('.entry')) return;
    else if(!swipeTarget(dx < 0 ? -1 : 1)) dx *= .25;   // nothing that way, so it only gives a little
    if(!els.length){ els = parts(view); prep(els, true); }
    if(!raf) raf = requestAnimationFrame(paint);
  }, {passive:true});
  const end = ev=>{
    if(!mode) return;
    const m = mode; mode = null;
    if(raf){ cancelAnimationFrame(raf); raf = 0; }
    const moved = els.length > 0, x0 = dx;
    const dt = Math.max(1, ev.timeStamp - st0), v = Math.abs(x0)/dt;
    const commit = lock && ev.type === 'touchend' && (Math.abs(x0) > W()*.22 || (Math.abs(x0) > 40 && v > .45));
    const fin = () => { if(moved) snapBack(view, x0); };

    if(m === 'backL' || m === 'backR'){
      if(commit) leave(view, Math.sign(x0), x0, () => back.click()); else fin();
      return;
    }
    const entry = st && st.closest ? st.closest('.entry') : null;
    if(entry){
      if(lock && Math.abs(x0) > 30){
        document.querySelectorAll('.entry.swiped').forEach(e=>{ if(e !== entry) e.classList.remove('swiped'); });
        entry.classList.toggle('swiped', x0 < 0);
      }
      return;
    }
    if(lock) document.querySelectorAll('.entry.swiped').forEach(e=>e.classList.remove('swiped'));
    if(!commit || !moved){ fin(); return; }
    const dir = x0 < 0 ? -1 : 1;
    const go = swipeTarget(dir);
    if(go) leave(view, dir, x0, go); else fin();
  };
  document.addEventListener('touchend', end, {passive:true});
  document.addEventListener('touchcancel', end, {passive:true});
})();

// it's an app, not a page: no pinch zoom (iOS ignores user-scalable in some cases)
['gesturestart','gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive:false}));
// the launch mark shows once per launch, then gives way to today
(function(){
  const sp = document.getElementById('splash'); if(!sp) return;
  let seen = false; try{ seen = sessionStorage.getItem('logger-splash') === '1'; sessionStorage.setItem('logger-splash','1'); }catch(e){}
  if(seen){ sp.remove(); return; }
  const t0 = Date.now();
  window.__hideSplash = () => { setTimeout(() => { sp.classList.add('out'); setTimeout(() => sp.remove(), 500); }, Math.max(0, 750 - (Date.now() - t0))); };
})();
load().then(()=>{
  normalizeState();
  applyTheme();
  render();
  setTimeout(() => document.documentElement.classList.add('ready'), 700);
  if(window.__hideSplash) window.__hideSplash();
  if('serviceWorker' in navigator && location.protocol === 'https:'){
    // when a newer version takes over an open app, reload once so it shows right away
    const had = !!navigator.serviceWorker.controller;
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if(had && !reloaded){ reloaded = true; location.reload(); } });
    navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(r => r.update()).catch(()=>{});
    // the home screen app can sit in the background for days, so check again whenever it comes back
    document.addEventListener('visibilitychange', () => { if(!document.hidden) navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(()=>{}); });
  }
});
