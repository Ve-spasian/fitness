<!DOCTYPE html>
<html lang="en" data-theme="paper" data-skin="sport">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Logger</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Logger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0a0b0d" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0b0d" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  /* ============================================================
     Logger. One stylesheet, built on the design system's tokens.
     Spacing steps 4 8 16 24 32 48. Radii 2 10 14 20 pill.
     Type: hero 64, display 48, session 30, stat 24, section 20,
     row 16, body 15, caption 13, label 11 caps, tab 11.
     ============================================================ */
  :root{
    --ground:#f4f5f7; --surface:#ffffff; --field:#ffffff; --glass:rgba(244,245,247,.86);
    --ink:#0e1116; --ink-2:#636b78; --ink-3:#9aa1ab;
    --rule:rgba(14,17,22,.09); --rule-strong:rgba(14,17,22,.2); --track:rgba(14,17,22,.08);
    --action:#1f6fff; --on-action:#ffffff;
    --earned:#15c466; --earned-text:#0b8a45; --on-earned:#05301a; --earned-soft:#c9f3da;
    --caution:#f2b600; --over:#ef3e44;
    --fade:linear-gradient(90deg,#c9f3da 0%,#6fdc9c 45%,#15c466 100%);
    --sky1:rgba(120,170,255,.22); --sky2:rgba(255,200,150,.14);
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
    --s1:4px; --s2:8px; --s3:16px; --s4:24px; --s5:32px; --s6:48px;
    --r-mark:2px; --r-ctl:10px; --r-card:14px; --r-sheet:20px;
    --ease:cubic-bezier(.2,.8,.2,1);
    --hh:calc(78px + env(safe-area-inset-top));
    color-scheme:light;
    /* older names some code still reads */
    --bg:var(--ground); --panel:var(--surface); --muted:var(--ink-2); --line:var(--rule); --line2:var(--rule-strong);
    --acc:var(--action); --accInk:var(--on-action); --good:var(--earned); --warn:var(--caution); --danger:var(--over);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --ground:#0b0d10; --surface:#12151a; --field:#15181d; --glass:rgba(11,13,16,.84);
      --ink:#f2f4f7; --ink-2:#8b94a1; --ink-3:#5f6772;
      --rule:rgba(255,255,255,.08); --rule-strong:rgba(255,255,255,.18); --track:rgba(255,255,255,.1);
      --action:#4c95ff; --on-action:#ffffff;
      --earned:#1fdc76; --earned-text:#1fdc76; --on-earned:#05301a; --earned-soft:rgba(31,220,118,.14);
      --caution:#ffd21f; --over:#ff5a60;
      --fade:linear-gradient(90deg,#eafbf1 0%,#8de9b2 45%,#1fdc76 100%);
      color-scheme:dark;
    }
  }

  /* ---------- base ---------- */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html{-webkit-text-size-adjust:100%;touch-action:manipulation;scroll-padding-top:calc(var(--hh) + var(--s2))}
  html,body{overflow-x:clip}
  body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.45 var(--sans);letter-spacing:-.005em;
    -webkit-font-smoothing:antialiased;font-feature-settings:"kern","tnum";text-rendering:optimizeLegibility}
  .num{font-variant-numeric:tabular-nums lining-nums}
  .wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 var(--s3) 120px;overflow-x:clip}
  #viewN,#viewL,#viewT,#viewP{padding-top:var(--hh)}
  #viewT.noHead{padding-top:env(safe-area-inset-top)}
  h2{margin:0 0 var(--s3);font-size:20px;line-height:1.2;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
  p{text-wrap:pretty}
  .eyebrow,.mName,label.f,.setHead,.lgSub,.tag,.dow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
  .muted,.status,.legend,.exInfo,.sug,.sessSub,.delta,.yearNote,.pvinfo,.empty{font-size:13px;line-height:1.45;color:var(--ink-2)}
  .muted{margin:var(--s2) 0 0}
  .status{margin:var(--s2) 0 0} .status:empty{display:none}
  .empty{margin:0}
  ::selection{background:color-mix(in srgb,var(--action) 28%,transparent)}
  button{font:inherit;color:inherit;transition:transform .12s,opacity .15s,background .15s}
  button:active,.tool:active{transform:scale(.985)}
  button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--action);outline-offset:2px}

  /* ---------- header and tab bar: fixed glass ---------- */
  header{position:fixed;top:0;left:0;right:0;z-index:15;height:var(--hh);display:flex;align-items:center;justify-content:space-between;
    padding:calc(12px + env(safe-area-inset-top)) max(var(--s3), calc((100vw - 520px)/2 + var(--s3))) 12px;
    background:var(--glass);border-bottom:1px solid var(--rule);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6)}
  header button{background:none;border:0;width:44px;height:44px;font-size:26px;line-height:1;color:var(--ink);cursor:pointer;border-radius:var(--r-ctl)}
  header button:active{background:var(--track)}
  .date{text-align:center}
  .date b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
  .date span{font-size:13px;color:var(--ink-2)}
  html.home header #prev,html.home header #next{visibility:hidden}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--glass);border-top:1px solid var(--rule);
    backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);padding-bottom:env(safe-area-inset-bottom)}
  .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:var(--s1);padding:10px 0 var(--s2);background:none;border:0;position:relative;
    color:var(--ink-3);font-size:11px;font-weight:600;letter-spacing:.02em;cursor:pointer}
  .tabs button[aria-current=page]{color:var(--action)}
  .tabs button[aria-current=page]::before{content:"";position:absolute;top:-1px;left:32%;right:32%;height:2px;border-radius:1px;background:var(--action)}

  /* ---------- sections: space, not boxes. only .obj is a card ---------- */
  .card{margin:var(--s5) 0 0;padding:0}
  .card.obj{margin-top:var(--s3);padding:var(--s4) var(--s3) var(--s3);background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-card)}
  .back{display:block;background:none;border:0;font-size:15px;font-weight:600;color:var(--action);padding:var(--s3) 0 0;cursor:pointer}

  /* ---------- today's numbers ---------- */
  .heroTop{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s3)}
  .heroNum{font-size:64px;font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
  .heroLbl{margin-top:var(--s2);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
  .heroEaten{font-size:13px;color:var(--ink-2);text-align:right;padding-bottom:2px}
  .heroEaten b{display:block;font-size:24px;font-weight:700;letter-spacing:-.03em;color:var(--ink);line-height:1.1}
  .calBar{position:relative;height:8px;margin-top:var(--s3);border-radius:4px;background:var(--track);overflow:hidden}
  .calBar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--action);transition:width .6s var(--ease)}
  .calBar i.over{background:var(--over)}
  .macros{display:grid;gap:var(--s3);margin-top:var(--s3)}
  .m .mVal{margin:var(--s1) 0 var(--s2);font-size:13px;color:var(--ink-2);white-space:nowrap}
  .m .mVal b{font-size:24px;font-weight:700;letter-spacing:-.03em;color:var(--ink)}
  .m .mVal span{font-size:13px}
  .track{position:relative;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;transition:width .5s var(--ease)}
  .macros .fill{background-size:var(--span,100%) 100%!important;background-repeat:no-repeat!important}
  .fill.over{background:var(--over)!important}

  /* ---------- controls ---------- */
  input,textarea,select{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--rule-strong);border-radius:var(--r-ctl);transition:border-color .15s,box-shadow .15s}
  input,select{height:48px;padding:0 12px;width:100%;font-size:16px}
  textarea{width:100%;padding:12px;resize:none;line-height:1.45;font-size:16px}
  input::placeholder,textarea::placeholder{color:var(--ink-3)}
  input[type=checkbox]{width:auto;height:auto;accent-color:var(--action)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--action);box-shadow:0 0 0 3px color-mix(in srgb,var(--action) 22%,transparent)}
  label.f{display:block;margin-bottom:6px}
  .primary,.manual button,.two button{height:48px;background:var(--action);color:var(--on-action);border:0;border-radius:var(--r-ctl);font-weight:700;font-size:15px;cursor:pointer}
  .primary{width:100%;margin-top:var(--s3)}
  .primary:hover{opacity:.92}
  .tools{display:flex;gap:var(--s2);margin-top:var(--s3);flex-wrap:wrap}
  .tool{display:inline-flex;align-items:center;gap:var(--s2);height:40px;padding:0 14px;background:var(--field);color:var(--ink);
    border:1px solid var(--rule-strong);border-radius:var(--r-ctl);font-size:14px;font-weight:600;cursor:pointer}
  .tool svg{flex:none;color:var(--ink-2)}
  .ghostBtn{flex:none;height:40px;padding:0 var(--s3);border:1px solid var(--rule-strong);background:none;border-radius:var(--r-ctl);font-weight:600;color:var(--action);cursor:pointer}
  .ghostBtn.doneB{color:var(--earned-text);border-color:transparent}
  .lnk,.moreBtn{background:none;border:0;padding:var(--s2) 0;font-size:14px;font-weight:600;color:var(--action);cursor:pointer}
  .lnk.warn{color:var(--over)}
  .x{background:none;border:0;color:var(--ink-3);font-size:22px;line-height:1;cursor:pointer;padding:6px 10px;border-radius:var(--r-ctl)}
  .x:hover{background:var(--track)}
  .chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
  .chip{background:none;border:1px solid var(--rule-strong);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--ink);cursor:pointer}
  .chip.on{background:var(--action);border-color:var(--action);color:var(--on-action)}
  .seg,.range{display:inline-flex;border:1px solid var(--rule-strong);border-radius:var(--r-ctl);padding:2px;gap:2px}
  .seg button,.range button{border:0;background:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer}
  .seg button[aria-pressed="true"],.range button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .range{margin-top:var(--s3)}
  details.custom{margin-top:var(--s3);border-top:1px solid var(--rule);padding-top:var(--s3)}
  summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;justify-content:space-between}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";font-size:20px;font-weight:400;color:var(--ink-2)}
  details[open] summary::after{content:"\2212"}
  .form{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2);margin-top:var(--s3)}
  .form .name{grid-column:1/-1}
  .save{grid-column:1/-1;font-size:13px;color:var(--ink-2);display:flex;gap:var(--s2);align-items:flex-start;text-transform:none;letter-spacing:0;font-weight:400}
  .targets{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2);margin-top:var(--s3)}
  .two{display:grid;grid-template-columns:1fr 1fr auto;gap:var(--s2);align-items:end}
  .two button{padding:0 var(--s4)}
  .btnRow{display:flex;gap:var(--s2);margin-top:var(--s3);align-items:center}
  .btnRow .primary{margin-top:0;flex:1}
  .btnRow .tool{height:48px}

  /* ---------- logging ---------- */
  #recentPanel{margin-top:var(--s3)}
  #recentPanel .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--s3));padding:0 var(--s3)}
  #recentPanel .chips::-webkit-scrollbar{display:none}
  #recentPanel .chip{flex:none}
  #suggest{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:var(--s2) calc(-1 * var(--s3)) 0;padding:0 var(--s3)}
  #suggest::-webkit-scrollbar{display:none}
  #suggest .chip{flex:none;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #preview{margin-top:var(--s2)}
  .pv{border-top:1px solid var(--rule);padding:var(--s3) 0}
  .pv .fsel{width:100%;margin-bottom:var(--s2);font-weight:600}
  .pvrow{display:flex;gap:var(--s2);align-items:center}
  .pvrow .qty{width:88px;flex:none}
  .pvrow .usel{flex:1;min-width:0}
  .pvcal{font-size:24px;font-weight:700;letter-spacing:-.03em;min-width:56px;text-align:right}
  .pvinfo{margin-top:var(--s2)}
  .pvname{font-size:14px}
  .entry{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);padding:12px 0;border-top:1px solid var(--rule);position:relative;overflow:hidden;cursor:pointer}
  .entry:first-child{border-top:0;padding-top:0}
  .entry .t{min-width:0}
  .entry .t b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .entry .t span{font-size:13px;color:var(--ink-2)}
  .entry .r{display:flex;align-items:center;gap:var(--s1)}
  .entry .r .num{font-size:16px;font-weight:700}
  .entry .t,.entry .r{transition:transform .25s var(--ease)}
  .entry .del{position:absolute;right:0;top:0;bottom:0;width:92px;border:0;background:var(--over);color:#fff;font-weight:700;cursor:pointer;transform:translateX(100%);transition:transform .25s var(--ease)}
  .entry.swiped .del{transform:none}
  .entry.swiped .t,.entry.swiped .r{transform:translateX(-100px)}
  .entry.editing .t b{color:var(--action)}
  .eEdit{padding:var(--s1) 0 var(--s3)}
  .eGrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
  .eGrid .full{grid-column:1/-1}
  .eAmt{display:flex;align-items:center;gap:6px}
  .eAmt input{min-width:0}
  .eAmt .eQ{flex:0 0 72px}
  .eAmt .eU{flex:1;min-width:0}
  .eAmt span{color:var(--ink-2);font-size:14px;white-space:nowrap}
  .bodyHead{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3)}
  .bodyHead h2{margin:0}
  .bodyState{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
  #bodyCard.locked .bodyState{color:var(--earned-text)}
  #bodyCard.locked input{border-color:color-mix(in srgb,var(--earned) 55%,transparent)}
  #bodyCard{transition:border-color .4s,box-shadow .4s}
  #bodyCard.justLocked{border-color:var(--earned);animation:lockIn .9s var(--ease)}
  #bodyCard.justLocked .bodyState svg{animation:pop .55s cubic-bezier(.2,1.5,.4,1) both}
  .two button.lockedBtn{background:var(--earned);color:var(--on-earned)}
  @keyframes lockIn{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--earned) 45%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
  .hist{display:flex;justify-content:space-between;font-size:14px;padding:var(--s2) 0;border-top:1px solid var(--rule)}
  #bodyHist{margin-top:var(--s3)}
  #bodyHist .hist:first-child{border-top:0}
  html.home #nBack,html.home #targetsCard{display:none}

  /* batches */
  .batch{border-top:1px solid var(--rule);padding:var(--s3) 0}
  .batch:first-child{border-top:0;padding-top:0}
  .bHead{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);cursor:pointer}
  .bHead b{display:block;font-size:16px;font-weight:700}
  .bHead span{font-size:13px;color:var(--ink-2)}
  .bHead .chev{color:var(--ink-2);font-size:20px;line-height:1;transition:transform .2s}
  .batch.open .chev{transform:rotate(90deg)}
  .bPick{margin-top:var(--s3)}
  .bPick .chips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .bPick .chip{padding:8px 0;text-align:center}
  .bw{display:flex;gap:var(--s2);margin-top:var(--s2)}
  .bw input{flex:1;min-width:0}
  .bw select{width:88px;flex:none}
  .bRes{margin-top:var(--s3);font-size:14px;color:var(--ink-2)} .bRes b{color:var(--ink)}
  .bLinks{display:flex;gap:var(--s4);margin-top:var(--s1)}
  #batchBuild{border-top:1px solid var(--rule);margin-top:var(--s3);padding-top:var(--s1)}
  #batchBuild.solo{border-top:0;margin-top:0;padding-top:0}
  #batchBuild label.f{margin:var(--s3) 0 6px}
  /* batch ingredients: one compact row each */
  .ing{display:grid;grid-template-columns:1fr auto;gap:2px var(--s2);padding:12px 0;border-top:1px solid var(--rule)}
  .ing:first-child{border-top:0}
  .ing .fsel{grid-column:1/-1;height:auto;padding:0;border:0;background:none;font-size:16px;font-weight:700;color:var(--ink);-webkit-appearance:none;appearance:none;text-overflow:ellipsis}
  .ing .fsel:focus{box-shadow:none;color:var(--action)}
  .ing .pvrow{grid-column:1/-1;display:grid;grid-template-columns:72px 96px 1fr auto;gap:var(--s2);align-items:center}
  .ing .qty,.ing .usel{height:38px;font-size:15px;padding:0 10px}
  .ing .ingInfo{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ing .ingInfo b{color:var(--ink);font-weight:700}
  .ing.miss{grid-template-columns:1fr auto;align-items:center;font-size:14px;color:var(--ink-2)}
  .ingAdd{display:flex;gap:var(--s2);margin-top:var(--s2)}
  .ingAdd input{flex:1;min-width:0}
  .ingAdd .tool{height:48px}
  #bSuggest{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:var(--s2) calc(-1 * var(--s3)) 0;padding:0 var(--s3)}
  #bSuggest::-webkit-scrollbar{display:none}
  #bSuggest .chip{flex:none;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bTotal{margin-top:var(--s3);font-size:14px;color:var(--ink-2)} .bTotal b{color:var(--ink)}



  /* ---------- today's plate: the day's foods as one bar ---------- */
  html:not(.home) #plateCard{display:none}
  .plateHead{display:flex;align-items:center;justify-content:space-between}
  .plateHead .lnk{padding:var(--s1) 0}
  .plate{display:flex;gap:3px;height:30px;margin-top:var(--s2)}
  .plate button{flex:1 1 0;min-width:6px;border:0;padding:0;border-radius:6px;cursor:pointer;background:var(--seg)}
  .plate button:focus-visible{outline:2px solid var(--action);outline-offset:2px}
  .plate .p0{--seg:color-mix(in srgb,var(--ink-3) 55%,var(--ground))}
  .plate .p1{--seg:color-mix(in srgb,var(--earned) 35%,var(--ground))}
  .plate .p2{--seg:color-mix(in srgb,var(--earned) 65%,var(--ground))}
  .plate .p3{--seg:var(--earned)}
  .plate.empty{background:var(--track);border-radius:6px}
  .plateMeta{margin:var(--s2) 0 0;font-size:14px;color:var(--ink-2)}
  .plateMeta b{color:var(--ink);font-weight:700}
  .plateTip{margin:var(--s1) 0 0;font-size:13px;color:var(--ink-2);min-height:18px}
  .plateTip b{color:var(--ink)}

  /* ---------- food log: a vertical timeline with pixel icons ---------- */
  .ico{width:28px;height:28px;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
  .icoTile{flex:none;width:40px;height:40px;border-radius:var(--r-ctl);background:#eef0f3;display:flex;align-items:center;justify-content:center}
  #lBody{position:relative;padding-top:var(--s3)}
  .lSum{display:flex;gap:var(--s4);margin:var(--s1) 0 var(--s4)}
  .lSum div{font-size:13px;color:var(--ink-2)} .lSum b{display:block;font-size:24px;font-weight:700;letter-spacing:-.03em;color:var(--ink)}
  .tl{position:relative}
  .tl::before{content:"";position:absolute;left:79px;top:8px;bottom:8px;width:2px;border-radius:1px;background:var(--rule)}
  .tlGroup{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin:var(--s3) 0 var(--s1) 104px}
  .tlRow{position:relative;display:grid;grid-template-columns:52px 40px minmax(0,1fr) auto;gap:var(--s3);align-items:center;padding:var(--s2) 0;width:100%;background:none;border:0;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
  .tlRow .tm{font-size:12px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
  .tlRow .nm b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tlRow .nm span{font-size:13px;color:var(--ink-2)}
  .tlRow .cal{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
  .tlRow.editing .nm b{color:var(--action);white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere}
  .tlRow .icoTile{position:relative;z-index:1}
  #lBody .eEdit{margin-left:104px}
  .tlEmpty{margin:var(--s4) 0 0 104px}
  .tlAdd{margin:var(--s4) 0 0 104px}
  .eDel{margin-left:auto}
  .icoPick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
  .icoPick::-webkit-scrollbar{display:none}
  .icoPick button{flex:none;width:40px;height:40px;border-radius:var(--r-ctl);background:#eef0f3;border:2px solid transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .icoPick button[aria-checked="true"]{border-color:var(--action)}
  .icoPick .ico{width:24px;height:24px}

  /* Today at a glance */
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2);margin-top:var(--s3)}
  .tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 10px;background:none;border:1px solid var(--rule-strong);border-radius:var(--r-card);color:var(--ink);cursor:pointer;min-width:0}
  .tile small{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
  .tile b{font-family:var(--mono);font-size:19px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile b.ok{color:var(--earned)} .tile b.pl{color:var(--action)}
  .tile span{font-size:11px;color:var(--ink-2);line-height:1.3}
  #logCard,#nBack{display:none!important}
  .tlHead{margin:var(--s5) 0 0}

  /* ---------- logging: a white button, then its own screen ---------- */
  #viewL{padding-bottom:84px}
  #logBtn{position:fixed;z-index:12;left:max(var(--s3), calc((100vw - 520px)/2 + var(--s3)));right:max(var(--s3), calc((100vw - 520px)/2 + var(--s3)));
    bottom:calc(var(--tabh,58px) + 10px);height:50px;border:0;border-radius:var(--r-ctl);background:#fff;color:#0b0d10;
    font:inherit;font-size:16px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
    box-shadow:0 8px 24px rgba(0,0,0,.35);transition:transform .15s var(--ease)}
  #logBtn span{font-family:var(--mono);font-size:20px;font-weight:700;line-height:1}
  #logBtn:active{transform:scale(.98)}
  #logBtn{display:none} html.onL #logBtn{display:flex}
  html.sheet #logBtn{visibility:hidden}
  html.sheet .tabs{display:none}
  #composer{position:fixed;left:0;right:0;top:0;height:100vh;z-index:18;background:var(--ground);display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 6px) max(var(--s3), calc((100vw - 520px)/2 + var(--s3))) 0;
    opacity:1;transition:opacity .16s ease;transform:translateZ(0)}
  #composer[hidden]{display:none}
  /* backing below the screen, so the page can never show between it and the keyboard */
  #composer::after{content:"";position:absolute;left:0;right:0;top:100%;height:100vh;background:var(--ground)}
  #composer.in{opacity:0}
  #composer.drag{transition:none}
  .shHead{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:var(--s2);min-height:52px}
  .shX{width:44px;height:44px;border:0;background:none;color:var(--ink-2);font-size:28px;line-height:1;cursor:pointer;padding:0}
  .shT{display:flex;flex-direction:column;align-items:center;line-height:1.15}
  .shT b{font-size:17px} .shT span{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  .shTot{min-width:44px;text-align:right;font-family:var(--mono);font-size:14px;color:var(--score,var(--action))}
  .bar{display:flex;gap:var(--s2);align-items:center;padding:var(--s2) 0 calc(var(--s2) + var(--kbpad, env(safe-area-inset-bottom,0px)));border-top:1px solid var(--rule)}
  .bar input{flex:1;min-width:0;height:48px;font-size:17px}
  .barBtn{flex:none;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border:1px solid var(--rule-strong);border-radius:var(--r-ctl);background:none;color:var(--ink);font-size:22px;font-family:var(--mono);cursor:pointer;padding:0}
  .barBtn.go{background:var(--action);border-color:var(--action);color:var(--on-action);font-weight:700;transition:opacity .15s}
  .barBtn.go:disabled{opacity:.25}
  .shTools{display:flex;gap:var(--s2);padding:var(--s1) 0 var(--s2);border-bottom:1px solid var(--rule)}
  .chipB{height:32px;padding:0 14px;border:1px solid var(--rule-strong);border-radius:999px;background:none;color:var(--ink-2);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .chipB[aria-expanded="true"]{border-color:var(--action);color:var(--action)}
  /* the list sits on the bar: short lists hug the bottom, long ones scroll */
  #tray{flex:1;min-height:0;overflow-y:auto;transform:translateZ(0);-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:var(--s1) 0 var(--s2);display:flex;flex-direction:column}
  #tray::before{content:"";flex:1 0 0}
  #tray > *{flex:none}
  .trayLbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:var(--s2) 0 var(--s1)}
  .sRow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 0;background:none;border:0;border-bottom:1px dashed var(--rule);color:var(--ink);text-align:left;font:inherit;font-size:16px;cursor:pointer}
  .sRow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sRow small{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
  .sRow .icoTile{width:36px;height:36px;border-radius:6px} .sRow .ico{width:24px;height:24px}
  .sIco{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
  #tray .primary{margin-top:var(--s2)}
  #tray details.custom{margin-top:0;border-top:0;padding-top:var(--s2)}
  #tray details.custom summary{display:none}
  #preview:not(:empty){margin-top:var(--s2)}
  #tray .pv{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:10px 0;border-top:1px dashed var(--rule)}
  #tray .pv .fsel{height:auto;padding:0;margin:0;border:0;background:none;font-size:16px;font-weight:700;color:var(--ink);-webkit-appearance:none;appearance:none}
  #tray .pv .pvrow{display:grid;grid-template-columns:72px 100px 1fr auto;gap:var(--s2);align-items:center}
  #tray .pv .qty,#tray .pv .usel{height:38px;font-size:16px;padding:0 8px}
  #tray .pv .pvcal{font-size:17px;text-align:right}
  #tray .pv .pvinfo{display:none}
  /* ---------- expenditure ---------- */
  .xpGrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3);margin:var(--s2) 0}
  .xpGrid small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
  .xp .big{font-size:34px}
  .xpCal{display:flex;align-items:center;gap:var(--s3);margin:var(--s2) 0}
  .xpBar{flex:1;height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
  .xpBar i{display:block;height:100%;background:var(--action);border-radius:3px}
  .xpCal span{font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
  /* ---------- training top: today's workout and what it works ---------- */
  .tHero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);align-items:center}
  .tHero .tName{font-size:44px;line-height:1.02;margin-top:var(--s1)}
  .tFocus{margin-top:6px;font-size:15px;color:var(--ink-2)}
  .tStats{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:var(--s3);font-size:12px;color:var(--ink-3)}
  .tStats b{font-size:15px;color:var(--ink);margin-right:3px}
  .tFigs{display:flex;gap:6px}
  .bodyFig{width:66px;height:auto;display:block}
  .bigBtn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;margin-top:var(--s3);border:0;border-radius:var(--r-ctl);
    background:#fff;color:#0b0d10;font:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:transform .15s var(--ease)}
  .bigBtn:active{transform:scale(.98)}
  .tHero.fin + .bigBtn{background:none;color:var(--ink);border:1px solid var(--rule-strong)}
  .tHero + .bigBtn + .card.cal{margin-top:var(--s5)}
  /* ---------- how-to ---------- */
  .exMeta{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin-top:6px}
  .exMus{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .howBtn{flex:none;height:28px;padding:0 12px;border:1px solid var(--rule-strong);border-radius:999px;background:none;color:var(--action);font:inherit;font-size:12px;font-weight:700;cursor:pointer}
  .howSheet{max-height:82vh;overflow-y:auto}
  .howMus{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--action);margin:-6px 0 var(--s2)}
  .howLead{font-size:15px;line-height:1.45;color:var(--ink-2);margin:0 0 var(--s3)}
  .howSteps{margin:0;padding:0;list-style:none;counter-reset:st}
  .howSteps li{counter-increment:st;display:grid;grid-template-columns:28px 1fr;gap:var(--s2);padding:10px 0;border-top:1px dashed var(--rule);font-size:15px;line-height:1.45}
  .howSteps li::before{content:counter(st);font-family:var(--mono);font-weight:700;color:var(--score,var(--action))}
  .howX{margin-top:var(--s3);padding:12px 14px;border-radius:var(--r-ctl);background:color-mix(in srgb, var(--caution,#e5a800) 12%, transparent);font-size:14px;line-height:1.45}
  .howX b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--caution,#e5a800);margin-bottom:4px}
  .tOpts + .card.cal{margin-top:var(--s5)}
  .tOpts{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s2);margin-top:var(--s2)}
  .chipSel{position:relative;display:inline-flex;align-items:center;overflow:hidden}
  .chipSel select{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
  /* ---------- ledger home ---------- */
  #nCal{margin-top:var(--s1)}
  .lgSec{margin:var(--s5) 0 0}
  .lgHead{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3)}
  .lgHead h2{margin:0}
  .trainLine{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .trainLine b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em}
  .trainLine span{font-size:13px;color:var(--ink-2)}
  .mNav{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s1)}
  .mNav b{font-size:16px;font-weight:700}
  .mNav button{border:0;background:none;width:44px;height:40px;border-radius:var(--r-ctl);font-size:24px;line-height:1;color:var(--ink-2);cursor:pointer}
  .lgLegend{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s3);margin-top:var(--s3);font-size:12px;color:var(--ink-2)}
  .lgLegend span{display:inline-flex;align-items:center;gap:6px}
  .lgLegend .hitS{width:14px;height:14px;border-radius:50%;background:var(--earned)}
  .yearG{display:grid;grid-template-columns:repeat(auto-fill,minmax(9px,1fr));gap:3px}
  .yearG i{display:block;aspect-ratio:1;border-radius:var(--r-mark);background:var(--track)}
  .yearG i.g{background:var(--earned)}
  .yearG i.w{background:var(--caution);opacity:.5}
  .yearG i.t{box-shadow:0 0 0 1.5px var(--ink)}
  .yearG i.o{background:none;box-shadow:inset 0 0 0 1px var(--ink-3)}
  /* not logging: a quiet open ring, neither earned nor missed */
  .offM{display:block;width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink-3)}
  .lgLegend .offM{width:10px;height:10px}
  .offBtn{display:block;margin:var(--s5) auto 0;color:var(--ink-2)}
  .offNote{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;margin-bottom:var(--s3);border-bottom:1px dashed var(--rule)}
  .offNote .offM{flex:none;width:16px;height:16px}
  .offNote div{flex:1;display:flex;flex-direction:column;gap:2px}
  .offNote b{font-size:15px}
  .offNote span{font-size:13px;color:var(--ink-2)}
  .yearNote{margin:var(--s3) 0 0} .yearNote b{color:var(--ink)}
  .spark{width:100%;height:120px;display:block;overflow:visible}
  .sparkLbl{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-2);margin-top:6px}
  .spark .ln{stroke-dasharray:var(--len);stroke-dashoffset:0}

  /* ---------- calendars: one set of day marks for food and training ---------- */
  .cal{margin-top:var(--s3)}
  .dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:10.5px;margin-bottom:var(--s1)}
  .grid,#nCal .lgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .day{position:relative;container-type:inline-size;aspect-ratio:1/1.12;border:0;border-radius:var(--r-ctl);background:none;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;gap:5px;padding:7px 0 0;font:inherit;color:var(--ink)}
  button.day{cursor:pointer}
  button.day:hover{background:var(--track)}
  .day .dn{font-size:13px;font-weight:500;line-height:1.1}
  .day.out{opacity:.35}
  .day.future .dn{color:var(--ink-2)}
  .day.today{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--ink)}
  .day.rest .dn{color:var(--ink-2)}
  .day .mk{position:relative;z-index:1;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
  .day .hit{width:18px;height:18px;border-radius:50%;background:var(--earned);color:var(--on-earned);display:flex;align-items:center;justify-content:center}
  .day .hit svg{width:11px;height:11px}
  .day .yld{width:19px;height:17px;display:block}
  /* the streak line starts at the exact centre of a check and runs to the next one */
  .day .dl{font-size:13px;font-weight:700;line-height:18px;height:18px;color:var(--ink-3)}
  .day.done .dl{color:var(--action)}
  .day.missed .dl{text-decoration:line-through}
  .tk{width:14px;height:3px;border-radius:var(--r-mark);display:block}
  .tk.done{background:var(--action)}
  .tk.plan{box-shadow:inset 0 0 0 1px var(--action);opacity:.5}
  .tk.none{visibility:hidden}
  .legend{margin:var(--s3) 0 0}
  .cascade .mk>*{animation:mkIn .45s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i) * 14ms)}
  .cascade .yearG i{animation:mkIn .4s ease-out both;animation-delay:calc(var(--i) * 2ms)}
  .cascade .spark .ln{animation:draw 1s .15s cubic-bezier(.4,0,.2,1) both}
  @keyframes mkIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
  @keyframes chainIn{from{transform:scaleX(0)}to{transform:none}}
  @keyframes draw{from{stroke-dashoffset:var(--len)}}

  /* weeks and the week list on training */
  .wks{margin-top:var(--s1)}
  .wk{display:grid;grid-template-columns:1fr auto 52px;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--rule);font-size:14px;color:var(--ink-2)}

  .wk .wd i{width:10px;height:10px;border-radius:50%;border:1px solid var(--rule-strong);display:block}
  .wk .wd i.on{background:var(--action);border-color:var(--action)}
  .wk .wm{text-align:right;font-size:13px}
  .wk.cur,.wk.full{color:var(--ink)}
  .wk.full .wd i.on{background:var(--earned);border-color:var(--earned)}
  .wk.full .wm{color:var(--earned);font-size:16px;font-weight:700}
  .wrow{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:12px 0;cursor:pointer;color:var(--ink)}
  .wrows .wrow:first-child{border-top:0;padding-top:0}
  .wrow b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em}
  .wrow span.s{font-size:13px;color:var(--ink-2)}
  .tag.fin{color:var(--earned-text)}
  .tag.miss{color:var(--over)}
  .tag.now{color:var(--on-action);background:var(--action);padding:4px 8px;border-radius:999px}

  /* ---------- workout ---------- */
  .sessTitle{margin-top:var(--s2);font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.05;text-wrap:balance}
  .sessSub{margin:var(--s2) 0 0}
  .burn{margin:var(--s2) 0 0;font-size:13px;color:var(--ink-2)}
  .burn b{font-size:16px;font-weight:700;color:var(--ink);margin-right:2px}
  #setCount{margin:var(--s1) 0 0}
  .ex{padding:var(--s4) 0;border-top:1px solid var(--rule);margin-top:var(--s4)}
  .ex+.ex{margin-top:0}
  .exHead{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2)}
  .exHead b{font-size:16px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
  .exHead span{font-size:12px;color:var(--ink-2);white-space:nowrap}
  .exInfo{margin:var(--s1) 0 0}
  .sug{margin:var(--s2) 0 var(--s3);color:var(--ink)}
  .setHead,.setrow{display:grid;grid-template-columns:24px 1fr 1fr 48px;gap:var(--s2);align-items:center}
  .setHead{font-size:10.5px;margin-bottom:6px}
  .setrow{margin-bottom:var(--s2)}
  .setrow .sn{font-size:14px;font-weight:600;color:var(--ink-2);text-align:center}
  .setrow input{text-align:center;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
  .swW{position:relative}
  .swW.hasP input{padding-right:34px;padding-left:22px}
  .plt{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:30px;height:36px;border:0;border-radius:var(--r-ctl);background:none;color:var(--ink-3);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .plt svg{width:18px;height:15px}
  .plt:active{color:var(--action)}
  .plSheet{max-height:88vh;overflow-y:auto}
  .plSub{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
  .plTot{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:var(--s1) 0 0}
  .plTot b{font-family:var(--mono);font-size:44px;font-weight:700;color:var(--score,var(--ink));font-variant-numeric:tabular-nums;line-height:1}
  .plTot span{font-family:var(--mono);font-size:14px;color:var(--ink-2)}
  .plVis{display:block;width:100%;height:64px;margin:var(--s2) 0 0}
  .plVis .pbar{fill:var(--rule-strong)} .plVis .pcol{fill:var(--ink-3)}
  .plVis .pp{fill:var(--ink-2)} .plVis .pp.big{fill:var(--ink)}
  .plHint{text-align:center;font-size:12px;color:var(--ink-3);margin:2px 0 var(--s3)}
  .plRows{border-top:1px dashed var(--rule)}
  .plRow{display:grid;grid-template-columns:52px 1fr 44px 32px 44px;align-items:center;gap:var(--s1);padding:6px 0;border-bottom:1px dashed var(--rule)}
  .plW{font-family:var(--mono);font-size:18px;font-weight:700}
  .plX{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
  .plN{font-family:var(--mono);font-size:18px;text-align:center;font-variant-numeric:tabular-nums}
  .plB{width:44px;height:40px;border:1px solid var(--rule-strong);border-radius:var(--r-ctl);background:none;color:var(--ink);font-size:20px;line-height:1;cursor:pointer;padding:0}
  .plB:disabled{opacity:.3}
  .plB:active:not(:disabled){background:var(--surface)}
  .plOpts{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin:var(--s3) 0}
  .plBase{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
  .plBase input{width:72px;height:40px;text-align:center;font-family:var(--mono);font-weight:700}
  .plSw{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
  .plSw input{width:20px;height:20px;accent-color:var(--action)}
  .plAll{display:block;width:100%;margin-top:var(--s2)}
  .chk{height:48px;border-radius:var(--r-ctl);border:1px solid var(--rule-strong);background:none;color:var(--ink-3);font-size:18px;cursor:pointer}
  .setrow.ok .chk{background:var(--earned);border-color:var(--earned);color:var(--on-earned);animation:pop .3s var(--ease)}
  .setrow.ok input{border-color:color-mix(in srgb,var(--earned) 50%,transparent)}
  .exFoot{display:flex;gap:var(--s2);margin-top:var(--s1)}
  .exFoot .tool{flex:none}
  .exFoot select{flex:1;min-width:0;height:40px;font-size:16px}
  details.more{margin-top:var(--s4);border-top:1px solid var(--rule);padding-top:var(--s3)}
  details.more summary{color:var(--ink-2)}
  details.more .tool,details.more select{margin-top:var(--s3)}

  /* ---------- progress ---------- */
  .big{font-size:48px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
  .big .unit{font-size:16px;font-weight:600;color:var(--ink-2);margin-left:6px;letter-spacing:0}
  .delta{margin:var(--s2) 0 var(--s3)}
  .chart{width:100%;height:auto;display:block;overflow:visible}
  .chart .cg{stroke:var(--rule);stroke-width:1}
  .chart .ct{font-size:10px;fill:var(--ink-2)}
  .chart .cl{fill:none;stroke:var(--action);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
  .chart .cl.thin{stroke-width:1.4}
  .chart .cr{fill:none;stroke:var(--rule-strong);stroke-width:1}
  .chart .cd{fill:var(--ground);stroke:var(--ink-2);stroke-width:1.2}
  .chart .cf,.chart .cn{fill:var(--action)}
  .chart .cpr{fill:color-mix(in srgb,var(--earned) 22%,transparent);stroke:var(--earned);stroke-width:1.5}
  .chart .cs{fill:var(--earned);font-size:11px}

  /* ---------- sheets ---------- */
  .modal{position:fixed;inset:0;background:rgba(10,9,6,.42);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .sheet{background:var(--glass);border-top:1px solid var(--rule);backdrop-filter:blur(30px) saturate(1.7);-webkit-backdrop-filter:blur(30px) saturate(1.7);
    width:100%;max-width:520px;border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:var(--s4) var(--s3) calc(var(--s3) + env(safe-area-inset-bottom));animation:sheetUp .3s var(--ease) both}
  @keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s3)}
  .sheetHead h2{margin:0}
  #reader{width:100%;min-height:200px;border-radius:var(--r-ctl);overflow:hidden;background:#000}
  .manual{display:grid;grid-template-columns:1fr auto;gap:var(--s2);margin-top:var(--s3)}
  .manual button{padding:0 var(--s4)}

  /* ---------- sky, earning, toast, launch ---------- */
  #sky{position:absolute;left:0;right:0;top:0;height:520px;pointer-events:none;z-index:0;overflow:hidden;display:none;
    -webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
  #sky::before{content:"";position:absolute;inset:-10% -25%;
    background:radial-gradient(60% 60% at 35% 0%,var(--sky1),transparent 70%),radial-gradient(45% 55% at 85% 0%,var(--sky2),transparent 70%);
    animation:drift 26s ease-in-out infinite alternate;will-change:transform}
  html.home #sky{display:block}
  @keyframes drift{from{transform:translate3d(-6%,0,0)}to{transform:translate3d(6%,8px,0)}}
  .earn .hit{animation:pop .55s cubic-bezier(.2,1.5,.4,1) both}
  .earn .hit path{stroke-dasharray:12;stroke-dashoffset:12;animation:drawC .4s .25s ease-out forwards}
  .earn .mk::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid var(--earned);animation:ripple .9s .15s ease-out both;pointer-events:none}
  @keyframes pop{from{transform:scale(.6);opacity:.4}to{transform:none;opacity:1}}
  @keyframes drawC{to{stroke-dashoffset:0}}
  @keyframes ripple{from{transform:scale(1);opacity:.9}to{transform:scale(3.2);opacity:0}}
  .toastE{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);visibility:hidden;z-index:60;background:var(--ink);color:var(--ground);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;transition:transform .5s var(--ease);box-shadow:0 10px 30px -10px rgba(0,0,0,.45)}
  .toastE.on{transform:translate(-50%,0);visibility:visible}
  .toastE b{color:var(--earned)}
  #splash{position:fixed;inset:0;z-index:100;background:#0b0d10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .45s ease}
  #splash.out{opacity:0;pointer-events:none}
  #splash b{font-size:26px;font-weight:800;letter-spacing:-.03em;color:#f2f4f7}
  #splash .glow{animation:breath 3.6s ease-in-out infinite}
  @keyframes breath{0%,100%{opacity:.45}50%{opacity:.75}}


  /* ============================================================
     Scoreboard: one dark field in every mode, mono numerals and labels,
     hairlines instead of boxes, the day's big number in gold like a high score.
     ============================================================ */
  :root{
    --ground:#0a0b0d; --surface:#111418; --field:#12151a; --glass:rgba(10,11,13,.88);
    --ink:#e9ecef; --ink-2:#8a93a0; --ink-3:#5c6470;
    --rule:#1f2329; --rule-strong:#2a2e35; --track:#1c2026;
    --action:#5aa2ff; --on-action:#06142b;
    --earned:#3ce07a; --earned-text:#3ce07a; --on-earned:#05301a; --earned-soft:rgba(60,224,122,.14);
    --caution:#ffb020; --over:#ff5a60; --score:#f7c32e;
    --fade:linear-gradient(90deg,#1d4a31 0%,#2fa75e 50%,#3ce07a 100%);
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --r-ctl:6px; --r-card:8px; --r-sheet:14px;
    --sky1:rgba(90,162,255,.10); --sky2:rgba(60,224,122,.06);
    color-scheme:dark;
  }
  .heroNum,.big,.num,.date b,.eyebrow,.mName,label.f,.setHead,.lgSub,.tag,.dow,h2,.lSum b,.tlRow .tm,.tlRow .cal,
  .heroEaten b,.m .mVal b,.sessTitle,.burn b,.mNav b,.entry .r .num,.pvcal,.setrow input,.setrow .sn,.lgLegend,.sparkLbl,.yearNote b,.bodyState,.tabs button,.day .dn,.day .dl{font-family:var(--mono)}
  h2{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
  .date b{font-size:15px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
  .heroNum{color:var(--score);font-weight:600;letter-spacing:-.04em}
  .big{color:var(--score);font-weight:600}
  .heroLbl,.eyebrow,label.f,.setHead,.lgSub,.mName{letter-spacing:.14em}
  .sessTitle{text-transform:uppercase;letter-spacing:.02em;font-size:26px}
  .card.obj{background:none;border:0;border-top:1px solid var(--rule-strong);border-bottom:1px solid var(--rule-strong);border-radius:0;padding:var(--s3) 0}

  .trainLine{border-bottom-style:dashed}
  .tabs button{font-size:10px;letter-spacing:.08em;text-transform:uppercase}
  .day.today{background:none;box-shadow:inset 0 0 0 1.5px var(--ink)}
  .icoTile{background:var(--surface);border:1px solid var(--rule-strong)}
  .icoPick button{background:var(--surface);border-color:var(--rule-strong)}
  .seg button[aria-pressed="true"],.range button.on{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .setrow.ok .chk{background:none;border-color:var(--earned);color:var(--earned)}
  .setrow.ok input{border-color:var(--earned);color:var(--earned)}
  .two button.lockedBtn{background:none;color:var(--earned);box-shadow:inset 0 0 0 1px var(--earned)}

  .toastE{border-radius:6px;font-family:var(--mono);letter-spacing:.04em;background:var(--ink);color:var(--ground)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important} .earn .hit path{stroke-dashoffset:0}}
</style>

<script>
const KEY = 'macrolog-v1';
let state = { targets:{cal:2400,pro:180,carb:250,fat:70}, days:{}, body:{}, custom:[] };
let current = new Date();

// artifact storage when available, otherwise the browser's own storage (for when the file is opened normally)
async function load(){
  try{
    if(window.storage){ const r = await window.storage.get(KEY); if(r && r.value) state = JSON.parse(r.value); return; }
  }catch(e){}
  try{ const v = localStorage.getItem(KEY); if(v) state = JSON.parse(v); }catch(e){}
}
async function save(){
  const s = JSON.stringify(state);
  try{ if(window.storage){ await window.storage.set(KEY, s); return; } }catch(e){}
  try{ localStorage.setItem(KEY, s); }catch(e){}
}

const $ = id => document.getElementById(id);
const dkey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const r1 = n => Math.round(n*10)/10;
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayList = () => state.days[dkey(current)] || [];
const macroLine = e => `${r1(e.pro)}g protein`;

function totals(list){
  return list.reduce((t,e)=>({cal:t.cal+e.cal,pro:t.pro+e.pro,carb:t.carb+e.carb,fat:t.fat+e.fat}),{cal:0,pro:0,carb:0,fat:0});
}

const stem = t => t.replace(/ies$/,'y').replace(/oes$/,'o').replace(/([^s])s$/,'$1');
const tok = s => s.toLowerCase().split(/[^a-z0-9]+/).filter(t=>t && !['of','a','an','the','with'].includes(t)).map(stem);
const G = {g:1,kg:1000,oz:28.35,lb:453.6};

/* ---------- nutrition calendar (home) ---------- */
let nMode = 'cal';
let nMonth = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), 1); })();
// a day counts when protein reaches the goal and calories stay no more than 100 over (any amount under is fine)
function dayHit(list){
  if(!list || !list.length) return null;
  const t = totals(list), g = state.targets;
  // compare what the screen shows (whole numbers), so 179.6 g reads as 180 and counts as 180
  return Math.round(t.pro) >= (g.pro || 0) && Math.round(t.cal) <= (g.cal || 0) + 100;
}
const dayOver = list => !!(list && list.length && Math.round(totals(list).cal) > (state.targets.cal || 0) + 100);
let lgYear = false, lgCascade = true, lgShowAll = false, earnedToday = null;
const LG_CHECK = '<span class="hit"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.3l2.3 2.3 4.7-5"/></svg></span>';
const LG_YIELD = '<svg class="yld" viewBox="0 0 20 18" aria-hidden="true"><path d="M2.6 2.9h14.8c.8 0 1.3.9.8 1.6l-7.4 11c-.4.6-1.2.6-1.6 0L1.8 4.5c-.5-.7 0-1.6.8-1.6z" fill="var(--caution)" stroke="var(--caution)" stroke-width="1.2" stroke-linejoin="round"/><path d="M10 5.6v3.9" stroke="#1d1600" stroke-width="2" stroke-linecap="round"/><circle cx="10" cy="12.1" r="1.05" fill="#1d1600"/></svg>';
const todayD = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
// food state for a day: 'g' earned, 'w' missed, '' nothing to say yet
// a day marked "not logging" (a night out): no check, no miss, and the streak carries straight through it
const isOff = k => !!(state.off && state.off[k]);
function dayState(d){
  const k = dkey(d), tk = dkey(todayD()), h = dayHit(state.days[k]);
  if(isOff(k)) return 'o';
  if(h) return 'g';
  if(h === false && (k < tk || dayOver(state.days[k]))) return 'w';
  return '';
}
function streakNow(){
  const t = todayD(); let n = 0;
  for(let d = !isOff(dkey(t)) && dayHit(state.days[dkey(t)]) ? t : addDays(t,-1), i = 0; i < 3660; d = addDays(d,-1), i++){
    const k = dkey(d);
    if(isOff(k)) continue;
    if(dayHit(state.days[k])) n++; else break;
  }
  return n;
}
// the workout plan by date, for the ticks under each day
function workoutsBy(upto){
  const m = {};
  try{ sequence(upto).forEach(it => { const k = dkey(it.date); if(!m[k]) m[k] = it; }); }catch(e){}
  return m;
}
function renderNCal(){
  const today = todayD(), todayK = dkey(today), first = nMonth, last = new Date(first.getFullYear(), first.getMonth()+1, 0);
  const gridStart = addDays(first, -first.getDay()), gridEnd = addDays(last, 6 - last.getDay());
  const wk = workoutsBy(addDays(gridEnd > today ? gridEnd : today, 1));

  // today's workout line
  const it = wk[todayK];
  let train;
  if(it){
    const tp = tplOf(it.n);
    train = `<div class="trainLine"><div><b>${esc(tp.name)}</b><span>${esc(tp.focus[0].toUpperCase() + tp.focus.slice(1))}, ${tp.ex.length} exercises, ~${workoutBurn(tp).cal} cal</span></div>
      <button type="button" class="ghostBtn${it.fin ? ' doneB' : ''}" data-open="${it.n}">${it.fin ? 'Finished ✓' : 'Start'}</button></div>`;
  }else{
    const nx = Object.values(wk).filter(x => x.date > today && !x.fin).sort((a,b) => a.date - b.date)[0];
    train = `<div class="trainLine"><div><b>Rest day</b><span>${nx ? 'Next: ' + esc(tplOf(nx.n).name) + ' on ' + nx.date.toLocaleDateString(undefined,{weekday:'long'}) : 'Nothing planned'}</span></div></div>`;
  }

  // month grid
  let cells = '', hits = 0, logged = 0, idx = 0;
  const states = {};
  for(let d = gridStart; d <= gridEnd; d = addDays(d,1)) states[dkey(d)] = d <= today ? dayState(d) : '';
  for(let d = gridStart; d <= gridEnd; d = addDays(d,1), idx++){
    const k = dkey(d), st = states[k], inM = d.getMonth() === first.getMonth(), w = wk[k];
    if(inM && st && st !== 'o'){ logged++; if(st === 'g') hits++; }
    const cls = ['day']; if(!inM) cls.push('out'); if(k === todayK) cls.push('today'); if(d > today) cls.push('future');
    const tk = w ? (w.fin ? 'done' : 'plan') : 'none';
    const lbl = d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}) + (st === 'g' ? ', food on target' : st === 'w' ? ', food missed' : st === 'o' ? ', not logging' : '') + (w ? (w.fin ? ', workout done' : ', workout planned') : '');
    cells += `<button class="${cls.join(' ')}" data-d="${k}" style="--i:${idx}" aria-label="${esc(lbl)}"><span class="dn">${d.getDate()}</span><span class="mk">${st === 'g' ? LG_CHECK : st === 'w' ? LG_YIELD : st === 'o' ? '<span class="offM"></span>' : ''}</span><i class="tk ${tk}"></i></button>`;
  }

  // year: the last 52 weeks as small squares
  let yearHTML = '', yg = 0, yn = 0, best = 0, run = 0;
  if(lgYear){
    for(let i = 364, j = 0; i >= 0; i--, j++){
      const d = addDays(today, -i), st = dayState(d);
      if(st && st !== 'o'){ yn++; if(st === 'g'){ yg++; run++; best = Math.max(best, run); } else run = 0; }
      yearHTML += `<i class="${st}${i === 0 ? ' t' : ''}" style="--i:${j}" title="${d.toDateString()}"></i>`;
    }
  }

  // week: calories against the goal band
  const g = state.targets, wkd = [];
  for(let i = 6; i >= 0; i--){ const d = addDays(today, -i), l = state.days[dkey(d)]; wkd.push({d, c: l && l.length && !isOff(dkey(d)) ? totals(l).cal : null}); }
  const vals = wkd.filter(x => x.c != null).map(x => x.c).concat([g.cal + 100, g.cal - 400]);
  const lo = Math.min(...vals) - 150, hi = Math.max(...vals) + 150, W = 340, H = 120;
  const y = v => (H - 12) - (v - lo)/(hi - lo)*(H - 24), x = i => 6 + i*(W - 12)/6;
  // today is still being eaten, so its stretch of the line is dashed
  const pts = wkd.slice(0,6).map((p,i) => p.c == null ? null : [x(i), y(p.c)]).filter(Boolean);
  const lastP = pts[pts.length-1], todayP = wkd[6].c != null ? [x(6), y(wkd[6].c)] : null;
  let len = 0; for(let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);

// numbers roll to their new value instead of jumping
function rollTo(el, to, fmt){
  if(!el) return;
  const from = el._v == null ? to : el._v; el._v = to;
  if(from === to || matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 520;
  cancelAnimationFrame(el._raf);
  const step = now => { const p = Math.min(1, (now - t0)/dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(from + (to - from)*e); if(p < 1) el._raf = requestAnimationFrame(step); };
  el._raf = requestAnimationFrame(step);
}

    : h < 19.5 ? ['255,150,90',.22,'240,120,150',.14] : ['60,70,160',.22,'130,90,200',.12];
  const r = document.documentElement.style;
  r.setProperty('--sky1', `rgba(${P[0]},${(P[1]*a).toFixed(2)})`); r.setProperty('--sky2', `rgba(${P[2]},${(P[3]*a).toFixed(2)})`);
}

/* ---------- edit a logged entry ---------- */
// amounts live in the entry name, like "Rice (1.5 cup)", "Eggs (×2)" or "Soup (½ batch)"
const FR = {'⅙':1/6,'¼':.25,'⅓':1/3,'½':.5,'⅔':2/3,'¾':.75};
function fmtQ(q, u){
  if(u === 'batch'){ const g = Object.keys(FR).find(k => Math.abs(FR[k]-q) < .004); if(g) return g; }
  return String(Math.round(q*100)/100);
}
const amtLabel = (q, u) => u === '×' ? `×${fmtQ(q,u)}` : `${fmtQ(q,u)} ${u}`;
function entryAmt(e){
  const m = String(e.name || '').match(/^(.*) \((×)?(\d*\.?\d+|[⅙¼⅓½⅔¾])(?: (.+?))?\)$/);
  if(m){ const q = FR[m[3]] || parseFloat(m[3]); if(q > 0) return {nm:m[1], q, u: m[2] ? '×' : (m[4] || '×'), lab:true}; }
  return {nm:e.name || 'Food', q:1, u:'×', lab:false};
}
let editAt = null;
// the food an entry came from, so its amount can be re-measured in any unit
function entryFood(e){
  if(!e || e.bid) return null;
  const nm = entryAmt(e).nm.toLowerCase();
  return customFoods().find(f => f.name.toLowerCase() === nm) || DB.find(f => f.name.toLowerCase() === nm) || null;
}
// the food's own units first (each, tbsp, cup...), then weights
const unitOrder = f => { const U = unitsFor(f), own = Object.keys(f.units || {}).filter(u => !G[u] && u !== 'serving').concat(U.serving ? ['serving'] : []); return own.concat(Object.keys(U).filter(u => !own.includes(u))); };
function entryUnit(e, f){
  const a = entryAmt(e), U = unitsFor(f);
  if(a.u === '×') return U.each ? 'each' : (f.def && U[f.def] ? f.def : 'serving');
  return U[a.u] ? a.u : null;
}
// amount or unit changed in the editor: recount from the food when we know it, else scale what was logged
function recalcEdit(box, e){
  const q2 = parseFloat(box.querySelector('.eQ').value); if(!(q2 > 0)) return;
  const sel = box.querySelector('.eU'), f = sel && entryFood(e);
  if(f){ const r = resolve(f, q2, sel.value); box.querySelector('.eCal').value = Math.round(r.cal); box.querySelector('.ePro').value = r1(r.pro); return; }
  const a = entryAmt(e);
  box.querySelector('.eCal').value = Math.round(e.cal*q2/a.q);
  box.querySelector('.ePro').value = r1(e.pro*q2/a.q);
}
function editHTML(e, i){
  const a = entryAmt(e), f0 = entryFood(e), fu = f0 && entryUnit(e, f0), f = fu ? f0 : null;
  return `<div class="eEdit" data-i="${i}"><div class="eGrid">
    <div class="full"><label class="f">Name</label><input class="eName" value="${esc(a.nm)}" autocomplete="off"></div>
    <div class="full"><label class="f">Amount</label><div class="eAmt">${!f && a.u === '×' ? '<span>×</span>' : ''}<input class="eQ" type="number" inputmode="decimal" step="any" min="0" value="${fmtQ(a.q)}">${f
      ? `<select class="eU" aria-label="Unit">${unitOrder(f).map(u => `<option value="${esc(u)}" ${u === fu ? 'selected' : ''}>${esc(u === 'serving' ? 'serving (' + servLabel(f) + ')' : u)}</option>`).join('')}</select>`
      : a.u !== '×' ? `<span>${esc(a.u)}</span>` : ''}</div></div>
    <div><label class="f">Calories</label><input class="eCal" type="number" inputmode="numeric" min="0" value="${Math.round(e.cal)}"></div>
    <div><label class="f">Protein g</label><input class="ePro" type="number" inputmode="decimal" min="0" step="any" value="${r1(e.pro)}"></div>
  </div><div class="btnRow"><button class="primary eSave" type="button">Save</button><button class="tool eCancel" type="button">Cancel</button></div></div>`;
}
function saveEdit(box, list){
  const i = +box.dataset.i, e = (list || dayList())[i]; if(!e) return;
  const a = entryAmt(e), q2 = parseFloat(box.querySelector('.eQ').value);
  const k = q2 > 0 ? q2 / a.q : 1;
  const cal = parseFloat(box.querySelector('.eCal').value), pro = parseFloat(box.querySelector('.ePro').value);
  const nm = box.querySelector('.eName').value.trim() || a.nm, q = q2 > 0 ? q2 : a.q;
  const sel = box.querySelector('.eU'), f = sel && entryFood(e), u = sel ? (sel.value === 'each' ? '×' : sel.value) : a.u;
  e.name = (a.lab || q !== 1 || sel) ? `${nm} (${amtLabel(q, u)})` : nm;
  if(f){ const r = resolve(f, q, sel.value); e.carb = r1(r.carb); e.fat = r1(r.fat);
    e.cal = isNaN(cal) ? Math.round(r.cal) : Math.round(cal); e.pro = isNaN(pro) ? r1(r.pro) : r1(pro); }
  else {
  e.cal = isNaN(cal) ? Math.round(e.cal*k) : Math.round(cal);
  e.pro = isNaN(pro) ? r1(e.pro*k) : r1(pro);
  e.carb = r1(e.carb*k); e.fat = r1(e.fat*k);
  }
  if(e.bf) e.bf = e.bf*k;
  editAt = null; lEdit = null; save(); render(); if(!$('viewL').hidden) renderLog();
}

function iconFor(e){
  if(e.ic && PIX[e.ic]) return e.ic;
  const nm = String(e.name || '').toLowerCase().replace(/\s*\([^)]*\)\s*$/, '');
  const cf = (state.custom || []).find(c => c.icon && c.name.toLowerCase() === nm);
  if(cf) return cf.icon;
  for(const [k, re] of ICO_RULES) if(re.test(nm)) return k;
  if(VEG_FALLBACK.test(nm)) return 'salad';
  if(MEAT_FALLBACK.test(nm)) return 'steak';
  return 'other';
}

let lDate = new Date(), lEdit = null;

  $('lSub').textContent = lDate.toLocaleDateString(undefined, {month:'long', day:'numeric', year:'numeric'});
  $('lNext').style.visibility = isToday ? 'hidden' : '';

  const timed = idx.filter(i => list[i].t).sort((a,b) => list[a].t - list[b].t), untimed = idx.filter(i => !list[i].t);
  const row = i => {

const UNITS = {g:'g',gram:'g',grams:'g',kg:'kg',oz:'oz',ounce:'oz',ounces:'oz',lb:'lb',lbs:'lb',pound:'lb',pounds:'lb',
  cup:'cup',cups:'cup',tbsp:'tbsp',tablespoon:'tbsp',tablespoons:'tbsp',tsp:'tsp',teaspoon:'tsp',teaspoons:'tsp',
  slice:'slice',slices:'slice',scoop:'scoop',scoops:'scoop',can:'can',cans:'can',piece:'each',pieces:'each',each:'each',
  whole:'each',medium:'each',large:'each',small:'each',serving:'serving',servings:'serving',handful:'handful',handfuls:'handful',
  glass:'glass',glasses:'glass',bottle:'bottle',bottles:'bottle',square:'square',squares:'square',pat:'pat',pats:'pat',

// saved foods: either per serving (typed in by hand) or per 100 g with a serving size (scanned)
function customFoods(){
  return state.custom.map(c=>{
    const per = c.per || {cal:c.cal, pro:c.pro, carb:c.carb, fat:c.fat};
    const tk = new Set(tok(c.name));
    return {name:c.name, custom:true, grams:!!c.grams, per, units:{serving:c.serving || 100},
      tokens:tk, nameTokens:tk, phrases:[tok(c.name).join(' ')]};

}
const unitsFor = f => (f.custom && !f.grams) ? f.units : Object.assign({}, G, f.units);

// foods you have logged before rank higher, so suggestions learn what you eat
let _usedCache = null, _usedAt = -1;
function usedNames(){
  const n = Object.keys(state.days).length;
  if(_usedCache && _usedAt === n) return _usedCache;
  const m = new Map();
  Object.values(state.days).forEach(l => l.forEach(e => { const k = tok(String(e.name||'').replace(/\s*\([^)]*\)\s*$/,'')).join(' '); if(k) m.set(k, (m.get(k)||0) + 1); }));

}
function search(q, limit){
  const qt = tok(q); if(!qt.length) return [];
  const qs = qt.join(' '), used = usedNames();
  const all = customFoods().concat(DB);
  const seen = new Set();
  return all.map((f,idx)=>{
    // the word still being typed matches by its start, so "chick" finds chicken
    let m = 0, inName = 0; const hit = new Set();
    qt.forEach((t,i)=>{
      if(f.tokens.has(t)){ m++; hit.add(t); if(f.nameTokens.has(t)) inName++; }
      else if(i === qt.length - 1 && t.length >= 2){
        for(const ft of f.tokens){ if(ft.startsWith(t)){ m += .85; hit.add(ft); if(f.nameTokens.has(ft)) inName++; break; } }
      }
    });
    const ratio = m/qt.length;
    if(!m || ratio < 0.5) return null;
    const extra = [...f.nameTokens].filter(t=>!hit.has(t)).length;
    let s = ratio*10 - extra*0.3 - idx*0.001 + inName*0.6;
    if(f.phrases.includes(qs)) s += 5;
    if(f.custom) s += 1;
    if(f.ext) s -= 1.2;
    const u = used.get(f.phrases[0]); if(u) s += Math.min(3, 1 + Math.log2(u));
    return {f,s};
  }).filter(Boolean).sort((a,b)=>b.s-a.s)
    .filter(x => { const k = x.f.name.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; })
    .slice(0, limit || 6).map(x=>x.f);
}

function num(t){
  if(/^\d+(\.\d+)?$/.test(t)) return parseFloat(t);
  const m = t.match(/^(\d+)\/(\d+)$/); if(m) return (+m[1] < +m[2]) ? m[1]/m[2] : null;

  return t in fr ? fr[t] : null;
}
function parseItem(raw){
  const t = raw.toLowerCase().replace(/\(.*?\)/g,' ').replace(/(\d)([a-z]+)/g,'$1 $2').replace(/(\d)([½¼¾])/g,'$1 $2');
  const w = t.split(/\s+/).filter(Boolean);
  let qty = null, unit = null;
  for(let i=0;i<w.length;i++){
    const n = num(w[i]);
    if(n !== null){
      qty = n; let j = i+1;
      const n2 = j < w.length ? num(w[j]) : null;
      if(n2 !== null && n2 < 1){ qty += n2; j++; }
      if(j < w.length && UNITS[w[j]]){ unit = UNITS[w[j]]; j++; }
      w.splice(i, j-i);

    }

  return {qty: qty === null ? 1 : qty, unit, name: w.join(' ')};
}

  if(!u) u = d;
  else if(!U[u]){ warn = true; u = d; }
  const k = qty*U[u]/100;
  return {u, warn, cal:f.per.cal*k, pro:f.per.pro*k, carb:f.per.carb*k, fat:f.per.fat*k};
}

/* ---------- barcode photo decoding (zxing) ---------- */
async function decodeBarcodeFile(file){
  const Z = window.ZXing; if(!Z) throw new Error('decoder missing');
  const hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.QR_CODE]);
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  const reader = new Z.MultiFormatReader(); reader.setHints(hints);
  let bmp;
  try{ bmp = await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch(e){ bmp = await createImageBitmap(file); }
  const tryCanvas = c => {
    const ctx = c.getContext('2d', {willReadFrequently:true}), d = ctx.getImageData(0,0,c.width,c.height).data;
    const lum = new Uint8ClampedArray(c.width*c.height);
    for(let i=0,j=0;i<d.length;i+=4,j++) lum[j] = (d[i]*299 + d[i+1]*587 + d[i+2]*114)/1000;
    const src = new Z.RGBLuminanceSource(lum, c.width, c.height);
    for(const B of [Z.HybridBinarizer, Z.GlobalHistogramBinarizer]){
      try{ return reader.decode(new Z.BinaryBitmap(new B(src))).getText(); }catch(e){}
    }
    return null;
  };
  const mk = (w,h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  for(const maxSide of [1600, 1100, 800, 2200]){
    const s = Math.min(1, maxSide/Math.max(bmp.width, bmp.height));
    const w = Math.max(1, Math.round(bmp.width*s)), h = Math.max(1, Math.round(bmp.height*s));
    const c = mk(w,h); c.getContext('2d').drawImage(bmp, 0, 0, w, h);
    let r = tryCanvas(c); if(r) return r;
    const rc = mk(h,w), x = rc.getContext('2d'); x.translate(h/2, w/2); x.rotate(Math.PI/2); x.drawImage(c, -w/2, -h/2);
    r = tryCanvas(rc); if(r) return r;
  }
  return null;
}

let scanner = null, scanBusy = false;
const setScanMsg = t => { $('scanMsg').textContent = t; };
const setToolMsg = t => { $('toolMsg').textContent = t; };

function loadScannerLib(){

// small packages print 8-digit UPC-E codes; databases file them under the full 12-digit UPC-A
function upcE2A(e){
  const d = e.slice(1, 7), sys = e[0], ck = e[7], last = d[5];
  let m;
  if('012'.includes(last)) m = d.slice(0,2) + last + '0000' + d.slice(2,5);
  else if(last === '3') m = d.slice(0,3) + '00000' + d.slice(3,5);
  else if(last === '4') m = d.slice(0,4) + '00000' + d[4];
  else m = d.slice(0,5) + '0000' + last;
  return sys + m + ck;
}
// Open Food Facts first (crowd-sourced, has most snacks), then USDA's branded foods list (most US groceries).
// skip the brand when the product name already says it ("Coca-Cola Coca-Cola")
const joinBrand = (b, n) => (!b || n.toLowerCase().includes(b.toLowerCase())) ? (n || b) : b + ' ' + n;
async function offLookup(codes){
  for(const c of codes){
    try{
      const res = await fetch('https://world.openfoodfacts.org/api/v2/product/' + c + '.json?fields=product_name,brands,nutriments,serving_size,serving_quantity');
      const d = await res.json(), p = d && d.status === 1 ? d.product : null;
      if(!p) continue;
      const n = p.nutriments || {};
      let kcal = n['energy-kcal_100g'];
      if(kcal == null && n['energy_100g'] != null) kcal = n['energy_100g']/4.184;
      if(kcal == null) continue;
      const brand = p.brands ? p.brands.split(',')[0].trim() : '';
      return {name:joinBrand(brand, p.product_name || ''), per:{cal:+kcal, pro:+n.proteins_100g || 0, carb:+n.carbohydrates_100g || 0, fat:+n.fat_100g || 0}, serv:parseFloat(p.serving_quantity) || 100};
    }catch(e){}
  }
  return null;
}
let usdaLimited = false;
async function usdaLookup(codes){
  usdaLimited = false;
  const tc = s => s.toLowerCase().replace(/\b[a-z]/g, ch => ch.toUpperCase());
  for(const c of codes){
    try{
      const gtin = c.padStart(14, '0');
      const res = await fetch('https://api.nal.usda.gov/fdc/v1/foods/search?api_key=DEMO_KEY&dataType=Branded&pageSize=5&query=' + gtin);
      if(res.status === 429){ usdaLimited = true; continue; }
      const d = await res.json();
      const f = (d.foods || []).find(x => (x.gtinUpc || '').padStart(14, '0') === gtin);
      if(!f) continue;
      const nv = num => { const x = (f.foodNutrients || []).find(n => n.nutrientNumber === num); return x ? +x.value || 0 : 0; };
      const cal = nv('208'); if(!cal && !nv('203')) continue;
      const brand = f.brandName || f.brandOwner || '';
      const unit = (f.servingSizeUnit || '').toLowerCase();
      return {name:joinBrand(brand && tc(brand), tc(f.description || '')), per:{cal, pro:nv('203'), carb:nv('205'), fat:nv('204')}, serv:(unit === 'g' || unit === 'ml' || unit === 'grm' || unit === 'mlt') && f.servingSize ? +f.servingSize : 100};
    }catch(e){}
  }
  return null;
}
async function lookupBarcode(raw){
  if(scanBusy) return;
  let code = String(raw).replace(/\D/g,'');
  if(code.length < 8){ setScanMsg('That does not look like a full product barcode, which usually has between 8 and 13 digits.'); return; }
  scanBusy = true;
  setScanMsg('Looking up ' + code + '\u2026');
  const codes = [];
  const add = c => { if(c && !codes.includes(c)) codes.push(c); };
  if(code.length === 8 && /^[01]/.test(code)) add(upcE2A(code));
  if(code.length === 12) add('0' + code);
  add(code);
  if(code.length === 13 && code[0] === '0') add(code.slice(1));
  if(code.length === 14) add(code.replace(/^0+/, '').padStart(13, '0'));
  const hit = await offLookup(codes) || await usdaLookup(codes);
  if(!hit && usdaLimited){ scanBusy = false; setScanMsg('Open Food Facts has no entry for ' + code + ', and the USDA list is busy right now. Try again in a while, or add it under More \u2192 Add a custom food.'); return; }
  if(!hit){ scanBusy = false; setScanMsg('Neither food database has ' + code + '. Check the digits, or add it under More \u2192 Add a custom food.'); return; }
  const name = keepScanned(hit.name, hit.per, hit.serv, true);
  await closeScan();
  setToolMsg('Found ' + name + '. Adjust the amount below if you ate more or less than one serving.');
  stageFood(name);
}

const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const sundayOf = d => addDays(d, -d.getDay());
const shortDate = d => d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const longDate = d => d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
function startOfToday(){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
const sKey = n => 's' + n;
const sessRec = n => state.train.sessions[sKey(n)];
const tmapOf = () => (state.train.tmap = state.train.tmap || {});
const tplIdx = n => { const m = state.train.tmap; return (m && m[n] != null) ? m[n] : n % TPL.length; };
const tplOf = n => TPL[tplIdx(n)];

// finished workouts are numbered in order; the next unfinished one is the pointer everything else hangs from
function nextIdx(){ let n = 0; while(sessRec(n) && sessRec(n).done) n++; return n; }

// dates for every workout from the first one through `upto`: finished ones sit on the day they were done,
// the next one lands on the first allowed day, and the rest follow at one day apart with three days after each block of five
function sequence(upto, minN){
  const T = state.train, out = [], today = startOfToday();
  const gap = k => (k % TPL.length === 0 ? 3 : 1);
  let n = 0, prev = null;
  while(sessRec(n) && sessRec(n).done){
    const d = pd(sessRec(n).doneOn); out.push({n, date:d, fin:true}); prev = d; n++;
  }
  let d;
  if(prev) d = addDays(prev, gap(n));
  else if(T.start) d = pd(T.start);
  else d = today;
  if(d < today && (prev || !T.start)) d = today;
  if(T.notBefore && pd(T.notBefore) > d) d = pd(T.notBefore);
  out.push({n, date:d, fin:false});
  while(out.length < 800 && (d <= upto || n < minN)){
    n++; d = addDays(d, gap(n)); out.push({n, date:d, fin:false});
  }
  return out;
}
function infoOf(n){
  const it = sequence(addDays(startOfToday(), 400), n).find(x=>x.n === n);
  return {n, tpl:tplOf(n), date:it.date, fin:it.fin, dk:dkey(it.date)};
}

  state.train.plates[e.n] = {base: pl.base, x2: pl.x2};
  e.sets.forEach((st, i) => {
    if(i !== pl.k && (!all || st.ok)) return;
    st.w = tot; st.auto = false; st.p = Object.assign({}, pl.c);
    const inp = document.querySelector(`#tBody .setrow[data-j="${pl.j}"][data-k="${i}"] .sw`);
    if(inp) inp.value = tot;
  });
  save(); $('plateModal').hidden = true;
}

const MUSCLE_WORDS = [
  [/upper chest|chest|pec/, 'c'], [/rear delt/, 'r'], [/side delt/, 'dr'], [/front delt|delt|shoulder/, 'd'],
  [/tricep/, 'x'], [/bicep/, 'b'], [/forearm|grip/, 'f'], [/lat/, 'l'], [/trap/, 't'], [/upper back/, 'ut'], [/mid back/, 'u'],
  [/lower back|erector/, 'w'], [/ab|core|hip flexor/, 'a'], [/oblique/, 'o'], [/quad/, 'q'], [/adductor/, 'i'],
  [/glute/, 'g'], [/hamstring/, 'm'], [/calf|calves|soleus/, 'k']];
// what each exercise works, read from the last sentence of its blurb ("Quads, glutes.")
function musclesOf(name){
  const t = EX_INFO[name]; if(!t) return [];
  const last = t.trim().replace(/\.$/, '').split('. ').pop().toLowerCase();
  const out = [];
  last.split(/,| and /).map(x => x.trim()).filter(Boolean).forEach(part => {
    const hit = MUSCLE_WORDS.find(([re]) => re.test(part));
    if(hit) hit[1].split('').forEach(c => { if(!out.includes(c)) out.push(c); });
  });
  return out;
}
// first-named muscle counts double; regions near the top score are primary, the rest secondary
function muscleMap(exs){
  const sc = {};
  exs.forEach(e => musclesOf(e.n).forEach((c, i) => { sc[c] = (sc[c] || 0) + (i === 0 ? 2 : 1) * (e.sets || 3); }));
  const top = Math.max(0, ...Object.values(sc)), pri = new Set(), sec = new Set();
  Object.keys(sc).forEach(c => (sc[c] >= top * .5 ? pri : sec).add(c));
  return {pri, sec};
}
function bodySVG(view, mm, done){
  const g = BODY[view], H = g.length, W = g[0].length, on = done ? 'var(--earned)' : 'var(--action)';
  const off = c => c === 'n' ? 'var(--body-n,#252a32)' : 'var(--body-m,#2f3540)';
  let r = '';
  g.forEach((row, y) => [...row].forEach((c, x) => {
    if(c === '.') return;
    const f = mm.pri.has(c) ? on : mm.sec.has(c) ? `color-mix(in srgb, ${on} 42%, var(--ground))` : off(c);
    r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${f}"/>`;
    if(x + 1 < W && row[x+1] !== '.' && row[x+1] !== c) r += `<rect x="${x+.9}" y="${y}" width=".2" height="1" fill="var(--ground)"/>`;
    if(y + 1 < H && g[y+1][x] !== '.' && g[y+1][x] !== c) r += `<rect x="${x}" y="${y+.9}" width="1" height=".2" fill="var(--ground)"/>`;
  }));
  return `<svg class="bodyFig" viewBox="0 0 ${W} ${H}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}
function workoutBurn(tp){
  const sets = tp.ex.reduce((a,e) => a + e.sets, 0), min = 6 + sets * 2.25;
  const bw = Object.keys(state.body).sort().reverse().map(k => state.body[k] && state.body[k].w).find(Boolean) || 180;
  const kcal = 5 * (bw / 2.2046) * (min / 60);
  return {cal: Math.round(kcal / 100) * 100, min: Math.round(min / 5) * 5};
}
function lastPerf(name, excludeN){
  let best = null;
  for(const key in state.train.sessions){
    if(key === sKey(excludeN)) continue;
    const rec = state.train.sessions[key], ex = (rec.ex||[]).find(e=>e.n === name);
    if(!ex) continue;
    const ok = ex.sets.filter(s=>s.ok && s.r > 0);
    if(!ok.length) continue;
    const date = rec.doneOn || rec.when || '';
    if(!best || date > best.date) best = {date, sets:ok};
  }
  return best;
}
function suggest(te, name, excludeN){
  const p = lastPerf(name, excludeN);
  if(!p) return {w:'', text: BW_EX.has(name) ? 'No history yet. Start with bodyweight and leave the weight blank; add weight only once every set reaches the top of the range.' : 'There is no history for this lift yet, so pick a weight that leaves about two reps in reserve on the first set.'};
  const w = Math.max(...p.sets.map(s=>+s.w || 0));
  const summary = p.sets.map(s=>`${s.w ? s.w : 'bodyweight'}×${s.r}`).join(', ');
  if(p.sets.every(s=>s.r >= te.hi)){
    if(!te.inc) return {w: w || '', text:`Every set reached ${te.hi} reps last time (${summary}), so make the next round harder with a longer reach or a slower lowering phase.`};
    const up = w + te.inc;
    return {w:up, text: w ? `Every set reached ${te.hi} reps last time (${summary}), so this time go up to ${up} lb.`
                          : `Every set reached ${te.hi} reps last time (${summary}), so it is time to add some weight, starting around ${up} lb.`};
  }
  return {w: w || '', text:`Last time you did ${summary}. Stay at ${w || 'bodyweight'} and try to add a rep or two on each set before moving up.`};
}
function makeRec(n){
  return {done:false, doneOn:null, when:null, ex:tplOf(n).ex.map(e=>{
    const sg = suggest(e, e.n, n);
    return {n:e.n, sets:Array.from({length:e.sets}, ()=>({w:sg.w, r:'', ok:false, auto:true}))};
  })};
}
