<style>
  :root{
    --bg:#eceff2; --card:#ffffff; --ink:#0e1820; --muted:#5a6772; --line:#dde3e8; --line2:#c4ccd3;
    --pro:#1b7a57; --carb:#c1801a; --fat:#7a5a8c; --danger:#b3382c;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .num{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum","lnum"}
  .wrap{max-width:520px;margin:0 auto;padding:0 14px 72px}

  header{position:sticky;top:0;z-index:5;background:rgba(236,239,242,.92);backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:space-between;padding:12px 0}
  header button{background:var(--card);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;
    font-size:20px;line-height:1;color:var(--ink);cursor:pointer}
  .date{text-align:center}
  .date b{display:block;font-size:17px;font-weight:650;letter-spacing:-.01em}
  .date span{font-size:13px;color:var(--muted)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  h2{font-size:15px;font-weight:650;letter-spacing:-.005em;margin:0 0 12px}

  /* hero */
  .heroTop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
  .heroNum{font-size:64px;line-height:.95;font-weight:700;letter-spacing:-.035em}
  .heroLbl{font-size:14px;color:var(--muted);margin-top:6px}
  .heroEaten{font-size:13px;color:var(--muted);text-align:right;padding-bottom:4px}
  .heroEaten b{color:var(--ink);font-weight:650}
  .track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  .track.big{height:10px;border-radius:5px}
  .fill{height:100%;border-radius:inherit;transition:width .25s ease}
  .fill.over{background:var(--danger)!important}
  .macros{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
  .m .mName{font-size:13px;color:var(--muted)}
  .m .mVal{font-size:15px;margin:2px 0 7px}
  .m .mVal b{font-weight:650}
  .m .mVal span{color:var(--muted);font-size:13px}

  /* inputs */
  input,textarea,select{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line2);border-radius:10px}
  input,select{height:44px;padding:0 12px;width:100%}
  textarea{width:100%;padding:12px;resize:none;line-height:1.4;font-size:16px}
  input[type=checkbox]{width:auto;height:auto}
  input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible,
  .tool:focus-within{outline:2px solid var(--pro);outline-offset:1px}
  label.f{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
  button{font:inherit}
  .primary{width:100%;height:46px;margin-top:10px;background:var(--ink);color:#fff;border:0;border-radius:10px;font-weight:650;cursor:pointer}
  .tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .tool{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;background:#fff;color:var(--ink);
    border:1px solid var(--line2);border-radius:10px;font-size:14px;font-weight:500;cursor:pointer}
  .tool svg{flex:none}
  .status{font-size:13px;color:var(--muted);margin:10px 0 0;min-height:0}
  .status:empty{display:none}

  /* preview rows */
  #preview{margin-top:10px}
  .pv{border-top:1px solid var(--line);padding:12px 0}
  .pv .fsel{width:100%;margin-bottom:8px;font-weight:500}
  .pvrow{display:flex;gap:8px;align-items:center}
  .pvrow .qty{width:86px;flex:none}
  .pvrow .usel{flex:1;min-width:0}
  .pvcal{font-size:20px;font-weight:650;min-width:48px;text-align:right}
  .pvinfo{font-size:13px;color:var(--muted);margin-top:6px}
  .pvname{font-size:14px;color:var(--ink)}

  details.custom{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  summary{cursor:pointer;font-weight:600;font-size:14px}
  .form{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .form .name{grid-column:1/-1}
  .save{grid-column:1/-1;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}

  /* log */
  .entry{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .entry:first-child{border-top:0;padding-top:0}
  .entry .t{min-width:0}
  .entry .t b{display:block;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .entry .t span{font-size:13px;color:var(--muted)}
  .entry .r{display:flex;align-items:center;gap:6px}
  .entry .r .num{font-size:17px;font-weight:650}
  .x{background:none;border:0;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:6px 8px;border-radius:8px}
  .empty{color:var(--muted);margin:0}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:#fff;border:1px solid var(--line2);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;color:var(--ink)}

  .two{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
  .two button{height:44px;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:0 18px;font-weight:600;cursor:pointer}
  .hist{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
  #bodyHist{margin-top:12px}
  #bodyHist .hist:first-child{border-top:0}
  .targets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}

  /* scanner sheet */
  .modal{position:fixed;inset:0;background:rgba(14,24,32,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .modal[hidden]{display:none}
  .sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  .sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .sheetHead h2{margin:0}
  #reader{width:100%;min-height:200px;border-radius:12px;overflow:hidden;background:var(--ink)}
  .manual{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
  .manual button{height:44px;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:0 18px;font-weight:600;cursor:pointer}

  [hidden]{display:none!important}
  .wrap{padding-bottom:104px}

  /* bottom tabs */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:rgba(255,255,255,.94);
    backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;background:none;border:0;
    color:var(--muted);font-size:12px;font-weight:550;cursor:pointer}
  .tabs button[aria-current=page]{color:var(--ink)}
  .tabs button[aria-current=page] svg{stroke:var(--pro)}

  /* calendar */
  .cal{padding:12px}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;text-align:center;font-size:12px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .day{aspect-ratio:1/1.12;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;
    align-items:center;justify-content:space-between;padding:5px 0 6px;font:inherit;color:var(--ink)}
  button.day{cursor:pointer}
  .day.rest{background:transparent;border-color:transparent;color:var(--muted)}
  .day.out{opacity:.4}
  .day.today{border:2px solid var(--ink)}
  .day .dn{font-size:12px;line-height:1}
  .day .dl{font-size:16px;font-weight:700;line-height:1}
  .day.U{background:#e3edf4;border-color:#c5d8e6;color:#27556f}
  .day.L{background:#f6ebd8;border-color:#e8d3ae;color:#865810}
  .day.done{color:#fff;border-color:transparent}
  .day.U.done{background:#27556f}
  .day.L.done{background:#a56d12}
  .day.missed{border-style:dashed}
  .legend{font-size:13px;color:var(--muted);margin:0 2px 12px}
  .wrow{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;
    border-top:1px solid var(--line);padding:12px 0;cursor:pointer;color:var(--ink)}
  .wrows .wrow:first-child{border-top:0;padding-top:0}
  .wrow b{display:block;font-weight:550}
  .wrow span.s{font-size:13px;color:var(--muted)}
  .tag{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--line);color:var(--muted)}
  .tag.fin{background:#d8eee4;color:#14603f}
  .tag.miss{background:#f6e1dd;color:#933126}
  .tag.now{background:var(--ink);color:#fff}
  .muted{color:var(--muted);font-size:13px;margin:12px 0 0}

  /* workout */
  .back{background:none;border:0;font-size:15px;font-weight:550;color:var(--ink);padding:14px 0 10px;cursor:pointer}
  .sessTitle{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
  .sessSub{color:var(--muted);margin:4px 0 12px}
  .ex{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .exHead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .exHead b{font-weight:650;font-size:16px}
  .exHead span{font-size:13px;color:var(--muted);white-space:nowrap}
  .sug{font-size:13px;color:var(--muted);margin:6px 0 12px}
  .setHead,.setrow{display:grid;grid-template-columns:26px 1fr 1fr 46px;gap:8px;align-items:center}
  .setHead{font-size:12px;color:var(--muted);margin-bottom:4px}
  .setrow{margin-bottom:8px}
  .setrow .sn{font-size:13px;color:var(--muted);text-align:center}
  .chk{height:44px;border-radius:10px;border:1px solid var(--line2);background:#fff;color:var(--line2);font-size:20px;cursor:pointer}
  .setrow.ok .chk{background:var(--pro);border-color:var(--pro);color:#fff}
  .setrow.ok input{background:#eef7f2}
  .exFoot{display:flex;gap:8px;margin-top:4px}
  .exFoot .tool{flex:none}
  .exFoot select{flex:1;min-width:0;height:40px;font-size:14px}

  /* workout chat */
  :root{--tabh:60px}
  #viewT.chatOn{padding-bottom:84px}
  #chatBar,#chatPanel{position:fixed;left:0;right:0;margin:0 auto;width:100%;max-width:520px;background:#fff;z-index:9}
  #chatBar{bottom:calc(var(--tabh) + env(safe-area-inset-bottom));display:flex;gap:8px;padding:8px 14px;border-top:1px solid var(--line)}
  #chatBar input{flex:1;min-width:0;font-size:16px}
  #chatBar button{height:44px;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:0 18px;font-weight:600;cursor:pointer}
  #chatPanel{bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 61px);border:1px solid var(--line);border-bottom:0;
    border-radius:14px 14px 0 0;box-shadow:0 -6px 20px rgba(14,24,32,.08)}
  .chatHead{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 4px 14px;font-size:13px;color:var(--muted)}
  #chatLog{max-height:42vh;overflow-y:auto;padding:4px 14px 12px}
  .msg{max-width:88%;padding:9px 12px;border-radius:14px;margin-top:8px;white-space:pre-wrap;line-height:1.4}
  .msg.user{margin-left:auto;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
  .msg.assistant{background:var(--bg);border-bottom-left-radius:4px}
  @media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div id="viewN">
  <header>
    <button id="prev" aria-label="Previous day">‹</button>
    <div class="date"><b id="dateMain"></b><span id="dateSub"></span></div>
    <button id="next" aria-label="Next day">›</button>
  </header>

  <section class="card">
    <div class="heroTop">
      <div>
        <div class="heroNum num" id="remain">0</div>
        <div class="heroLbl" id="remainLbl">calories left today</div>
      </div>
      <div class="heroEaten"><b class="num" id="eaten">0</b> eaten out of <span class="num" id="goal">0</span></div>
    </div>
    <div class="track big"><div class="fill" id="calFill" style="background:var(--ink)"></div></div>
    <div class="macros" id="macros"></div>
  </section>

  <section class="card">
    <h2>Log food</h2>
    <textarea id="q" rows="2" placeholder="Type what you ate, like “pinto beans cooked 1 lb, 1 tbsp butter, 2 eggs”" aria-label="Foods to log"></textarea>
    <div id="preview"></div>
    <button class="primary" id="addAll" hidden></button>

    <div class="tools">
      <button class="tool" id="scanBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5v14M8 5v14M12 5v14M16 5v9M20 5v14M16 18v1"/></svg>
        Scan a barcode
      </button>
      <label class="tool" for="labelFile">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/></svg>
        Read a nutrition label
      </label>
      <input type="file" id="labelFile" accept="image/*" capture="environment" hidden>
    </div>
    <p class="status" id="toolMsg" role="status" aria-live="polite"></p>

    <details class="custom">
      <summary>Add a custom food</summary>
      <div class="form">
        <div class="name"><label class="f" for="fName">Food</label><input id="fName" autocomplete="off"></div>
        <div><label class="f" for="fCal">Calories</label><input id="fCal" type="number" inputmode="numeric" min="0"></div>
        <div><label class="f" for="fPro">Protein g</label><input id="fPro" type="number" inputmode="decimal" min="0"></div>
        <div><label class="f" for="fCarb">Carbs g</label><input id="fCarb" type="number" inputmode="decimal" min="0"></div>
        <div><label class="f" for="fFat">Fat g</label><input id="fFat" type="number" inputmode="decimal" min="0"></div>
        <label class="save"><input type="checkbox" id="fSave"><span>Keep this food so it comes up when I search by name. The values above are treated as one serving.</span></label>
      </div>
      <button class="primary" id="add">Add to today's log</button>
    </details>
  </section>

  <section class="card" id="recentPanel" hidden>
    <h2>Recent foods</h2>
    <div class="chips" id="recent"></div>
  </section>

  <section class="card">
    <h2>Today's log</h2>
    <div id="list"></div>
  </section>

  <section class="card">
    <h2>Weight and waist</h2>
    <div class="two">
      <div><label class="f" for="bW">Weight, lb</label><input id="bW" type="number" inputmode="decimal" step="0.1"></div>
      <div><label class="f" for="bWa">Waist, in</label><input id="bWa" type="number" inputmode="decimal" step="0.25"></div>
      <button id="saveBody">Save</button>
    </div>
    <div id="bodyHist"></div>
  </section>

  <section class="card">
    <details>
      <summary>Daily targets</summary>
      <div class="targets">
        <div><label class="f" for="tCal">Calories</label><input id="tCal" type="number" inputmode="numeric"></div>
        <div><label class="f" for="tPro">Protein g</label><input id="tPro" type="number" inputmode="numeric"></div>
        <div><label class="f" for="tCarb">Carbs g</label><input id="tCarb" type="number" inputmode="numeric"></div>
        <div><label class="f" for="tFat">Fat g</label><input id="tFat" type="number" inputmode="numeric"></div>
      </div>
    </details>
  </section>
  </div>

  <div id="viewT" hidden>
    <header id="tHeader">
      <button id="tPrev" aria-label="Previous month">‹</button>
      <div class="date"><b id="tTitle"></b><span id="tSub"></span></div>
      <button id="tNext" aria-label="Next month">›</button>
    </header>
    <div id="tBody"></div>
  </div>
</div>

<div id="chatPanel" hidden>
  <div class="chatHead"><span>Questions about this workout</span><button class="x" id="chatHide" aria-label="Hide the conversation">×</button></div>
  <div id="chatLog" aria-live="polite"></div>
</div>
<div id="chatBar" hidden>
  <input id="chatIn" placeholder="Ask about form, swaps, or weights" aria-label="Ask a question about this workout" autocomplete="off">
  <button id="chatSend" type="button">Send</button>
</div>

<nav class="tabs" aria-label="Sections">
  <button id="tabN" aria-current="page">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>
    Nutrition
  </button>
  <button id="tabT">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>
    Training
  </button>
</nav>

<div class="modal" id="scanModal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="scanTitle">
    <div class="sheetHead"><h2 id="scanTitle">Scan a barcode</h2><button class="x" id="scanClose" aria-label="Close scanner">×</button></div>
    <div id="reader"></div>
    <p class="status" id="scanMsg" role="status" aria-live="polite"></p>
    <label class="tool" for="barcodePhoto" style="margin-top:12px;width:100%;justify-content:center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Take a photo of the barcode instead
    </label>
    <input type="file" id="barcodePhoto" accept="image/*" capture="environment" hidden>
    <div class="manual">
      <input id="codeIn" inputmode="numeric" placeholder="Or type the digits printed under the barcode" aria-label="Barcode digits">
      <button id="codeGo">Look up</button>
    </div>
  </div>
</div>

<script>
const KEY = 'macrolog-v1';
let state = { targets:{cal:2400,pro:180,carb:250,fat:70}, days:{}, body:{}, custom:[] };
let current = new Date();

// artifact storage when available, otherwise the browser's own storage (for when the file is opened normally)
async function load(){
  try{
    if(window.storage){ const r = await window.storage.get(KEY); if(r && r.value) state = JSON.parse(r.value); return; }
  }catch(e){}
  try{ const v = localStorage.getItem(KEY); if(v) state = JSON.parse(v); }catch(e){}
}
async function save(){
  const s = JSON.stringify(state);
  try{ if(window.storage){ await window.storage.set(KEY, s); return; } }catch(e){}
  try{ localStorage.setItem(KEY, s); }catch(e){}
}

const $ = id => document.getElementById(id);
const dkey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const r1 = n => Math.round(n*10)/10;
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayList = () => state.days[dkey(current)] || [];
const macroLine = e => `${r1(e.pro)}g protein, ${r1(e.carb)}g carbs, ${r1(e.fat)}g fat`;

function totals(list){
  return list.reduce((t,e)=>({cal:t.cal+e.cal,pro:t.pro+e.pro,carb:t.carb+e.carb,fat:t.fat+e.fat}),{cal:0,pro:0,carb:0,fat:0});
}

const stem = t => t.replace(/ies$/,'y').replace(/oes$/,'o').replace(/([^s])s$/,'$1');
const tok = s => s.toLowerCase().split(/[^a-z0-9]+/).filter(t=>t && !['of','a','an','the','with'].includes(t)).map(stem);
const G = {g:1,kg:1000,oz:28.35,lb:453.6};

function render(){
  const isToday = dkey(new Date()) === dkey(current);
  $('dateMain').textContent = isToday ? 'Today' : current.toLocaleDateString(undefined,{weekday:'long'});
  $('dateSub').textContent = current.toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});

  const list = dayList(), t = totals(list), g = state.targets;
  const left = Math.round(g.cal - t.cal);
  $('remain').textContent = Math.abs(left).toLocaleString();
  $('remainLbl').textContent = left >= 0 ? (isToday ? 'calories left today' : 'calories left that day') : 'calories over the target';
  $('eaten').textContent = Math.round(t.cal).toLocaleString();
  $('goal').textContent = g.cal.toLocaleString();
  const cf = $('calFill');
  cf.style.width = (g.cal ? Math.min(100, t.cal/g.cal*100) : 0) + '%';
  cf.classList.toggle('over', g.cal && t.cal > g.cal);

  $('macros').innerHTML = [['Protein','pro','var(--pro)'],['Carbs','carb','var(--carb)'],['Fat','fat','var(--fat)']].map(([n,k,c])=>{
    const pct = g[k] ? Math.min(100, t[k]/g[k]*100) : 0;
    const over = k !== 'pro' && g[k] && t[k] > g[k];
    return `<div class="m"><div class="mName">${n}</div>
      <div class="mVal num"><b>${Math.round(t[k])}</b> <span>of ${g[k]} g</span></div>
      <div class="track"><div class="fill ${over?'over':''}" style="width:${pct}%;background:${c}"></div></div></div>`;
  }).join('');

  $('list').innerHTML = list.length ? list.map((e,i)=>`
    <div class="entry"><div class="t"><b>${esc(e.name||'Food')}</b><span>${macroLine(e)}</span></div>
    <div class="r"><span class="num">${Math.round(e.cal)}</span><button class="x" data-i="${i}" aria-label="Delete entry">×</button></div></div>`).join('')
    : '<p class="empty">Nothing is logged for this day yet. Type what you ate above, or scan a package, and it will show up here.</p>';

  // recent foods across all days, unique by name
  const seen = new Map();
  Object.keys(state.days).sort().reverse().forEach(d=>{
    [...state.days[d]].reverse().forEach(e=>{ if(e.name && !seen.has(e.name.toLowerCase())) seen.set(e.name.toLowerCase(), e); });
  });
  const recent = [...seen.values()].slice(0,12);
  $('recentPanel').hidden = !recent.length;
  $('recent').innerHTML = recent.map((e,i)=>`<button class="chip" data-r="${i}">${esc(e.name)}</button>`).join('');
  window._recent = recent;

  const bd = Object.keys(state.body).sort().reverse().slice(0,7);
  $('bodyHist').innerHTML = bd.map(d=>{
    const b = state.body[d];
    return `<div class="hist"><span>${d}</span><span class="num">${b.w ? b.w+' lb' : 'no weight'}, ${b.wa ? b.wa+' in waist' : 'no waist'}</span></div>`;
  }).join('');
  const b = state.body[dkey(current)];
  $('bW').value = b && b.w ? b.w : '';
  $('bWa').value = b && b.wa ? b.wa : '';

  $('tCal').value = g.cal; $('tPro').value = g.pro; $('tCarb').value = g.carb; $('tFat').value = g.fat;
}

function addEntry(e){
  const k = dkey(current);
  (state.days[k] = state.days[k] || []).push(e);

}

// custom food form: values are entered per serving
$('add').onclick = () => {
  const pro = parseFloat($('fPro').value)||0, carb = parseFloat($('fCarb').value)||0, fat = parseFloat($('fFat').value)||0;
  let cal = parseFloat($('fCal').value);
  if(isNaN(cal)) cal = Math.round(pro*4 + carb*4 + fat*9);
  if(!cal && !pro && !carb && !fat) return;
  const nm = $('fName').value.trim();
  if($('fSave').checked && nm){
    state.custom = state.custom.filter(c=>c.name.toLowerCase() !== nm.toLowerCase());
    state.custom.push({name:nm, per:{cal,pro,carb,fat}, serving:100, grams:false});
    $('fSave').checked = false;
  }
  addEntry({name:nm, cal, pro, carb, fat});
  ['fName','fCal','fPro','fCarb','fFat'].forEach(id=>$(id).value = '');
  $('fName').focus();
};
['fName','fCal','fPro','fCarb','fFat'].forEach(id=>$(id).addEventListener('keydown',ev=>{ if(ev.key === 'Enter') $('add').click(); }));

$('list').onclick = ev => {
  const b = ev.target.closest('.x'); if(!b) return;
  dayList().splice(+b.dataset.i, 1); save(); render();
};
$('recent').onclick = ev => {
  const b = ev.target.closest('.chip'); if(!b) return;
  const e = window._recent[+b.dataset.r];
  addEntry({name:e.name, cal:e.cal, pro:e.pro, carb:e.carb, fat:e.fat});
};
$('prev').onclick = () => { current.setDate(current.getDate()-1); render(); };
$('next').onclick = () => { current.setDate(current.getDate()+1); render(); };

$('saveBody').onclick = () => {
  const w = parseFloat($('bW').value), wa = parseFloat($('bWa').value);
  if(isNaN(w) && isNaN(wa)) return;
  state.body[dkey(current)] = {w: isNaN(w) ? null : w, wa: isNaN(wa) ? null : wa};
  save(); render();
};
[['tCal','cal'],['tPro','pro'],['tCarb','carb'],['tFat','fat']].forEach(([id,k])=>{
  $(id).onchange = () => { state.targets[k] = parseFloat($(id).value) || 0; save(); render(); };
});

}

/* ---------- search, parsing, preview ---------- */
const UNITS = {g:'g',gram:'g',grams:'g',kg:'kg',oz:'oz',ounce:'oz',ounces:'oz',lb:'lb',lbs:'lb',pound:'lb',pounds:'lb',
  cup:'cup',cups:'cup',tbsp:'tbsp',tablespoon:'tbsp',tablespoons:'tbsp',tsp:'tsp',teaspoon:'tsp',teaspoons:'tsp',
  slice:'slice',slices:'slice',scoop:'scoop',scoops:'scoop',can:'can',cans:'can',piece:'each',pieces:'each',each:'each',
  whole:'each',medium:'each',large:'each',small:'each',serving:'serving',servings:'serving',handful:'handful',handfuls:'handful',
  glass:'glass',glasses:'glass',bottle:'bottle',bottles:'bottle',square:'square',squares:'square',pat:'pat',pats:'pat',
  container:'container',containers:'container',shot:'shot',shots:'shot'};

// saved foods: either per serving (typed in by hand) or per 100 g with a serving size (scanned)
function customFoods(){
  return state.custom.map(c=>{
    const per = c.per || {cal:c.cal, pro:c.pro, carb:c.carb, fat:c.fat};
    const tk = new Set(tok(c.name));
    return {name:c.name, custom:true, grams:!!c.grams, per, units:{serving:c.serving || 100},
      tokens:tk, nameTokens:tk, phrases:[tok(c.name).join(' ')]};
  });
}
const unitsFor = f => (f.custom && !f.grams) ? f.units : Object.assign({}, G, f.units);

function search(q, limit){
  const qt = tok(q); if(!qt.length) return [];
  const qs = qt.join(' ');
  const all = customFoods().concat(DB);
  return all.map((f,idx)=>{
    let m = 0; qt.forEach(t=>{ if(f.tokens.has(t)) m++; });
    const ratio = m/qt.length;
    if(!m || ratio < 0.5) return null;
    const extra = [...f.nameTokens].filter(t=>!qt.includes(t)).length;
    let s = ratio*10 - extra*0.3 - idx*0.001;
    if(f.phrases.includes(qs)) s += 5;
    if(f.custom) s += 1;
    return {f,s};
  }).filter(Boolean).sort((a,b)=>b.s-a.s).slice(0, limit || 6).map(x=>x.f);
}

function num(t){
  if(/^\d+(\.\d+)?$/.test(t)) return parseFloat(t);
  const m = t.match(/^(\d+)\/(\d+)$/); if(m) return (+m[1] < +m[2]) ? m[1]/m[2] : null;
  const fr = {'½':.5,'¼':.25,'¾':.75,'⅓':1/3};
  return t in fr ? fr[t] : null;
}
function parseItem(raw){
  const t = raw.toLowerCase().replace(/\(.*?\)/g,' ').replace(/(\d)([a-z]+)/g,'$1 $2').replace(/(\d)([½¼¾])/g,'$1 $2');
  const w = t.split(/\s+/).filter(Boolean);
  let qty = null, unit = null;
  for(let i=0;i<w.length;i++){
    const n = num(w[i]);
    if(n !== null){
      qty = n; let j = i+1;
      const n2 = j < w.length ? num(w[j]) : null;
      if(n2 !== null && n2 < 1){ qty += n2; j++; }
      if(j < w.length && UNITS[w[j]]){ unit = UNITS[w[j]]; j++; }
      w.splice(i, j-i);
      break;
    }
  }
  return {qty: qty === null ? 1 : qty, unit, name: w.join(' ')};
}
function resolve(f, qty, unit){
  const U = unitsFor(f);
  let u = unit, warn = false;
  if(!u) u = U.each ? 'each' : 'serving';
  else if(!U[u]){ warn = true; u = U.each ? 'each' : 'serving'; }
  const k = qty*U[u]/100;
  return {u, warn, cal:f.per.cal*k, pro:f.per.pro*k, carb:f.per.carb*k, fat:f.per.fat*k};
}

let rows = [];
function parseAll(){
  const items = $('q').value.split(/[,\n;+]+/).map(s=>s.trim()).filter(Boolean);
  rows = items.map(raw=>{
    const p = parseItem(raw);
    const opts = p.name ? search(p.name) : [];
    return {name:p.name || raw, qty:p.qty, unit:p.unit, opts, f:opts[0] || null};
  });
  renderPreview();
}
function renderPreview(){
  let tot = 0, n = 0;
  $('preview').innerHTML = rows.map((r,i)=>{
    if(!r.f) return `<div class="pv"><div class="pvname">Nothing in the food bank matches “${esc(r.name)}”.</div>
      <div class="pvinfo">You can scan its barcode, photograph its label, or add it as a custom food, and it will be here the next time you type it.</div></div>`;
    const U = unitsFor(r.f), res = resolve(r.f, r.qty, r.unit);
    tot += res.cal; n++;
    const uopts = Object.keys(U).map(u=>`<option value="${u}" ${u===res.u?'selected':''}>${u}</option>`).join('');
    const fopts = r.opts.map((o,j)=>`<option value="${j}" ${o===r.f?'selected':''}>${esc(o.name)}</option>`).join('');
    return `<div class="pv" data-i="${i}"><select class="fsel" aria-label="Food">${fopts}</select>
      <div class="pvrow"><input class="qty" type="number" step="any" min="0" value="${r.qty}" aria-label="Amount">
      <select class="usel" aria-label="Unit">${uopts}</select>
      <span class="pvcal num">${Math.round(res.cal)}</span><button class="x rm" aria-label="Remove this item">×</button></div>
      <div class="pvinfo">${macroLine(res)}${res.warn ? `. This food has no size for the unit you typed, so ${res.u} is being used instead.` : ''}</div></div>`;
  }).join('');
  const b = $('addAll');
  b.hidden = !n;
  b.textContent = `Add ${n} item${n>1?'s':''} to the log (${Math.round(tot)} cal)`;
}

$('q').addEventListener('input', parseAll);
$('q').addEventListener('keydown', ev=>{
  if(ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); if(!$('addAll').hidden) $('addAll').click(); }
});
$('preview').addEventListener('change', ev=>{
  const row = ev.target.closest('.pv'); if(!row || row.dataset.i === undefined) return;
  const r = rows[+row.dataset.i], c = ev.target.classList;
  if(c.contains('fsel')){ r.f = r.opts[+ev.target.value]; if(r.unit && !unitsFor(r.f)[r.unit]) r.unit = null; }
  else if(c.contains('usel')) r.unit = ev.target.value;
  else if(c.contains('qty')) r.qty = parseFloat(ev.target.value) || 0;
  renderPreview();
});
$('preview').addEventListener('click', ev=>{
  const b = ev.target.closest('.rm'); if(!b) return;
  rows.splice(+b.closest('.pv').dataset.i, 1); renderPreview();
});
$('addAll').onclick = () => {
  const k = dkey(current);
  rows.forEach(r=>{
    if(!r.f || !r.qty) return;
    const res = resolve(r.f, r.qty, r.unit), q = r1(r.qty);
    const lab = res.u === 'each' ? `×${q}` : `${q} ${res.u}`;
    (state.days[k] = state.days[k] || []).push({name:`${r.f.name} (${lab})`, cal:Math.round(res.cal), pro:r1(res.pro), carb:r1(res.carb), fat:r1(res.fat)});
  });
  save(); $('q').value = ''; rows = []; renderPreview(); render();
};

/* ---------- scanned foods ---------- */
function cleanName(s){ return String(s||'').replace(/[,;+]/g,' ').replace(/\s+/g,' ').trim(); }
function keepScanned(name, per, serving, grams){
  name = cleanName(name) || 'Scanned food';
  state.custom = state.custom.filter(c=>c.name.toLowerCase() !== name.toLowerCase());
  state.custom.push({name, per, serving, grams});
  save();
  return name;
}
function stageFood(name){
  $('q').value = '1 serving ' + name;
  parseAll();
  $('q').scrollIntoView({behavior:'smooth', block:'center'});
}

/* ---------- barcode scanning (camera plus Open Food Facts) ---------- */
let scanner = null, scanBusy = false;
const setScanMsg = t => { $('scanMsg').textContent = t; };
const setToolMsg = t => { $('toolMsg').textContent = t; };

function loadScannerLib(){
  return new Promise((ok,bad)=>{
    if(window.Html5Qrcode) return ok();
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js';
    s.onload = ok; s.onerror = () => bad(new Error('scanner library'));
    document.head.appendChild(s);
  });
}
async function stopScanner(){
  if(scanner){ try{ await scanner.stop(); scanner.clear(); }catch(e){} scanner = null; }
}
async function openScan(){
  $('scanModal').hidden = false; $('codeIn').value = ''; scanBusy = false;
  setScanMsg('Starting the camera…');
  try{ await loadScannerLib(); }
  catch(e){ setScanMsg('The scanner could not be loaded, but you can still type the digits printed under the barcode.'); return; }
  try{
    const F = Html5QrcodeSupportedFormats;
    scanner = new Html5Qrcode('reader', {formatsToSupport:[F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.QR_CODE], useBarCodeDetectorIfSupported:true});
    await scanner.start({facingMode:'environment'}, {fps:10, qrbox:{width:260, height:140}}, txt=>lookupBarcode(txt), ()=>{});
    setScanMsg('Point the camera at the barcode on the package and hold it steady for a moment.');
  }catch(e){
    scanner = null;
    setScanMsg('The live camera did not start, which happens when a page is previewed inside another app. Taking a photo of the barcode below uses your phone\u2019s own camera and should work.');
  }
}
async function closeScan(){ await stopScanner(); $('scanModal').hidden = true; }

async function lookupBarcode(raw){
  if(scanBusy) return;
  const code = String(raw).replace(/\D/g,'');
  if(code.length < 8){ setScanMsg('That does not look like a full product barcode, which usually has between 8 and 13 digits.'); return; }
  scanBusy = true;
  setScanMsg('Looking up ' + code + '…');
  let data;
  try{
    const res = await fetch('https://world.openfoodfacts.org/api/v2/product/' + code + '.json?fields=product_name,brands,nutriments,serving_size,serving_quantity');
    data = await res.json();
  }catch(e){
    scanBusy = false;
    setScanMsg('The food database could not be reached from this page. If the page is running inside a sandbox that blocks outside requests, opening the file directly in your browser should fix it.');
    return;
  }
  const p = data && data.status === 1 ? data.product : null;
  if(!p){ scanBusy = false; setScanMsg('The database has no entry for ' + code + '. Reading the nutrition label with a photo should work for this one.'); return; }
  const n = p.nutriments || {};
  let kcal = n['energy-kcal_100g'];
  if(kcal == null && n['energy_100g'] != null) kcal = n['energy_100g']/4.184;
  if(kcal == null){ scanBusy = false; setScanMsg('The database knows this product but has no nutrition numbers for it. Reading the label with a photo should fill that gap.'); return; }
  const brand = p.brands ? p.brands.split(',')[0].trim() : '';
  const full = [brand, p.product_name].filter(Boolean).join(' ');
  const per = {cal:kcal, pro:+n.proteins_100g || 0, carb:+n.carbohydrates_100g || 0, fat:+n.fat_100g || 0};
  const name = keepScanned(full, per, parseFloat(p.serving_quantity) || 100, true);
  await closeScan();
  setToolMsg('Found ' + name + '. Adjust the amount below if you ate more or less than one serving.');
  stageFood(name);
}

/* ---------- nutrition label photo (read by Claude) ---------- */
function shrinkImage(file){
  return new Promise((ok,bad)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1400/Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => bad(new Error('image'));
    img.src = url;
  });
}
const LABEL_PROMPT = 'This is a photo of a nutrition facts label. Reply with only a JSON object, with no other text, using exactly these keys: ' +
  '"name" (the product name if it is visible, otherwise "Labeled food"), "serving_g" (grams per serving as a number, or null if the label gives no gram weight), ' +
  '"calories", "protein", "carbs" and "fat" (all per serving, as numbers, with fat, carbs and protein in grams). Use null for anything that cannot be read.';

async function readLabel(file){
  setToolMsg('Reading the label…');
  try{
    const b64 = await shrinkImage(file);
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:1000, messages:[{role:'user', content:[
        {type:'image', source:{type:'base64', media_type:'image/jpeg', data:b64}},
        {type:'text', text:LABEL_PROMPT}]}]})
    });
    const data = await res.json();
    const text = (data.content || []).map(i=>i.text || '').join('');
    const j = JSON.parse(text.replace(/```json|```/g,'').trim());
    if(j.calories == null) throw new Error('no calories');
    let per, serving, grams;
    if(j.serving_g > 0){
      const k = 100/j.serving_g;
      per = {cal:j.calories*k, pro:(j.protein||0)*k, carb:(j.carbs||0)*k, fat:(j.fat||0)*k};
      serving = j.serving_g; grams = true;
    }else{
      per = {cal:j.calories, pro:j.protein||0, carb:j.carbs||0, fat:j.fat||0};
      serving = 100; grams = false;
    }
    const name = keepScanned(j.name || 'Labeled food', per, serving, grams);
    setToolMsg('Read the label for ' + name + '. Check the numbers in the preview, since photos of curved packaging can occasionally misread.');
    stageFood(name);
  }catch(e){
    setToolMsg('The label could not be read this time. This feature needs a connection to Claude from the page, which depends on where the file is opened, so the barcode scanner or a custom food is the fallback.');
  }
}

async function scanPhoto(file){
  setScanMsg('Reading the barcode from your photo…');
  try{
    await loadScannerLib();
    await stopScanner();
    const F = Html5QrcodeSupportedFormats;
    const h = new Html5Qrcode('reader', {formatsToSupport:[F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.QR_CODE], useBarCodeDetectorIfSupported:true});
    const text = await h.scanFile(file, false);
    try{ h.clear(); }catch(e){}
    lookupBarcode(text);
  }catch(e){
    setScanMsg('No barcode could be read from that photo. Getting closer so the bars fill most of the frame usually helps, and you can also type the digits printed underneath.');
  }
}

    {n:'Reverse pec deck', sets:3, lo:12, hi:15, inc:2.5, alts:['Face pull','Rear delt cable fly']},
    {n:'EZ-bar curl', sets:3, lo:8, hi:12, inc:5, alts:['Dumbbell curl','Cable curl']},
    {n:'Skull crushers', sets:3, lo:8, hi:12, inc:5, alts:['Overhead cable triceps extension','Triceps pushdown']},
    {n:'Ab crunch machine', sets:4, lo:10, hi:15, inc:5, ab:true, alts:[]}]}
];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const sundayOf = d => addDays(d, -d.getDay());
const shortDate = d => d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const longDate = d => d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
function startOfToday(){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
const sKey = n => 's' + n;
const sessRec = n => state.train.sessions[sKey(n)];
const tplOf = n => TPL[n % TPL.length];

// finished workouts are numbered in order; the next unfinished one is the pointer everything else hangs from
function nextIdx(){ let n = 0; while(sessRec(n) && sessRec(n).done) n++; return n; }

// dates for every workout from the first one through `upto`: finished ones sit on the day they were done,
// the next one lands on the first allowed day, and the rest follow at one day apart with three days after each block of five
function sequence(upto, minN){
  const T = state.train, out = [], today = startOfToday();
  const gap = k => (k % TPL.length === 0 ? 3 : 1);
  let n = 0, prev = null;
  while(sessRec(n) && sessRec(n).done){
    const d = pd(sessRec(n).doneOn); out.push({n, date:d, fin:true}); prev = d; n++;
  }
  let d;
  if(prev) d = addDays(prev, gap(n));
  else if(T.start) d = pd(T.start);
  else d = today;
  if(d < today) d = today;
  if(T.notBefore && pd(T.notBefore) > d) d = pd(T.notBefore);
  out.push({n, date:d, fin:false});
  while(out.length < 800 && (d <= upto || n < minN)){
    n++; d = addDays(d, gap(n)); out.push({n, date:d, fin:false});
  }
  return out;
}
function infoOf(n){
  const it = sequence(addDays(startOfToday(), 400), n).find(x=>x.n === n);
  return {n, tpl:tplOf(n), date:it.date, fin:it.fin, dk:dkey(it.date)};
}

// progression: stay at a weight until every set reaches the top of the rep range, then add the lift's increment
function lastPerf(name, excludeN){
  let best = null;
  for(const key in state.train.sessions){
    if(key === sKey(excludeN)) continue;
    const rec = state.train.sessions[key], ex = (rec.ex||[]).find(e=>e.n === name);
    if(!ex) continue;
    const ok = ex.sets.filter(s=>s.ok && s.r > 0);
    if(!ok.length) continue;
    const date = rec.doneOn || rec.when || '';
    if(!best || date > best.date) best = {date, sets:ok};
  }
  return best;
}
function suggest(te, name, excludeN){
  const p = lastPerf(name, excludeN);
  if(!p) return {w:'', text:'There is no history for this lift yet, so pick a weight that leaves about two reps in reserve on the first set.'};
  const w = Math.max(...p.sets.map(s=>+s.w || 0));
  const summary = p.sets.map(s=>`${s.w ? s.w : 'bodyweight'}×${s.r}`).join(', ');
  if(p.sets.every(s=>s.r >= te.hi)){
    if(!te.inc) return {w: w || '', text:`Every set reached ${te.hi} reps last time (${summary}), so make the next round harder with a longer reach or a slower lowering phase.`};
    const up = w + te.inc;
    return {w:up, text: w ? `Every set reached ${te.hi} reps last time (${summary}), so this time go up to ${up} lb.`
                          : `Every set reached ${te.hi} reps last time (${summary}), so it is time to add some weight, starting around ${up} lb.`};
  }
  return {w: w || '', text:`Last time you did ${summary}. Stay at ${w || 'bodyweight'} and try to add a rep or two on each set before moving up.`};
}
function makeRec(n){
  return {done:false, doneOn:null, when:null, ex:tplOf(n).ex.map(e=>{
    const sg = suggest(e, e.n, n);
    return {n:e.n, sets:Array.from({length:e.sets}, ()=>({w:sg.w, r:'', ok:false, auto:true}))};
  })};
}

let tMonth = (()=>{ const n = startOfToday(); return new Date(n.getFullYear(), n.getMonth(), 1); })();
let openN = null;

function renderTrain(){
  $('tHeader').hidden = openN !== null;
  if(openN !== null) renderSessionView(); else renderMonthView();
  syncChat();
}

function renderMonthView(){
  const first = tMonth, last = new Date(first.getFullYear(), first.getMonth()+1, 0);
  $('tTitle').textContent = first.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const today = startOfToday(), todayK = dkey(today);
  const gridStart = sundayOf(first), gridEnd = addDays(sundayOf(last), 6);
  const seq = sequence(gridEnd), map = {};
  let total = 0, done = 0;
  seq.forEach(it=>{
    const k = dkey(it.date);
    if(it.date >= gridStart && it.date <= gridEnd && !map[k]) map[k] = it;
    if(it.date.getMonth() === first.getMonth() && it.date.getFullYear() === first.getFullYear() && it.date <= last){ total++; if(it.fin) done++; }
  });
  $('tSub').textContent = total ? `${done} of ${total} workouts finished` : 'No workouts this month';

  let cells = '';
  for(let dt = gridStart; dt <= gridEnd; dt = addDays(dt,1)){
    const k = dkey(dt), it = map[k], cls = ['day'];
    if(dt.getMonth() !== first.getMonth()) cls.push('out');
    if(k === todayK) cls.push('today');
    if(it){
      const tp = tplOf(it.n);
      cls.push(tp.type); if(it.fin) cls.push('done');
      cells += `<button class="${cls.join(' ')}" data-n="${it.n}" aria-label="${esc(tp.name+', '+longDate(dt)+(it.fin?', finished':''))}"><span class="dn">${dt.getDate()}</span><span class="dl">${it.fin ? '✓' : tp.type}</span></button>`;
    }else{
      cells += `<div class="${cls.join(' ')} rest"><span class="dn">${dt.getDate()}</span></div>`;
    }
  }

  const wkStart = sundayOf(today), wkEnd = addDays(wkStart, 6);
  const inWeek = sequence(wkEnd).filter(it=>it.date >= wkStart && it.date <= wkEnd);
  const rows = inWeek.map(it=>{
    const tp = tplOf(it.n), k = dkey(it.date);
    const tag = it.fin ? '<span class="tag fin">Finished</span>' : k === todayK ? '<span class="tag now">Today</span>' : '';
    return `<button class="wrow" data-n="${it.n}"><div><b>${tp.name}</b><span class="s">${shortDate(it.date)}, ${tp.focus}</span></div>${tag}</button>`;
  }).join('');
  const busy = new Set(inWeek.map(it=>it.date.getDay()));
  const free = [0,1,2,3,4,5,6].filter(o=>!busy.has(o)).map(o=>DAYS[o]);
  const freeText = free.length ? `No workout is planned on ${free.join(' or ')} this week.` : 'Every day this week has a workout planned.';

  let startCard = '';
  if(nextIdx() === 0){
    const s0 = sequence(today)[0].date;
    startCard = `<section class="card"><label class="f" for="startDate">First workout</label>
      <input id="startDate" type="date" value="${dkey(s0)}" min="${todayK}">
      <p class="muted">The first workout starts today, with the next four on the following days and two rest days after that. Pick a later day if you would rather wait.</p></section>`;
  }

  $('tBody').innerHTML = `
    <section class="card cal">
      <div class="dow"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
      <div class="grid">${cells}</div>
    </section>
    <p class="legend">U marks an upper body day and L marks a lower body day. If you skip a day, that workout and every one after it slides back a day on its own. Tap any of them to open it, log your sets, and check it off when you finish.</p>
    ${startCard}
    <section class="card"><h2>This week</h2><div class="wrows">${rows || '<p class="empty">Nothing is scheduled this week.</p>'}</div>
      <p class="muted">${freeText}</p></section>`;
}

function renderSessionView(){
  const n = openN, s = infoOf(n), ni = nextIdx();
  let rec = sessRec(n);
  if(!rec) rec = state.train.sessions[sKey(n)] = makeRec(n);
  const todayK = dkey(startOfToday());
  let when;
  if(s.fin) when = `Finished on ${longDate(pd(rec.doneOn))}.`;
  else if(s.dk === todayK) when = 'Planned for today.';
  else when = `Planned for ${longDate(s.date)}.`;

  // untouched sets follow the latest suggestion, sets you have edited or checked stay as you left them
  rec.ex.forEach((e,j)=>{
    const sg = suggest(s.tpl.ex[j], e.n, n);
    e.sets.forEach(st=>{ if(st.auto && !st.ok) st.w = sg.w; });
  });

  const nAll = rec.ex.reduce((a,e)=>a+e.sets.length, 0);
  const nOk = rec.ex.reduce((a,e)=>a+e.sets.filter(x=>x.ok).length, 0);

  const exHtml = rec.ex.map((e,j)=>{
    const te = s.tpl.ex[j], sg = suggest(te, e.n, n);
    const alts = [te.n].concat(te.alts).filter(x=>x !== e.n);
    const head = te.ab && !(j > 0 && s.tpl.ex[j-1].ab) ? '<h2 style="margin:20px 2px 10px">Ab work</h2>' : '';
    const sets = e.sets.map((st,k)=>`
      <div class="setrow ${st.ok ? 'ok' : ''}" data-j="${j}" data-k="${k}"><span class="sn">${k+1}</span>
        <input class="sw" type="number" inputmode="decimal" step="any" min="0" placeholder="lb" value="${st.w === '' ? '' : st.w}" aria-label="Weight for set ${k+1}">
        <input class="sr" type="number" inputmode="numeric" min="0" placeholder="${te.lo}-${te.hi}" value="${st.r === '' ? '' : st.r}" aria-label="Reps for set ${k+1}">
        <button class="chk" type="button" aria-pressed="${st.ok}" aria-label="Mark set ${k+1} done">✓</button></div>`).join('');
    return `${head}<section class="ex" data-j="${j}">
      <div class="exHead"><b>${esc(e.n)}</b><span>${te.sets} sets of ${te.lo} to ${te.hi}</span></div>
      <p class="sug">${esc(sg.text)}</p>
      <div class="setHead"><span></span><span>Weight (lb)</span><span>Reps</span><span></span></div>${sets}
      <div class="exFoot"><button class="tool addSet" type="button">Add a set</button>
        ${alts.length ? `<select class="swap" aria-label="Swap this exercise"><option value="">Swap exercise</option>${alts.map(x=>`<option>${esc(x)}</option>`).join('')}</select>` : ''}</div>
    </section>`;
  }).join('');

  let footer;
  if(n === ni && !rec.done) footer = `<button class="primary" id="doneBtn">Mark workout as finished</button>`;
  else if(rec.done && n === ni-1) footer = `<button class="primary" id="doneBtn">Finished, tap to reopen</button>`;
  else if(rec.done) footer = '';
  else footer = `<p class="muted">This workout unlocks once the ones before it are finished, and you are welcome to look it over until then.</p>`;

  const push = (n === ni && !rec.done)
    ? `<button class="tool" id="pushBtn" type="button" style="margin-top:12px">Push back a day</button>
       <p class="muted" style="margin-top:8px">Pushing back moves this workout and every one after it a day later.</p>` : '';

  $('tBody').innerHTML = `
    <button class="back" id="tBack">‹ Back to the calendar</button>
    <div class="sessTitle">${s.tpl.name}</div>
    <p class="sessSub">${esc(s.tpl.focus.charAt(0).toUpperCase()+s.tpl.focus.slice(1))}. ${when}</p>
    <section class="card"><p class="muted" style="margin:0" id="setCount">${nOk} of ${nAll} sets logged so far.</p>${push}</section>
    ${exHtml}
    ${footer}`;
}

function setSetCount(){
  const rec = sessRec(openN); if(!rec) return;
  const nAll = rec.ex.reduce((a,e)=>a+e.sets.length, 0), nOk = rec.ex.reduce((a,e)=>a+e.sets.filter(x=>x.ok).length, 0);
  const el = $('setCount'); if(el) el.textContent = `${nOk} of ${nAll} sets logged so far.`;
}

$('tBody').addEventListener('click', ev=>{
  const t = ev.target;
  const open = t.closest('.day[data-n], .wrow[data-n]');
  if(open){ openN = +open.dataset.n; renderTrain(); window.scrollTo(0,0); return; }
  if(t.closest('#tBack')){ openN = null; renderTrain(); window.scrollTo(0,0); return; }
  const rec = openN !== null && sessRec(openN); if(!rec) return;
  const chk = t.closest('.chk');
  if(chk){
    const row = chk.closest('.setrow'), st = rec.ex[+row.dataset.j].sets[+row.dataset.k];
    if(!st.ok){
      const reps = parseFloat(row.querySelector('.sr').value);
      if(!(reps > 0)){ row.querySelector('.sr').focus(); return; }
      st.r = reps; st.w = parseFloat(row.querySelector('.sw').value) || 0; st.ok = true; st.auto = false;
      rec.when = dkey(startOfToday());
    }else st.ok = false;
    row.classList.toggle('ok', st.ok); chk.setAttribute('aria-pressed', st.ok);
    save(); setSetCount(); return;
  }
  const add = t.closest('.addSet');
  if(add){
    const ex = rec.ex[+add.closest('.ex').dataset.j], lastSet = ex.sets[ex.sets.length-1];
    ex.sets.push({w:lastSet ? lastSet.w : '', r:'', ok:false, auto:lastSet ? lastSet.auto : true}); save(); renderTrain(); return;
  }
  if(t.closest('#pushBtn')){
    const s = infoOf(openN); state.train.notBefore = dkey(addDays(s.date, 1)); save(); renderTrain(); return;
  }
  if(t.closest('#doneBtn')){
    const ni = nextIdx();
    if(!rec.done && openN === ni){ rec.done = true; rec.doneOn = dkey(startOfToday()); state.train.notBefore = null; }
    else if(rec.done && openN === ni-1){ rec.done = false; rec.doneOn = null; }
    else return;
    save(); renderTrain(); window.scrollTo(0,0);
  }
});
$('tBody').addEventListener('change', ev=>{
  const t = ev.target;
  if(t.id === 'startDate'){
    if(t.value){ state.train.start = t.value; state.train.notBefore = null; save(); renderTrain(); }
    return;
  }
  const rec = openN !== null && sessRec(openN); if(!rec) return;
  const row = t.closest('.setrow');
  if(row){
    const st = rec.ex[+row.dataset.j].sets[+row.dataset.k], v = t.value === '' ? '' : parseFloat(t.value);
    if(t.classList.contains('sw')){ st.w = v; st.auto = false; } else if(t.classList.contains('sr')) st.r = v;
    save(); return;
  }
  if(t.classList.contains('swap') && t.value){
    const j = +t.closest('.ex').dataset.j, ex = rec.ex[j];
    ex.n = t.value;
    ex.sets.forEach(st=>{ if(!st.ok) st.auto = true; });
    save(); renderTrain();
  }
});
$('tPrev').onclick = () => { tMonth = new Date(tMonth.getFullYear(), tMonth.getMonth()-1, 1); renderTrain(); };
$('tNext').onclick = () => { tMonth = new Date(tMonth.getFullYear(), tMonth.getMonth()+1, 1); renderTrain(); };

function showTab(t){
  $('viewN').hidden = t !== 'n'; $('viewT').hidden = t !== 't';
  $('tabN').setAttribute('aria-current', t === 'n' ? 'page' : 'false');
  $('tabT').setAttribute('aria-current', t === 't' ? 'page' : 'false');
  if(t === 't') renderTrain();
  syncChat();
  window.scrollTo(0,0);
}
$('tabN').onclick = () => showTab('n');
$('tabT').onclick = () => showTab('t');

/* ---------- workout chat (answers come from Claude) ---------- */
const chats = {};
let chatCollapsed = false, chatBusy = false;
const CHAT_SYSTEM = 'You are a concise strength coach built into a workout logging app. The lifter runs an upper and lower split, five sessions a week, ' +
  'avoids deadlifts and barbell back squats, and is happy with machine versions of squat and hinge movements. Dedicated ab work is one exercise on three days a week, the ab crunch machine on two of them and leg raises on the other. ' +
  'Answer questions about form, substitutions, weights, reps, rest and progression in a few short plain sentences, with no headings, no bullet lists and no markdown. ' +
  'Only suggest exercises that fit those preferences. If a question involves pain or an injury, tell them to back off and have it looked at by a professional. ' +
  'The progression rule in the app is to hold a weight until every set reaches the top of the rep range and then add weight.';

function workoutContext(n){
  const s = infoOf(n), rec = sessRec(n); if(!rec) return '';
  const lines = rec.ex.map((e,j)=>{
    const te = s.tpl.ex[j];
    const sets = e.sets.map(st=>st.ok ? `${st.w || 'bodyweight'} x ${st.r}` : 'not done').join(', ');
    return `${e.n} (${te.sets} sets of ${te.lo} to ${te.hi}): ${sets}`;
  });
  return `Current workout: ${s.tpl.name}, focusing on ${s.tpl.focus}.\n` + lines.join('\n');
}
function syncChat(){
  const on = !$('viewT').hidden && openN !== null;
  const msgs = on ? (chats[openN] || []) : [];
  $('chatBar').hidden = !on;
  $('chatPanel').hidden = !(on && msgs.length && !chatCollapsed);
  $('viewT').classList.toggle('chatOn', on);
  if(on){
    $('chatLog').innerHTML = msgs.map(m=>`<div class="msg ${m.role}">${esc(m.text)}</div>`).join('');
    $('chatLog').scrollTop = $('chatLog').scrollHeight;
  }
}
async function sendChat(){
  const text = $('chatIn').value.trim();
  if(!text || chatBusy || openN === null) return;
  const key = openN, list = (chats[key] = chats[key] || []);
  list.push({role:'user', text});
  const pending = {role:'assistant', text:'Thinking…', pending:true};
  list.push(pending);
  $('chatIn').value = ''; chatCollapsed = false; chatBusy = true; syncChat();
  try{
    const hist = list.filter(m=>!m.pending).slice(-12).map(m=>({role:m.role, content:m.text}));
    while(hist.length && hist[0].role !== 'user') hist.shift();
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:1000, system:CHAT_SYSTEM + '\n\n' + workoutContext(key), messages:hist})
    });
    const data = await res.json();
    const reply = (data.content || []).map(i=>i.text || '').join('').trim();
    if(!reply) throw new Error('empty reply');
    pending.text = reply;
  }catch(e){
    pending.text = 'Claude could not be reached from this page, so that question did not go through. The chat works when the app is opened inside Claude, and a copy hosted on its own would need a separate API connection.';
  }
  delete pending.pending; chatBusy = false;
  syncChat();
}
$('chatSend').onclick = sendChat;
$('chatIn').addEventListener('keydown', ev=>{ if(ev.key === 'Enter'){ ev.preventDefault(); sendChat(); } });
$('chatIn').addEventListener('focus', ()=>{ if(chatCollapsed && (chats[openN] || []).length){ chatCollapsed = false; syncChat(); } });
$('chatHide').onclick = () => { chatCollapsed = true; syncChat(); };

load().then(()=>{
  state.custom = state.custom || [];
  state.train = state.train || {};
  state.train.sessions = state.train.sessions || {};
  render();
});

</script>
