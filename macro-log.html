<style>
  :root{
    color-scheme:light dark;
    --serif:ui-serif,"New York","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --bg:#f3eee4; --ink:#1d1b16; --muted:#7b7467;
    --field:rgba(255,253,248,.7); --line:rgba(29,27,22,.13); --line2:rgba(29,27,22,.26);
    --pro:#2e5e47; --carb:#a8741f; --fat:#7a5a72; --danger:#a5382b;
    --acc:#2e5e47; --accInk:#f7f3ea;
    --glass:rgba(243,238,228,.68); --glassBd:rgba(29,27,22,.1);
    --track:rgba(29,27,22,.1);
    --uBg:#e1e6e5; --uInk:#2f4f5c; --uSolid:#35596a;
    --lBg:#efe2c8; --lInk:#7a5416; --lSolid:#a8741f;
    --blob1:rgba(122,160,128,.30); --blob2:rgba(196,150,90,.22); --blob3:rgba(150,130,170,.14);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14120e; --ink:#ece6d8; --muted:#9a927f;
      --field:rgba(255,248,230,.06); --line:rgba(236,230,216,.13); --line2:rgba(236,230,216,.26);
      --pro:#86b79a; --carb:#d6a55a; --fat:#b997b0; --danger:#e0766a;
      --acc:#86b79a; --accInk:#14120e;
      --glass:rgba(20,18,14,.66); --glassBd:rgba(236,230,216,.1);
      --track:rgba(236,230,216,.12);
      --uBg:#1b2a31; --uInk:#9cc3d4; --uSolid:#4d8199;
      --lBg:#2e2415; --lInk:#e2b66a; --lSolid:#c28f3e;
      --blob1:rgba(122,160,128,.16); --blob2:rgba(196,150,90,.10); --blob3:rgba(150,130,170,.08);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(70% 36% at 0% 0%,var(--blob1),transparent 72%),
               radial-gradient(60% 34% at 100% 30%,var(--blob2),transparent 72%),
               radial-gradient(80% 40% at 40% 100%,var(--blob3),transparent 72%)}
  .num{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum","lnum"}
  .wrap{max-width:520px;margin:0 auto;padding:0 20px 120px}
  [hidden]{display:none!important}

  /* frosted header */
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
    margin:0 -20px;padding:calc(12px + env(safe-area-inset-top)) 20px 12px;
    background:var(--glass);border-bottom:1px solid var(--glassBd);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6)}
  header button{background:none;border:0;width:40px;height:40px;font-size:26px;line-height:1;color:var(--ink);cursor:pointer;border-radius:6px}
  header button:active{background:var(--track)}
  .date{text-align:center}
  .date b{display:block;font-family:var(--serif);font-size:19px;font-weight:500;letter-spacing:-.01em}
  .date span{font-size:12.5px;color:var(--muted)}

  /* sections: open layout, hairlines instead of cards */
  .card{padding:26px 0 24px;border-top:1px solid var(--line);margin:0;animation:fade .5s ease both}
  #viewN>.card:first-of-type,#tBody>.card:first-child{border-top:0}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  h2{font-family:var(--serif);font-size:20px;font-weight:500;letter-spacing:-.01em;margin:0 0 14px}
  .eyebrow,.mName,.ringUnit,.dow,label.f,.setHead{text-transform:uppercase;letter-spacing:.09em}

  /* hero */
  .heroNum{font-family:var(--serif);font-size:76px;line-height:.95;font-weight:400;letter-spacing:-.04em}
  .heroTop{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
  .heroLbl{font-size:13px;color:var(--muted);margin-top:8px}
  .heroEaten{font-size:13px;color:var(--muted);text-align:right;padding-bottom:3px;line-height:1.45}
  .heroEaten b{display:block;color:var(--ink);font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:-.02em;line-height:1.1}
  .calBar{height:2px;background:var(--track);margin-top:18px;position:relative}
  .calBar i{position:absolute;left:0;top:-1px;bottom:-1px;background:var(--ink);transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .calBar i.over{background:var(--danger)}
  .macros{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:26px}
  .m .mName{font-size:10.5px;color:var(--muted);font-weight:600}
  .m .mVal{margin:4px 0 8px}
  .m .mVal b{font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:-.02em}
  .m .mVal span{color:var(--muted);font-size:12px;margin-left:2px}
  .track{height:2px;background:var(--track);position:relative;border-radius:0}
  .fill{height:3px;position:absolute;left:0;top:-.5px;border-radius:0;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .fill.over{background:var(--danger)!important}

  /* inputs */
  input,textarea,select{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line2);border-radius:6px;transition:border-color .15s,box-shadow .15s}
  input,select{height:46px;padding:0 12px;width:100%}
  textarea{width:100%;padding:12px;resize:none;line-height:1.45;font-size:16px}
  input::placeholder,textarea::placeholder{color:var(--muted);opacity:.85}
  input[type=checkbox]{width:auto;height:auto;accent-color:var(--acc)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
  button:focus-visible,summary:focus-visible,.tool:focus-within{outline:2px solid var(--acc);outline-offset:2px}
  label.f{font-size:10.5px;color:var(--muted);display:block;margin-bottom:5px;font-weight:600}
  button{font:inherit;transition:transform .12s,opacity .15s,background .15s}
  button:active,.tool:active{transform:scale(.985)}
  .primary{width:100%;height:50px;margin-top:12px;background:var(--ink);color:var(--bg);border:0;border-radius:6px;font-weight:600;font-size:15px;letter-spacing:.01em;cursor:pointer}
  .primary:hover{opacity:.92}
  .tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .tool{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 14px;background:transparent;color:var(--ink);
    border:1px solid var(--line2);border-radius:6px;font-size:14px;font-weight:550;cursor:pointer}
  .tool svg{flex:none;color:var(--muted)}
  .status{font-size:13px;color:var(--muted);margin:10px 0 0}
  .status:empty{display:none}

  /* preview rows */
  #preview{margin-top:10px}
  .pv{border-top:1px solid var(--line);padding:14px 0}
  .pv .fsel{width:100%;margin-bottom:8px;font-weight:550}
  .pvrow{display:flex;gap:8px;align-items:center}
  .pvrow .qty{width:88px;flex:none}
  .pvrow .usel{flex:1;min-width:0}
  .pvcal{font-family:var(--serif);font-size:26px;font-weight:400;letter-spacing:-.02em;min-width:56px;text-align:right}
  .pvinfo{font-size:13px;color:var(--muted);margin-top:7px}
  .pvname{font-size:14px}

  details.custom{margin-top:18px;border-top:1px solid var(--line);padding-top:16px}
  summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;justify-content:space-between}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";font-size:20px;font-weight:300;color:var(--muted)}
  details[open] summary::after{content:"\2212"}
  .form{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
  .form .name{grid-column:1/-1}
  .save{grid-column:1/-1;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;text-transform:none;letter-spacing:0}

  /* log */
  .entry{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);position:relative;overflow:hidden}
  .entry:first-child{border-top:0;padding-top:0}
  .entry .t{min-width:0}
  .entry .t b{display:block;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .entry .t span{font-size:13px;color:var(--muted)}
  .entry .r{display:flex;align-items:center;gap:4px}
  .entry .r .num{font-family:var(--serif);font-size:21px;letter-spacing:-.02em}
  .entry .t,.entry .r{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
  .entry .del{position:absolute;right:0;top:0;bottom:0;width:92px;border:0;background:var(--danger);color:#fff;font-weight:600;cursor:pointer;
    transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
  .entry.swiped .del{transform:none}
  .entry.swiped .t,.entry.swiped .r{transform:translateX(-100px)}
  .x{background:none;border:0;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:6px 9px;border-radius:6px}
  .x:hover{background:var(--track)}
  .empty{color:var(--muted);margin:0}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:transparent;border:1px solid var(--line2);border-radius:4px;padding:7px 12px;font-size:14px;cursor:pointer;color:var(--ink)}

  .two{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
  .two button{height:46px;background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:0 22px;font-weight:600;cursor:pointer}
  .hist{display:flex;justify-content:space-between;font-size:14px;padding:10px 0;border-top:1px solid var(--line)}
  #bodyHist{margin-top:14px}
  #bodyHist .hist:first-child{border-top:0}
  .targets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}

  /* scanner sheet (frosted) */
  .modal{position:fixed;inset:0;background:rgba(10,9,6,.42);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:flex;align-items:flex-end;justify-content:center;z-index:20}
  .modal[hidden]{display:none}
  .sheet{background:var(--glass);border-top:1px solid var(--glassBd);backdrop-filter:blur(30px) saturate(1.7);-webkit-backdrop-filter:blur(30px) saturate(1.7);
    width:100%;max-width:520px;border-radius:14px 14px 0 0;padding:20px 20px calc(18px + env(safe-area-inset-bottom));animation:sheetUp .3s cubic-bezier(.2,.8,.2,1) both}
  @keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .sheetHead h2{margin:0}
  #reader{width:100%;min-height:200px;border-radius:6px;overflow:hidden;background:#0d0c09}
  .manual{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
  .manual button{height:46px;background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:0 20px;font-weight:600;cursor:pointer}

  /* frosted tab bar */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--glass);border-top:1px solid var(--glassBd);
    backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);padding-bottom:env(safe-area-inset-bottom)}
  .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;background:none;border:0;position:relative;
    color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
  .tabs button[aria-current=page]{color:var(--ink)}
  .tabs button[aria-current=page]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--ink)}

  /* calendar */
  .cal{padding-top:22px}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:8px;text-align:center;font-size:10px;color:var(--muted);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
  .day{aspect-ratio:1/1;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;background:transparent;display:flex;flex-direction:column;
    align-items:center;justify-content:space-between;padding:6px 0 7px;font:inherit;color:var(--ink);position:relative}
  button.day{cursor:pointer}
  .day.rest{color:var(--muted)}
  .day.out{opacity:.36}
  .day.today::after{content:"";position:absolute;inset:2px;border:1.5px solid var(--ink);pointer-events:none}
  .day .dn{font-size:11px;line-height:1;opacity:.8}
  .day .dl{font-family:var(--serif);font-size:19px;font-weight:500;line-height:1}
  .day.U{background:var(--uBg);color:var(--uInk)}
  .day.L{background:var(--lBg);color:var(--lInk)}
  .day.done{color:#fff}
  .day.U.done{background:var(--uSolid)}
  .day.L.done{background:var(--lSolid)}
  .day.missed .dl{text-decoration:line-through;text-decoration-thickness:1px;opacity:.7}
  .legend{font-size:13px;color:var(--muted);margin:14px 0 0}
  .wrow{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;
    border-top:1px solid var(--line);padding:14px 0;cursor:pointer;color:var(--ink)}
  .wrows .wrow:first-child{border-top:0;padding-top:0}
  .wrow b{display:block;font-family:var(--serif);font-weight:500;font-size:18px;letter-spacing:-.01em}
  .wrow span.s{font-size:13px;color:var(--muted)}
  .tag{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .tag.fin{color:var(--pro)}
  .tag.miss{color:var(--danger)}
  .tag.now{color:var(--bg);background:var(--ink);padding:4px 8px;border-radius:3px}
  .muted{color:var(--muted);font-size:13px;margin:12px 0 0}

  /* workout */
  .back{background:none;border:0;font-size:14px;font-weight:600;color:var(--muted);padding:16px 0 8px;cursor:pointer}
  .sessTitle{font-family:var(--serif);font-size:40px;font-weight:400;letter-spacing:-.035em;line-height:1.05}
  .sessSub{color:var(--muted);margin:8px 0 16px}
  .ex{padding:22px 0;border-top:1px solid var(--line)}
  .exHead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .exHead b{font-family:var(--serif);font-weight:500;font-size:20px;letter-spacing:-.015em}
  .exHead span{font-size:12px;color:var(--muted);white-space:nowrap}
  .sug{font-size:13px;color:var(--muted);margin:8px 0 14px;padding-left:12px;border-left:2px solid var(--line2);font-style:italic}
  .setHead,.setrow{display:grid;grid-template-columns:26px 1fr 1fr 48px;gap:8px;align-items:center}
  .setHead{font-size:10px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .setrow{margin-bottom:8px}
  .setrow .sn{font-family:var(--serif);font-size:15px;color:var(--muted);text-align:center}
  .setrow input{text-align:center;font-weight:600;font-size:16px}
  .chk{height:46px;border-radius:6px;border:1px solid var(--line2);background:transparent;color:var(--line2);font-size:19px;cursor:pointer}
  .setrow.ok .chk{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
  .setrow.ok input{border-color:color-mix(in srgb,var(--acc) 55%,transparent)}
  .exFoot{display:flex;gap:8px;margin-top:6px}
  .exFoot .tool{flex:none}
  .exFoot select{flex:1;min-width:0;height:42px;font-size:14px}


  /* craft details */
  body::after{content:"";position:fixed;inset:0;z-index:50;pointer-events:none;background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .3 0 0 0 0 .26 0 0 0 0 .2 0 0 0 .55 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.28;mix-blend-mode:multiply}
  @media (prefers-color-scheme:dark){body::after{opacity:.18;mix-blend-mode:screen}}
  body{font-kerning:normal;font-feature-settings:"kern","liga","calt";text-rendering:optimizeLegibility;hanging-punctuation:first}
  h2,.sessTitle,.exHead b,.wrow b{text-wrap:balance}
  p,.sug,.legend,.muted{text-wrap:pretty}
  .heroLbl{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--muted)}
  .heroEaten{font-family:var(--serif);font-style:italic;font-size:14px}
  .card{border-top:0;padding:30px 0 12px}
  .card::before{content:"\2726";display:block;text-align:center;height:14px;line-height:14px;font-size:9px;color:var(--muted);margin:0 0 26px;
    background:linear-gradient(var(--line),var(--line)) left center/calc(50% - 16px) 1px no-repeat,linear-gradient(var(--line),var(--line)) right center/calc(50% - 16px) 1px no-repeat}
  #viewN>.card:first-of-type::before,#tBody>.card:first-child::before,#tBody>.cal::before{display:none}
  #viewN>.card:first-of-type{padding-top:34px}
  #viewN::after{content:"\2726";display:block;text-align:center;color:var(--muted);font-size:11px;padding:6px 0 0;opacity:.7}
  .legend{margin:16px 0 4px;font-family:var(--serif);font-style:italic;font-size:14px}
  .setrow input{font-family:var(--serif);font-size:19px;font-weight:500;letter-spacing:-.01em}
  .sug{font-family:var(--serif);font-size:14px}
  .muted{font-family:var(--serif);font-style:italic;font-size:14px}
  .pvinfo,.entry .t span{font-family:var(--serif);font-style:italic;font-size:14px}
  .entry .t b{font-family:var(--serif);font-weight:500;font-size:17px}
  .tag.now::before{content:"\2726\00a0";font-size:8px}
  ::selection{background:color-mix(in srgb,var(--acc) 28%,transparent)}

  /* progress */
  .big{font-family:var(--serif);font-size:54px;line-height:1;font-weight:400;letter-spacing:-.035em}
  .big .unit{font-size:18px;font-style:italic;color:var(--muted);margin-left:6px;letter-spacing:0}
  .delta{font-family:var(--serif);font-style:italic;font-size:14.5px;color:var(--muted);margin:8px 0 14px}
  .chart{width:100%;height:auto;display:block;overflow:visible}
  .chart .cg{stroke:var(--line);stroke-width:1}
  .chart .ct{font-family:var(--serif);font-style:italic;font-size:10.5px;fill:var(--muted)}
  .chart .cl{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .chart .cl.thin{stroke-width:1.4}
  .chart .cr{fill:none;stroke:var(--line2);stroke-width:1}
  .chart .cd{fill:var(--bg);stroke:var(--muted);stroke-width:1.2}
  .chart .cf{fill:var(--ink)}
  .chart .cpr{fill:color-mix(in srgb,var(--acc) 22%,transparent);stroke:var(--acc);stroke-width:1.5}
  .chart .cs{fill:var(--acc);font-size:11px}
  .range{display:flex;gap:18px;padding:16px 0 4px;border-bottom:1px solid var(--line)}
  .range button{background:none;border:0;padding:4px 0;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
  .range button.on{color:var(--ink);border-bottom-color:var(--ink)}
  #pBody>.card:first-child::before,#pBody>.range+.card::before{display:none}
  .setrow.ok .chk{animation:pop .3s cubic-bezier(.2,.8,.2,1)}
  @keyframes pop{0%{transform:scale(.82)}55%{transform:scale(1.07)}100%{transform:none}}


  /* ---------- Lorien theme ---------- */
  :root[data-theme="loth"]{
    --serif:"Cormorant Garamond",ui-serif,Georgia,serif;
    --bg:#edefe6; --ink:#1c2822; --muted:#64746a;
    --field:rgba(255,255,250,.55); --line:rgba(28,40,34,.14); --line2:rgba(28,40,34,.28);
    --pro:#3f6f55; --carb:#9a7a3c; --fat:#76698f; --danger:#a8503c;
    --acc:#a07a26; --accInk:#fff; --leaf:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%23a07a26' stroke-width='.9' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M2.2 13.8C2.2 6.5 7 2.6 13.8 2.2 14.1 9.1 9.9 13.5 2.2 13.8z'/%3E%3Cpath d='M2.2 13.8L10.6 5.4'/%3E%3C/svg%3E");
    --glass:rgba(237,239,230,.66); --glassBd:rgba(28,40,34,.1); --track:rgba(28,40,34,.12);
    --uBg:#dfe6dd; --uInk:#2f5240; --uSolid:#3f6f55; --lBg:#ebe3d0; --lInk:#7a5c1c; --lSolid:#a07a26;
    --blob1:rgba(206,176,98,.30); --blob2:rgba(110,150,120,.22); --blob3:rgba(140,160,170,.14);
  }
  @media (prefers-color-scheme:dark){
    :root[data-theme="loth"]{
      --bg:#0b1210; --ink:#e4e9df; --muted:#8d9d92;
      --field:rgba(220,235,222,.05); --line:rgba(214,228,216,.12); --line2:rgba(214,228,216,.24);
      --pro:#a6c8a6; --carb:#b8a070; --fat:#a59cc0; --danger:#dc8a74;
      --acc:#d3ae62; --accInk:#0b1210; --leaf:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%23d3ae62' stroke-width='.9' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M2.2 13.8C2.2 6.5 7 2.6 13.8 2.2 14.1 9.1 9.9 13.5 2.2 13.8z'/%3E%3Cpath d='M2.2 13.8L10.6 5.4'/%3E%3C/svg%3E");
      --glass:rgba(11,18,16,.62); --glassBd:rgba(214,228,216,.1); --track:rgba(214,228,216,.13);
      --uBg:#13201a; --uInk:#b6cdb9; --uSolid:#2f5a45; --lBg:#211b12; --lInk:#d4b57c; --lSolid:#8a6a2c;
      --blob1:rgba(211,174,98,.17); --blob2:rgba(80,130,100,.22); --blob3:rgba(120,150,160,.08);
    }
  }
  [data-theme="loth"] body::before{background:radial-gradient(75% 42% at 50% -6%,var(--blob1),transparent 72%),
      radial-gradient(60% 40% at 0% 70%,var(--blob2),transparent 72%),radial-gradient(60% 34% at 100% 40%,var(--blob3),transparent 72%);
      animation:canopy 14s ease-in-out infinite alternate}
  @keyframes canopy{from{opacity:.78}to{opacity:1}}
  @media (prefers-color-scheme:dark){[data-theme="loth"] body::after{opacity:.1}}
  [data-theme="loth"] body{font-feature-settings:"kern","liga","onum"}
  [data-theme="loth"] .num{font-variant-numeric:oldstyle-nums tabular-nums;font-feature-settings:"onum","tnum"}

  [data-theme="loth"] .heroNum,[data-theme="loth"] .big,[data-theme="loth"] .macro .num,[data-theme="loth"] .mVal b,[data-theme="loth"] .mval{font-variant-numeric:lining-nums proportional-nums;font-feature-settings:"lnum","pnum";letter-spacing:-.01em}
  [data-theme="loth"] .card{animation-duration:.9s;animation-timing-function:cubic-bezier(.22,.61,.36,1)}
  [data-theme="loth"] .card::before{height:16px;line-height:0;font-size:0;margin-bottom:26px;
    background:var(--leaf) center/15px 15px no-repeat,linear-gradient(90deg,transparent,var(--line2)) left center/calc(50% - 20px) 1px no-repeat,
      linear-gradient(270deg,transparent,var(--line2)) right center/calc(50% - 20px) 1px no-repeat}
  [data-theme="loth"] #viewN::after{content:"";height:16px;width:16px;margin:8px auto 0;background:var(--leaf) center/15px 15px no-repeat;padding:0;opacity:1}
  [data-theme="loth"] h2{font-size:25px;font-weight:500;letter-spacing:-.005em}
  [data-theme="loth"] .date b{font-size:22px;font-weight:500}
  [data-theme="loth"] .heroNum{font-size:92px;font-weight:400;letter-spacing:-.03em}
  [data-theme="loth"] .heroLbl{font-size:18px;font-weight:500}
  [data-theme="loth"] .heroEaten{font-size:16px;font-weight:500}

  [data-skin="folio"] .wrap>div[id^="view"]{margin-top:-4px}

  [data-skin="folio"] .heroNum{font-size:56px;font-weight:400;letter-spacing:0;font-variant-numeric:lining-nums;text-align:center}
  [data-skin="folio"] .heroLbl,[data-skin="folio"] .heroEaten{text-align:center;font-size:16px}
  [data-skin="folio"] .num{font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum","tnum"}

  [data-skin="folio"] .sessSub{text-align:center;font-style:italic}

  [data-skin="folio"] .tabs button[aria-current=page]{color:var(--acc)}

  :root[data-skin="sport"]{
    --serif:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;
    --bg:#f4f5f7; --ink:#0e1116; --muted:#6b7380;
    --field:#fff; --line:rgba(14,17,22,.09); --line2:rgba(14,17,22,.2);
    --pro:#e5484d; --carb:#f2a93b; --fat:#3e8bff; --danger:#e5484d;
    --acc:#2f6bff; --accInk:#fff; --panel:#fff;
    --glass:rgba(244,245,247,.86); --glassBd:rgba(14,17,22,.08); --track:rgba(14,17,22,.08);
    --uBg:#e8eefc; --uInk:#1f4fd1; --uSolid:#2f6bff; --lBg:#fdeeda; --lInk:#a65f0a; --lSolid:#f2a93b;
  }
  @media (prefers-color-scheme:dark){
    :root[data-skin="sport"]{
      --bg:#0b0d10; --ink:#f2f4f7; --muted:#8b94a1;
      --field:#15181d; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.18);
      --pro:#ff5d62; --carb:#ffb547; --fat:#5a9bff; --danger:#ff5d62;
      --acc:#4f86ff; --accInk:#fff; --panel:#12151a;
      --glass:rgba(11,13,16,.84); --glassBd:rgba(255,255,255,.08); --track:rgba(255,255,255,.1);
      --uBg:#121c33; --uInk:#9dbcff; --uSolid:#2f5fd6; --lBg:#2a1f0e; --lInk:#ffc873; --lSolid:#b87a1a;
    }
  }
  [data-skin="sport"] body{background:var(--bg);font-size:16px;font-feature-settings:"tnum","cv11";letter-spacing:-.005em}
  [data-skin="sport"] body::before,[data-skin="sport"] body::after{display:none}
  [data-skin="sport"] *{font-family:var(--serif)!important}
  [data-skin="sport"] .num,[data-skin="sport"] .heroNum,[data-skin="sport"] .big,[data-skin="sport"] .setrow input{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum","lnum"}
  [data-skin="sport"] header{background:var(--glass)}
  [data-skin="sport"] .date b,[data-skin="sport"] h2{font-size:19px;font-weight:700;letter-spacing:-.02em;font-style:normal;text-align:left}
  [data-skin="sport"] .date b{text-align:center}
  [data-skin="sport"] .date span,[data-skin="sport"] .heroLbl,[data-skin="sport"] .heroEaten,[data-skin="sport"] .muted,[data-skin="sport"] .delta,[data-skin="sport"] .legend,[data-skin="sport"] .sug,[data-skin="sport"] .pvinfo,[data-skin="sport"] .entry .t span,[data-skin="sport"] .sessSub{font-style:normal;font-size:13px;color:var(--muted)}
  [data-skin="sport"] .heroNum{font-size:64px;font-weight:800;letter-spacing:-.045em;line-height:1}
  [data-skin="sport"] .heroLbl{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
  [data-skin="sport"] .heroEaten{font-size:13px}
  [data-skin="sport"] .heroEaten b{font-weight:700;color:var(--ink)}
  [data-skin="sport"] .big{font-size:48px;font-weight:800;letter-spacing:-.04em}
  [data-skin="sport"] .big .unit{font-style:normal;font-size:16px;font-weight:600}
  [data-skin="sport"] .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:12px 0;padding:20px 18px}
  [data-skin="sport"] .card::before,[data-skin="sport"] #viewN::after{display:none}
  [data-skin="sport"] #viewN>.card:first-of-type{padding-top:22px}
  [data-skin="sport"] .mName,[data-skin="sport"] label,[data-skin="sport"] .tag,[data-skin="sport"] .setHead{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
  [data-skin="sport"] .mVal{font-size:13px;white-space:nowrap}
  [data-skin="sport"] .mVal b{font-size:22px;font-weight:700;letter-spacing:-.02em}
  [data-skin="sport"] .track{height:6px;border-radius:3px;overflow:hidden}
  [data-skin="sport"] .track .fill{border-radius:3px}
  [data-skin="sport"] .calBar{height:8px;border-radius:4px;overflow:hidden;margin-top:16px;background:var(--track)}
  [data-skin="sport"] .calBar .fill,[data-skin="sport"] #calBarFill{background:var(--acc);border-radius:4px}
  [data-skin="sport"] .primary,[data-skin="sport"] .manual button,[data-skin="sport"] .two button{background:var(--acc);color:var(--accInk);border:0;border-radius:10px;font-weight:700;font-size:15px;letter-spacing:0}
  [data-skin="sport"] .tool{background:var(--field);border:1px solid var(--line2);border-radius:10px;font-weight:600;color:var(--ink)}
  [data-skin="sport"] input,[data-skin="sport"] textarea,[data-skin="sport"] select{background:var(--field);border:1px solid var(--line2);border-radius:10px}
  [data-skin="sport"] .setrow input{font-size:18px;font-weight:700}
  [data-skin="sport"] .chk{border-radius:10px}
  [data-skin="sport"] .setrow.ok .chk{background:var(--acc);border-color:var(--acc)}
  [data-skin="sport"] .sessTitle{font-size:30px;font-weight:800;letter-spacing:-.035em;text-align:left}
  [data-skin="sport"] .exHead b,[data-skin="sport"] .wrow b,[data-skin="sport"] .entry .t b{font-size:16px;font-weight:700;letter-spacing:-.01em}
  [data-skin="sport"] .sug{border-left:2px solid var(--acc);color:var(--ink)}
  [data-skin="sport"] .tabs{background:var(--glass)}
  [data-skin="sport"] .tabs button{font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:none}
  [data-skin="sport"] .tabs button[aria-current=page]{color:var(--acc)}
  [data-skin="sport"] .tabs button[aria-current=page] svg{stroke:var(--acc)}
  [data-skin="sport"] .tabs button[aria-current=page]::before{background:var(--acc);height:2px}
  [data-skin="sport"] .range button,[data-skin="sport"] .themes button{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  [data-skin="sport"] .range button.on,[data-skin="sport"] .themes button.on{color:var(--acc);border-bottom-color:var(--acc)}
  [data-skin="sport"] .chart .cl{stroke:var(--acc);stroke-width:2.5}
  [data-skin="sport"] .chart .ct{font-style:normal;font-size:10px}
  [data-skin="sport"] .chart .cn{fill:var(--acc)}
  [data-skin="sport"] a,[data-skin="sport"] .back{color:var(--acc)}
  .wks{margin-top:6px}
  .wk{display:grid;grid-template-columns:1fr auto 52px;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
  .wks .wk:first-child{border-top:0}
  .wk .wd{display:flex;gap:6px}
  .wk .wd i{width:10px;height:10px;border-radius:50%;border:1px solid var(--line2);display:block}
  .wk .wd i.on{background:var(--ink);border-color:var(--ink)}
  .wk .wm{text-align:right;font-size:13px}
  .wk.cur{color:var(--ink)}
  .wk.full{color:var(--ink)}
  .wk.full .wd i.on{background:var(--acc);border-color:var(--acc)}
  .wk.full .wm{color:var(--acc);font-size:17px;font-weight:700}
  .themes{display:flex;gap:22px;margin-top:2px}
  .themes button{background:none;border:0;padding:4px 0;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
  .themes button.on{color:var(--ink);border-bottom-color:var(--ink)}
  [data-theme="loth"] .themes button{font-family:var(--serif);font-size:15px;letter-spacing:.14em}
  [data-theme="loth"] .themes button.on{color:var(--acc);border-bottom-color:var(--acc)}
  .chart .cn{fill:var(--ink)}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div class="wrap">
  <div id="viewN">
  <header>
    <button id="prev" aria-label="Previous day">‹</button>
    <div class="date"><b id="dateMain"></b><span id="dateSub"></span></div>
    <button id="next" aria-label="Next day">›</button>
  </header>

  <section class="card">
    <div class="heroTop">
      <div>
        <div class="heroNum num" id="remain">0</div>
        <div class="heroLbl" id="remainLbl">calories left today</div>
      </div>
      <div class="heroEaten"><b class="num" id="eaten">0</b>eaten of <span class="num" id="goal">0</span></div>
    </div>
    <div class="calBar"><i id="calBarFill" style="width:0"></i></div>
    <div class="macros" id="macros"></div>
  </section>

  <section class="card">
    <h2>Log food</h2>
    <textarea id="q" rows="2" placeholder="Type what you ate, like “pinto beans cooked 1 lb, 1 tbsp butter, 2 eggs”" aria-label="Foods to log"></textarea>
    <div id="preview"></div>
    <button class="primary" id="addAll" hidden></button>

    <div class="tools">
      <button class="tool" id="scanBtn" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5v14M8 5v14M12 5v14M16 5v9M20 5v14M16 18v1"/></svg>
        Scan a barcode
      </button>
    </div>
    <p class="status" id="toolMsg" role="status" aria-live="polite"></p>

    <details class="custom">
      <summary>Add a custom food</summary>
      <div class="form">
        <div class="name"><label class="f" for="fName">Food</label><input id="fName" autocomplete="off"></div>
        <div><label class="f" for="fCal">Calories</label><input id="fCal" type="number" inputmode="numeric" min="0"></div>
        <div><label class="f" for="fPro">Protein g</label><input id="fPro" type="number" inputmode="decimal" min="0"></div>
        <div><label class="f" for="fCarb">Carbs g</label><input id="fCarb" type="number" inputmode="decimal" min="0"></div>
        <div><label class="f" for="fFat">Fat g</label><input id="fFat" type="number" inputmode="decimal" min="0"></div>
        <label class="save"><input type="checkbox" id="fSave"><span>Keep this food so it comes up when I search by name. The values above are treated as one serving.</span></label>
      </div>
      <button class="primary" id="add">Add to today's log</button>
    </details>
  </section>

  <section class="card" id="recentPanel" hidden>
    <h2>Recent foods</h2>
    <div class="chips" id="recent"></div>
  </section>

  <section class="card">
    <h2>Today's log</h2>
    <div id="list"></div>
    <div class="tools"><button class="tool" id="copyPrev" type="button" hidden></button></div>
  </section>

  <section class="card">
    <h2>Weight and waist</h2>
    <div class="two">
      <div><label class="f" for="bW">Weight, lb</label><input id="bW" type="number" inputmode="decimal" step="0.1"></div>
      <div><label class="f" for="bWa">Waist, in</label><input id="bWa" type="number" inputmode="decimal" step="0.25"></div>
      <button id="saveBody">Save</button>
    </div>
    <div id="bodyHist"></div>
  </section>

<script>
const KEY = 'macrolog-v1';
let state = { targets:{cal:2400,pro:180,carb:250,fat:70}, days:{}, body:{}, custom:[] };
let current = new Date();

// artifact storage when available, otherwise the browser's own storage (for when the file is opened normally)
async function load(){
  try{
    if(window.storage){ const r = await window.storage.get(KEY); if(r && r.value) state = JSON.parse(r.value); return; }
  }catch(e){}
  try{ const v = localStorage.getItem(KEY); if(v) state = JSON.parse(v); }catch(e){}
}
async function save(){
  const s = JSON.stringify(state);
  try{ if(window.storage){ await window.storage.set(KEY, s); return; } }catch(e){}
  try{ localStorage.setItem(KEY, s); }catch(e){}
}

const $ = id => document.getElementById(id);
const dkey = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const r1 = n => Math.round(n*10)/10;
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayList = () => state.days[dkey(current)] || [];
const macroLine = e => `${r1(e.pro)}g protein, ${r1(e.carb)}g carbs, ${r1(e.fat)}g fat`;

function totals(list){
  return list.reduce((t,e)=>({cal:t.cal+e.cal,pro:t.pro+e.pro,carb:t.carb+e.carb,fat:t.fat+e.fat}),{cal:0,pro:0,carb:0,fat:0});
}

const stem = t => t.replace(/ies$/,'y').replace(/oes$/,'o').replace(/([^s])s$/,'$1');
const tok = s => s.toLowerCase().split(/[^a-z0-9]+/).filter(t=>t && !['of','a','an','the','with'].includes(t)).map(stem);
const G = {g:1,kg:1000,oz:28.35,lb:453.6};

function render(){
  const isToday = dkey(new Date()) === dkey(current);
  $('dateMain').textContent = isToday ? 'Today' : current.toLocaleDateString(undefined,{weekday:'long'});
  $('dateSub').textContent = current.toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});

  const list = dayList(), t = totals(list), g = state.targets;
  const left = Math.round(g.cal - t.cal);
  $('remain').textContent = (left < 0 ? '\u2212' : '') + Math.abs(left).toLocaleString();
  $('remain').style.color = left < 0 ? 'var(--danger)' : '';
  $('remainLbl').textContent = isToday ? 'calories left today' : 'calories left that day';
  $('eaten').textContent = Math.round(t.cal).toLocaleString();
  $('goal').textContent = g.cal.toLocaleString();
  const bar = $('calBarFill');
  bar.style.width = (g.cal ? Math.min(100, t.cal/g.cal*100) : 0) + '%';
  bar.classList.toggle('over', !!(g.cal && t.cal > g.cal));

  $('macros').innerHTML = [['Protein','pro','var(--pro)'],['Carbs','carb','var(--carb)'],['Fat','fat','var(--fat)']].map(([n,k,c])=>{
    const pct = g[k] ? Math.min(100, t[k]/g[k]*100) : 0;
    const over = k !== 'pro' && g[k] && t[k] > g[k];
    return `<div class="m"><div class="mName">${n}</div>
      <div class="mVal num"><b>${Math.round(t[k])}</b> <span>of ${g[k]} g</span></div>
      <div class="track"><div class="fill ${over?'over':''}" style="width:${pct}%;background:${c}"></div></div></div>`;
  }).join('');

  const prevEntries = state.days[dkey(addDays(current,-1))] || [];
  $('copyPrev').hidden = !prevEntries.length;
  $('copyPrev').textContent = 'Copy ' + addDays(current,-1).toLocaleDateString(undefined,{weekday:'long'}) + '\u2019s log (' + Math.round(prevEntries.reduce((a,e)=>a+e.cal,0)).toLocaleString() + ' cal)';
  $('list').innerHTML = list.length ? list.map((e,i)=>`
    <div class="entry"><div class="t"><b>${esc(e.name||'Food')}</b><span>${macroLine(e)}</span></div>
    <div class="r"><span class="num">${Math.round(e.cal)}</span><button class="x" data-i="${i}" aria-label="Delete entry">×</button></div><button class="del" data-i="${i}" aria-label="Delete entry">Delete</button></div>`).join('')
    : '<p class="empty">Nothing is logged for this day yet. Type what you ate above, or scan a package, and it will show up here.</p>';

  // recent foods across all days, unique by name
  const seen = new Map();
  Object.keys(state.days).sort().reverse().forEach(d=>{
    [...state.days[d]].reverse().forEach(e=>{ if(e.name && !seen.has(e.name.toLowerCase())) seen.set(e.name.toLowerCase(), e); });
  });
  const recent = [...seen.values()].slice(0,12);
  $('recentPanel').hidden = !recent.length;
  $('recent').innerHTML = recent.map((e,i)=>`<button class="chip" data-r="${i}">${esc(e.name)}</button>`).join('');
  window._recent = recent;

  const bd = Object.keys(state.body).sort().reverse().slice(0,7);
  $('bodyHist').innerHTML = bd.map(d=>{
    const b = state.body[d];
    return `<div class="hist"><span>${d}</span><span class="num">${b.w ? b.w+' lb' : 'no weight'}, ${b.wa ? b.wa+' in waist' : 'no waist'}</span></div>`;
  }).join('');
  const b = state.body[dkey(current)];
  $('bW').value = b && b.w ? b.w : '';
  $('bWa').value = b && b.wa ? b.wa : '';

  $('tCal').value = g.cal; $('tPro').value = g.pro; $('tCarb').value = g.carb; $('tFat').value = g.fat;
}

function addEntry(e){
  const k = dkey(current);
  (state.days[k] = state.days[k] || []).push(e);
  save(); render();
}

// custom food form: values are entered per serving
$('add').onclick = () => {
  const pro = parseFloat($('fPro').value)||0, carb = parseFloat($('fCarb').value)||0, fat = parseFloat($('fFat').value)||0;
  let cal = parseFloat($('fCal').value);
  if(isNaN(cal)) cal = Math.round(pro*4 + carb*4 + fat*9);
  if(!cal && !pro && !carb && !fat) return;
  const nm = $('fName').value.trim();
  if($('fSave').checked && nm){
    state.custom = state.custom.filter(c=>c.name.toLowerCase() !== nm.toLowerCase());
    state.custom.push({name:nm, per:{cal,pro,carb,fat}, serving:100, grams:false});
    $('fSave').checked = false;
  }
  addEntry({name:nm, cal, pro, carb, fat});
  ['fName','fCal','fPro','fCarb','fFat'].forEach(id=>$(id).value = '');
  $('fName').focus();
};
['fName','fCal','fPro','fCarb','fFat'].forEach(id=>$(id).addEventListener('keydown',ev=>{ if(ev.key === 'Enter') $('add').click(); }));

$('list').onclick = ev => {
  const b = ev.target.closest('.x, .del'); if(!b) return;
  dayList().splice(+b.dataset.i, 1); save(); render();
};
$('recent').onclick = ev => {
  const b = ev.target.closest('.chip'); if(!b) return;
  const e = window._recent[+b.dataset.r];
  addEntry({name:e.name, cal:e.cal, pro:e.pro, carb:e.carb, fat:e.fat});
};
$('prev').onclick = () => { current.setDate(current.getDate()-1); render(); };
$('next').onclick = () => { current.setDate(current.getDate()+1); render(); };

$('saveBody').onclick = () => {
  const w = parseFloat($('bW').value), wa = parseFloat($('bWa').value);
  if(isNaN(w) && isNaN(wa)) return;
  state.body[dkey(current)] = {w: isNaN(w) ? null : w, wa: isNaN(wa) ? null : wa};
  save(); render();
};
[['tCal','cal'],['tPro','pro'],['tCarb','carb'],['tFat','fat']].forEach(([id,k])=>{
  $(id).onchange = () => { state.targets[k] = parseFloat($(id).value) || 0; save(); render(); };
});


const DB = [];
// names (first is display, rest are aliases), then per 100 g: cal, protein, carbs, fat, then unit sizes in grams
function F(names,cal,pro,carb,fat,units){
  const ns = names.split('|'), all = new Set();
  ns.forEach(n=>tok(n).forEach(t=>all.add(t)));
  DB.push({name:ns[0], per:{cal,pro,carb,fat}, units:Object.assign({serving:100},units||{}),
    tokens:all, nameTokens:new Set(tok(ns[0])), phrases:ns.map(n=>tok(n).join(' '))});
}
// legumes
F('Pinto beans, cooked|pinto beans|pintos',143,9,26.2,0.65,{cup:171});
F('Black beans, cooked|black beans',132,8.9,23.7,0.5,{cup:172});
F('Kidney beans, cooked|kidney beans',127,8.7,22.8,0.5,{cup:177});
F('Chickpeas, cooked|chickpeas|garbanzo beans',164,8.9,27.4,2.6,{cup:164});
F('Lentils, cooked|lentils',116,9,20,0.4,{cup:198});
F('Refried beans|refried beans canned',94,5.4,15,1.5,{cup:252});
F('Edamame|edamame shelled',121,12,9,5.2,{cup:155});
F('Pinto beans, dry',347,21,63,1.2,{cup:193});
F('Black beans, dry',341,21.6,62.4,1.4,{cup:194});
F('Lentils, dry',352,25,63,1.1,{cup:192});
// eggs, dairy
F('Egg, whole|egg|eggs',143,12.6,0.7,9.5,{each:50});

/* ---------- search, parsing, preview ---------- */
const UNITS = {g:'g',gram:'g',grams:'g',kg:'kg',oz:'oz',ounce:'oz',ounces:'oz',lb:'lb',lbs:'lb',pound:'lb',pounds:'lb',
  cup:'cup',cups:'cup',tbsp:'tbsp',tablespoon:'tbsp',tablespoons:'tbsp',tsp:'tsp',teaspoon:'tsp',teaspoons:'tsp',
  slice:'slice',slices:'slice',scoop:'scoop',scoops:'scoop',can:'can',cans:'can',piece:'each',pieces:'each',each:'each',
  whole:'each',medium:'each',large:'each',small:'each',serving:'serving',servings:'serving',handful:'handful',handfuls:'handful',
  glass:'glass',glasses:'glass',bottle:'bottle',bottles:'bottle',square:'square',squares:'square',pat:'pat',pats:'pat',
  container:'container',containers:'container',shot:'shot',shots:'shot'};

// saved foods: either per serving (typed in by hand) or per 100 g with a serving size (scanned)
function customFoods(){
  return state.custom.map(c=>{
    const per = c.per || {cal:c.cal, pro:c.pro, carb:c.carb, fat:c.fat};
    const tk = new Set(tok(c.name));
    return {name:c.name, custom:true, grams:!!c.grams, per, units:{serving:c.serving || 100},
      tokens:tk, nameTokens:tk, phrases:[tok(c.name).join(' ')]};
  });
}
const unitsFor = f => (f.custom && !f.grams) ? f.units : Object.assign({}, G, f.units);

function search(q, limit){
  const qt = tok(q); if(!qt.length) return [];
  const qs = qt.join(' ');
  const all = customFoods().concat(DB);
  return all.map((f,idx)=>{
    let m = 0; qt.forEach(t=>{ if(f.tokens.has(t)) m++; });
    const ratio = m/qt.length;
    if(!m || ratio < 0.5) return null;
    const extra = [...f.nameTokens].filter(t=>!qt.includes(t)).length;
    let s = ratio*10 - extra*0.3 - idx*0.001;
    if(f.phrases.includes(qs)) s += 5;
    if(f.custom) s += 1;
    return {f,s};
  }).filter(Boolean).sort((a,b)=>b.s-a.s).slice(0, limit || 6).map(x=>x.f);
}

function num(t){
  if(/^\d+(\.\d+)?$/.test(t)) return parseFloat(t);
  const m = t.match(/^(\d+)\/(\d+)$/); if(m) return (+m[1] < +m[2]) ? m[1]/m[2] : null;
  const fr = {'½':.5,'¼':.25,'¾':.75,'⅓':1/3};
  return t in fr ? fr[t] : null;
}
function parseItem(raw){
  const t = raw.toLowerCase().replace(/\(.*?\)/g,' ').replace(/(\d)([a-z]+)/g,'$1 $2').replace(/(\d)([½¼¾])/g,'$1 $2');
  const w = t.split(/\s+/).filter(Boolean);
  let qty = null, unit = null;
  for(let i=0;i<w.length;i++){
    const n = num(w[i]);
    if(n !== null){
      qty = n; let j = i+1;
      const n2 = j < w.length ? num(w[j]) : null;
      if(n2 !== null && n2 < 1){ qty += n2; j++; }
      if(j < w.length && UNITS[w[j]]){ unit = UNITS[w[j]]; j++; }
      w.splice(i, j-i);
      break;
    }
  }
  return {qty: qty === null ? 1 : qty, unit, name: w.join(' ')};
}
function resolve(f, qty, unit){
  const U = unitsFor(f);
  let u = unit, warn = false;
  if(!u) u = U.each ? 'each' : 'serving';
  else if(!U[u]){ warn = true; u = U.each ? 'each' : 'serving'; }
  const k = qty*U[u]/100;
  return {u, warn, cal:f.per.cal*k, pro:f.per.pro*k, carb:f.per.carb*k, fat:f.per.fat*k};
}

let rows = [];
function parseAll(){
  const items = $('q').value.split(/[,\n;+]+/).map(s=>s.trim()).filter(Boolean);
  rows = items.map(raw=>{
    const p = parseItem(raw);
    const opts = p.name ? search(p.name) : [];
    return {name:p.name || raw, qty:p.qty, unit:p.unit, opts, f:opts[0] || null};
  });
  renderPreview();
}
function renderPreview(){
  let tot = 0, n = 0;
  $('preview').innerHTML = rows.map((r,i)=>{
    if(!r.f) return `<div class="pv"><div class="pvname">Nothing in the food bank matches “${esc(r.name)}”.</div>
      <div class="pvinfo">You can scan its barcode or add it as a custom food, and it will be here the next time you type it.</div></div>`;
    const U = unitsFor(r.f), res = resolve(r.f, r.qty, r.unit);
    tot += res.cal; n++;
    const uopts = Object.keys(U).map(u=>`<option value="${u}" ${u===res.u?'selected':''}>${u}</option>`).join('');
    const fopts = r.opts.map((o,j)=>`<option value="${j}" ${o===r.f?'selected':''}>${esc(o.name)}</option>`).join('');
    return `<div class="pv" data-i="${i}"><select class="fsel" aria-label="Food">${fopts}</select>
      <div class="pvrow"><input class="qty" type="number" step="any" min="0" value="${r.qty}" aria-label="Amount">
      <select class="usel" aria-label="Unit">${uopts}</select>
      <span class="pvcal num">${Math.round(res.cal)}</span><button class="x rm" aria-label="Remove this item">×</button></div>
      <div class="pvinfo">${macroLine(res)}${res.warn ? `. This food has no size for the unit you typed, so ${res.u} is being used instead.` : ''}</div></div>`;
  }).join('');
  const b = $('addAll');
  b.hidden = !n;
  b.textContent = `Add ${n} item${n>1?'s':''} to the log (${Math.round(tot)} cal)`;
}

/* ---------- barcode photo decoding (zxing) ---------- */
async function decodeBarcodeFile(file){
  const Z = window.ZXing; if(!Z) throw new Error('decoder missing');
  const hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.QR_CODE]);
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  const reader = new Z.MultiFormatReader(); reader.setHints(hints);
  let bmp;
  try{ bmp = await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch(e){ bmp = await createImageBitmap(file); }
  const tryCanvas = c => {
    const ctx = c.getContext('2d', {willReadFrequently:true}), d = ctx.getImageData(0,0,c.width,c.height).data;
    const lum = new Uint8ClampedArray(c.width*c.height);
    for(let i=0,j=0;i<d.length;i+=4,j++) lum[j] = (d[i]*299 + d[i+1]*587 + d[i+2]*114)/1000;
    const src = new Z.RGBLuminanceSource(lum, c.width, c.height);
    for(const B of [Z.HybridBinarizer, Z.GlobalHistogramBinarizer]){
      try{ return reader.decode(new Z.BinaryBitmap(new B(src))).getText(); }catch(e){}
    }
    return null;
  };
  const mk = (w,h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  for(const maxSide of [1600, 1100, 800, 2200]){
    const s = Math.min(1, maxSide/Math.max(bmp.width, bmp.height));
    const w = Math.max(1, Math.round(bmp.width*s)), h = Math.max(1, Math.round(bmp.height*s));
    const c = mk(w,h); c.getContext('2d').drawImage(bmp, 0, 0, w, h);
    let r = tryCanvas(c); if(r) return r;
    const rc = mk(h,w), x = rc.getContext('2d'); x.translate(h/2, w/2); x.rotate(Math.PI/2); x.drawImage(c, -w/2, -h/2);
    r = tryCanvas(rc); if(r) return r;
  }
  return null;
}

let scanner = null, scanBusy = false;
const setScanMsg = t => { $('scanMsg').textContent = t; };
const setToolMsg = t => { $('toolMsg').textContent = t; };

function loadScannerLib(){
  return new Promise((ok,bad)=>{
    if(window.Html5Qrcode) return ok();
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js';
    s.onload = ok; s.onerror = () => bad(new Error('scanner library'));
    document.head.appendChild(s);
  });
}
async function stopScanner(){
  if(scanner){ try{ await scanner.stop(); scanner.clear(); }catch(e){} scanner = null; }
}
async function openScan(){
  $('scanModal').hidden = false; $('codeIn').value = ''; scanBusy = false;
  setScanMsg('Starting the camera…');
  try{ await loadScannerLib(); }
  catch(e){ setScanMsg('The scanner could not be loaded, but you can still type the digits printed under the barcode.'); return; }
  try{
    const F = Html5QrcodeSupportedFormats;
    scanner = new Html5Qrcode('reader', {formatsToSupport:[F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.QR_CODE], useBarCodeDetectorIfSupported:true});
    await scanner.start({facingMode:'environment'}, {fps:10, qrbox:{width:260, height:140}}, txt=>lookupBarcode(txt), ()=>{});
    setScanMsg('Point the camera at the barcode on the package and hold it steady for a moment.');
  }catch(e){
    scanner = null;
    setScanMsg('The live camera did not start, which happens when a page is previewed inside another app. Taking a photo of the barcode below uses your phone\u2019s own camera and should work.');
  }
}
async function closeScan(){ await stopScanner(); $('scanModal').hidden = true; }

async function lookupBarcode(raw){
  if(scanBusy) return;
  let code = String(raw).replace(/\D/g,'');
  if(code.length === 12) code = '0' + code;
  if(code.length < 8){ setScanMsg('That does not look like a full product barcode, which usually has between 8 and 13 digits.'); return; }
  scanBusy = true;
  setScanMsg('Looking up ' + code + '…');
  let data;
  try{
    const res = await fetch('https://world.openfoodfacts.org/api/v2/product/' + code + '.json?fields=product_name,brands,nutriments,serving_size,serving_quantity');
    data = await res.json();
  }catch(e){
    scanBusy = false;
    setScanMsg('The food database could not be reached from this page. If the page is running inside a sandbox that blocks outside requests, opening the file directly in your browser should fix it.');
    return;
  }
  const p = data && data.status === 1 ? data.product : null;
  if(!p){ scanBusy = false; setScanMsg('The database has no entry for ' + code + '. You can add it under Add a custom food instead.'); return; }
  const n = p.nutriments || {};
  let kcal = n['energy-kcal_100g'];
  if(kcal == null && n['energy_100g'] != null) kcal = n['energy_100g']/4.184;
  if(kcal == null){ scanBusy = false; setScanMsg('The database knows this product but has no nutrition numbers for it. You can add it under Add a custom food instead.'); return; }
  const brand = p.brands ? p.brands.split(',')[0].trim() : '';
  const full = [brand, p.product_name].filter(Boolean).join(' ');
  const per = {cal:kcal, pro:+n.proteins_100g || 0, carb:+n.carbohydrates_100g || 0, fat:+n.fat_100g || 0};
  const name = keepScanned(full, per, parseFloat(p.serving_quantity) || 100, true);
  await closeScan();
  setToolMsg('Found ' + name + '. Adjust the amount below if you ate more or less than one serving.');
  stageFood(name);
}

async function scanPhoto(file){
  setScanMsg('Reading the barcode from your photo…');
  let text = null;
  try{ text = await decodeBarcodeFile(file); }catch(e){}
  if(text){ lookupBarcode(text); return; }
  setScanMsg('No barcode could be read from that photo. Hold the phone about a hand span away, keep the bars sharp and flat, and fill most of the frame. You can also type the digits printed under the barcode.');
}

// Five sessions in a row (Sunday through Thursday by default), then two rest days. Skipping a day slides every
// remaining workout back a day. No deadlifts and no barbell back squats; machines and hip-dominant lifts cover those patterns.

const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);
const sundayOf = d => addDays(d, -d.getDay());
const shortDate = d => d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const longDate = d => d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
function startOfToday(){ const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
const sKey = n => 's' + n;
const sessRec = n => state.train.sessions[sKey(n)];
const tmapOf = () => (state.train.tmap = state.train.tmap || {});
const tplIdx = n => { const m = state.train.tmap; return (m && m[n] != null) ? m[n] : n % TPL.length; };
const tplOf = n => TPL[tplIdx(n)];

// finished workouts are numbered in order; the next unfinished one is the pointer everything else hangs from
function nextIdx(){ let n = 0; while(sessRec(n) && sessRec(n).done) n++; return n; }

// dates for every workout from the first one through `upto`: finished ones sit on the day they were done,
// the next one lands on the first allowed day, and the rest follow at one day apart with three days after each block of five
function sequence(upto, minN){
  const T = state.train, out = [], today = startOfToday();
  const gap = k => (k % TPL.length === 0 ? 3 : 1);
  let n = 0, prev = null;
  while(sessRec(n) && sessRec(n).done){
    const d = pd(sessRec(n).doneOn); out.push({n, date:d, fin:true}); prev = d; n++;
  }
  let d;
  if(prev) d = addDays(prev, gap(n));
  else if(T.start) d = pd(T.start);
  else d = today;
  if(d < today) d = today;
  if(T.notBefore && pd(T.notBefore) > d) d = pd(T.notBefore);
  out.push({n, date:d, fin:false});
  while(out.length < 800 && (d <= upto || n < minN)){
    n++; d = addDays(d, gap(n)); out.push({n, date:d, fin:false});
  }
  return out;
}
function infoOf(n){
  const it = sequence(addDays(startOfToday(), 400), n).find(x=>x.n === n);
  return {n, tpl:tplOf(n), date:it.date, fin:it.fin, dk:dkey(it.date)};
}

// progression: stay at a weight until every set reaches the top of the rep range, then add the lift's increment
function lastPerf(name, excludeN){
  let best = null;
  for(const key in state.train.sessions){
    if(key === sKey(excludeN)) continue;
    const rec = state.train.sessions[key], ex = (rec.ex||[]).find(e=>e.n === name);
    if(!ex) continue;
    const ok = ex.sets.filter(s=>s.ok && s.r > 0);
    if(!ok.length) continue;
    const date = rec.doneOn || rec.when || '';
    if(!best || date > best.date) best = {date, sets:ok};
  }
  return best;
}
function suggest(te, name, excludeN){
  const p = lastPerf(name, excludeN);
  if(!p) return {w:'', text:'There is no history for this lift yet, so pick a weight that leaves about two reps in reserve on the first set.'};
  const w = Math.max(...p.sets.map(s=>+s.w || 0));
  const summary = p.sets.map(s=>`${s.w ? s.w : 'bodyweight'}×${s.r}`).join(', ');
  if(p.sets.every(s=>s.r >= te.hi)){
    if(!te.inc) return {w: w || '', text:`Every set reached ${te.hi} reps last time (${summary}), so make the next round harder with a longer reach or a slower lowering phase.`};
    const up = w + te.inc;
    return {w:up, text: w ? `Every set reached ${te.hi} reps last time (${summary}), so this time go up to ${up} lb.`
                          : `Every set reached ${te.hi} reps last time (${summary}), so it is time to add some weight, starting around ${up} lb.`};
  }
  return {w: w || '', text:`Last time you did ${summary}. Stay at ${w || 'bodyweight'} and try to add a rep or two on each set before moving up.`};
}
function makeRec(n){
  return {done:false, doneOn:null, when:null, ex:tplOf(n).ex.map(e=>{
    const sg = suggest(e, e.n, n);
    return {n:e.n, sets:Array.from({length:e.sets}, ()=>({w:sg.w, r:'', ok:false, auto:true}))};
  })};
}

let tMonth = (()=>{ const n = startOfToday(); return new Date(n.getFullYear(), n.getMonth(), 1); })();
let openN = null;

function renderTrain(){
  $('tHeader').hidden = openN !== null;
  if(openN !== null) renderSessionView(); else renderMonthView();
}

function renderMonthView(){
  const first = tMonth, last = new Date(first.getFullYear(), first.getMonth()+1, 0);
  $('tTitle').textContent = first.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const today = startOfToday(), todayK = dkey(today);
  const gridStart = sundayOf(first), gridEnd = addDays(sundayOf(last), 6);
  const seq = sequence(gridEnd), map = {};
  let total = 0, done = 0;
  seq.forEach(it=>{
    const k = dkey(it.date);
    if(it.date >= gridStart && it.date <= gridEnd && !map[k]) map[k] = it;
    if(it.date.getMonth() === first.getMonth() && it.date.getFullYear() === first.getFullYear() && it.date <= last){ total++; if(it.fin) done++; }
  });
  $('tSub').textContent = total ? `${done} of ${total} workouts finished` : 'No workouts this month';

  let cells = '';
  for(let dt = gridStart; dt <= gridEnd; dt = addDays(dt,1)){
    const k = dkey(dt), it = map[k], cls = ['day'];
    if(dt.getMonth() !== first.getMonth()) cls.push('out');
    if(k === todayK) cls.push('today');
    if(it){
      const tp = tplOf(it.n);
      cls.push(tp.type); if(it.fin) cls.push('done');
      cells += `<button class="${cls.join(' ')}" data-n="${it.n}" aria-label="${esc(tp.name+', '+longDate(dt)+(it.fin?', finished':''))}"><span class="dn">${dt.getDate()}</span><span class="dl">${it.fin ? '✓' : tp.type}</span></button>`;
    }else{
      cells += `<div class="${cls.join(' ')} rest"><span class="dn">${dt.getDate()}</span></div>`;
    }
  }

  const wkStart = sundayOf(today), wkEnd = addDays(wkStart, 6);
  const inWeek = sequence(wkEnd).filter(it=>it.date >= wkStart && it.date <= wkEnd);
  const rows = inWeek.map(it=>{
    const tp = tplOf(it.n), k = dkey(it.date);
    const tag = it.fin ? '<span class="tag fin">Finished</span>' : k === todayK ? '<span class="tag now">Today</span>' : '';
    return `<button class="wrow" data-n="${it.n}"><div><b>${tp.name}</b><span class="s">${shortDate(it.date)}, ${tp.focus}</span></div>${tag}</button>`;
  }).join('');
  const busy = new Set(inWeek.map(it=>it.date.getDay()));
  const free = [0,1,2,3,4,5,6].filter(o=>!busy.has(o)).map(o=>DAYS[o]);
  const freeText = free.length ? `No workout is planned on ${free.join(' or ')} this week.` : 'Every day this week has a workout planned.';

  let startCard = '';
  if(nextIdx() === 0){
    const s0 = sequence(today)[0].date;
    startCard = `<section class="card"><label class="f" for="startDate">First workout</label>
      <input id="startDate" type="date" value="${dkey(s0)}" min="${todayK}">
      <p class="muted">The first workout starts today, with the next four on the following days and two rest days after that. Pick a later day if you would rather wait.</p></section>`;
  }

  // week check: five finished workouts inside one Sunday to Saturday week earns the mark
  let wkRows = '', fullWeeks = 0;
  for(let ws = gridStart; ws <= gridEnd; ws = addDays(ws, 7)){
    const we = addDays(ws, 6), a = dkey(ws), b = dkey(we);
    const cnt = seq.filter(it => it.fin && dkey(it.date) >= a && dkey(it.date) <= b).length;
    const full = cnt >= TPL.length, past = we < today, cur = ws <= today && today <= we;
    if(full && ws.getMonth() === first.getMonth() || full && we.getMonth() === first.getMonth()) fullWeeks++;
    const dots = Array.from({length:TPL.length}, (_, i) => `<i class="${i < cnt ? 'on' : ''}"></i>`).join('');
    const lbl = ws.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' to ' + we.toLocaleDateString(undefined,{month:'short',day:'numeric'});
    wkRows += `<div class="wk ${full ? 'full' : ''} ${cur ? 'cur' : ''} ${past && !full ? 'miss' : ''}"><span class="wl">${lbl}</span><span class="wd">${dots}</span><span class="wm">${full ? '\u2713' : (cnt ? cnt + ' of ' + TPL.length : (past ? '' : ''))}</span></div>`;
  }

  $('tBody').innerHTML = `
    <section class="card cal">
      <div class="dow"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
      <div class="grid">${cells}</div>
    </section>
    <p class="legend">U marks an upper body day and L marks a lower body day. If you skip a day, that workout and every one after it slides back a day on its own. Tap any of them to open it, log your sets, and check it off when you finish.</p>
    ${startCard}
    <section class="card"><h2>Weeks</h2><div class="wks">${wkRows}</div>
      <p class="muted">${fullWeeks ? fullWeeks + (fullWeeks === 1 ? ' week' : ' weeks') + ' complete this month. ' : ''}A week is complete when all five workouts are finished between Sunday and Saturday.</p></section>
    <section class="card"><h2>This week</h2><div class="wrows">${rows || '<p class="empty">Nothing is scheduled this week.</p>'}</div>
      <p class="muted">${freeText}</p></section>`;
}

function renderSessionView(){
  const n = openN, s = infoOf(n), ni = nextIdx();
  let rec = sessRec(n);
  if(!rec) rec = state.train.sessions[sKey(n)] = makeRec(n);
  const todayK = dkey(startOfToday());
  let when;
  if(s.fin) when = `Finished on ${longDate(pd(rec.doneOn))}.`;
  else if(s.dk === todayK) when = 'Planned for today.';
  else when = `Planned for ${longDate(s.date)}.`;

  // untouched sets follow the latest suggestion, sets you have edited or checked stay as you left them
  rec.ex.forEach((e,j)=>{
    const sg = suggest(s.tpl.ex[j], e.n, n);
    e.sets.forEach(st=>{ if(st.auto && !st.ok) st.w = sg.w; });
  });

  const nAll = rec.ex.reduce((a,e)=>a+e.sets.length, 0);
  const nOk = rec.ex.reduce((a,e)=>a+e.sets.filter(x=>x.ok).length, 0);

  const exHtml = rec.ex.map((e,j)=>{
    const te = s.tpl.ex[j], sg = suggest(te, e.n, n);
    const alts = [te.n].concat(te.alts).filter(x=>x !== e.n);
    const head = te.ab && !(j > 0 && s.tpl.ex[j-1].ab) ? '<h2 style="margin:26px 0 0">Ab work</h2>' : '';
    const sets = e.sets.map((st,k)=>`
      <div class="setrow ${st.ok ? 'ok' : ''}" data-j="${j}" data-k="${k}"><span class="sn">${k+1}</span>
        <input class="sw" type="number" inputmode="decimal" step="any" min="0" placeholder="lb" value="${st.w === '' ? '' : st.w}" aria-label="Weight for set ${k+1}">
        <input class="sr" type="number" inputmode="numeric" min="0" placeholder="${te.lo}-${te.hi}" value="${st.r === '' ? '' : st.r}" aria-label="Reps for set ${k+1}">
        <button class="chk" type="button" aria-pressed="${st.ok}" aria-label="Mark set ${k+1} done">✓</button></div>`).join('');
    return `${head}<section class="ex" data-j="${j}">
      <div class="exHead"><b>${esc(e.n)}</b><span>${te.sets} sets of ${te.lo} to ${te.hi}</span></div>
      <p class="sug">${esc(sg.text)}</p>
      <div class="setHead"><span></span><span>Weight (lb)</span><span>Reps</span><span></span></div>${sets}
      <div class="exFoot"><button class="tool addSet" type="button">Add a set</button>
        ${alts.length ? `<select class="swap" aria-label="Swap this exercise"><option value="">Swap exercise</option>${alts.map(x=>`<option>${esc(x)}</option>`).join('')}</select>` : ''}</div>
    </section>`;
  }).join('');

  let footer;
  if(n === ni && !rec.done) footer = `<button class="primary" id="doneBtn">Mark workout as finished</button>`;
  else if(rec.done && n === ni-1) footer = `<button class="primary" id="doneBtn">Finished, tap to reopen</button>`;
  else if(rec.done) footer = '';
  else footer = `<p class="muted">This workout unlocks once the ones before it are finished, and you are welcome to look it over until then.</p>`;

  const push = (n === ni && !rec.done)
    ? `<button class="tool" id="pushBtn" type="button" style="margin-top:12px">Push back a day</button>
       <p class="muted" style="margin-top:8px">Pushing back moves this workout and every one after it a day later.</p>` : '';

  let swapUI = '';
  if(n === ni && !rec.done){
    const end = (Math.floor(n / TPL.length) + 1) * TPL.length - 1, opts = [];
    for(let m = n + 1; m <= end; m++) opts.push(`<option value="${m}">${esc(tplOf(m).name)}, ${esc(tplOf(m).focus)}</option>`);
    if(opts.length) swapUI = `<select id="swapDay" aria-label="Do a different workout today" style="margin-top:12px;width:100%"><option value="">Do a different workout today</option>${opts.join('')}</select>
       <p class="muted" style="margin-top:8px">Picking one trades places with this workout, so nothing gets skipped and the rest of the week keeps its order.</p>`;
  }

  $('tBody').innerHTML = `
    <button class="back" id="tBack">‹ Back to the calendar</button>
    <div class="sessTitle">${s.tpl.name}</div>
    <p class="sessSub">${esc(s.tpl.focus.charAt(0).toUpperCase()+s.tpl.focus.slice(1))}. ${when}</p>
    <section class="card"><p class="muted" style="margin:0" id="setCount">${nOk} of ${nAll} sets logged so far.</p>${push}${swapUI}</section>
    ${exHtml}
    ${footer}`;
}

function setSetCount(){
  const rec = sessRec(openN); if(!rec) return;
  const nAll = rec.ex.reduce((a,e)=>a+e.sets.length, 0), nOk = rec.ex.reduce((a,e)=>a+e.sets.filter(x=>x.ok).length, 0);
  const el = $('setCount'); if(el) el.textContent = `${nOk} of ${nAll} sets logged so far.`;
}

$('tBody').addEventListener('click', ev=>{
  const t = ev.target;
  const open = t.closest('.day[data-n], .wrow[data-n]');
  if(open){ openN = +open.dataset.n; renderTrain(); window.scrollTo(0,0); return; }
  if(t.closest('#tBack')){ openN = null; renderTrain(); window.scrollTo(0,0); return; }
  const rec = openN !== null && sessRec(openN); if(!rec) return;
  const chk = t.closest('.chk');
  if(chk){
    const row = chk.closest('.setrow'), st = rec.ex[+row.dataset.j].sets[+row.dataset.k];
    if(!st.ok){
      const reps = parseFloat(row.querySelector('.sr').value);
      if(!(reps > 0)){ row.querySelector('.sr').focus(); return; }
      st.r = reps; st.w = parseFloat(row.querySelector('.sw').value) || 0; st.ok = true; st.auto = false;
      rec.when = dkey(startOfToday());
    }else st.ok = false;
    row.classList.toggle('ok', st.ok); chk.setAttribute('aria-pressed', st.ok);
    save(); setSetCount(); return;
  }
  const add = t.closest('.addSet');
  if(add){
    const ex = rec.ex[+add.closest('.ex').dataset.j], lastSet = ex.sets[ex.sets.length-1];
    ex.sets.push({w:lastSet ? lastSet.w : '', r:'', ok:false, auto:lastSet ? lastSet.auto : true}); save(); renderTrain(); return;
  }
  if(t.closest('#pushBtn')){
    const s = infoOf(openN); state.train.notBefore = dkey(addDays(s.date, 1)); save(); renderTrain(); return;
  }
  if(t.closest('#doneBtn')){
    const ni = nextIdx();
    if(!rec.done && openN === ni){ rec.done = true; rec.doneOn = dkey(startOfToday()); state.train.notBefore = null; }
    else if(rec.done && openN === ni-1){ rec.done = false; rec.doneOn = null; }
    else return;
    save(); renderTrain(); window.scrollTo(0,0);
  }
});
$('tBody').addEventListener('change', ev=>{
  if(ev.target.id === 'swapDay'){
    const m = +ev.target.value, n = openN; if(!m || n === null) return;
    const logged = [n, m].some(k => { const r = sessRec(k); return r && (r.ex||[]).some(e => e.sets.some(x => x.ok)); });
    if(logged && !confirm('Sets are already logged on one of these, and switching clears them. Switch anyway?')){ ev.target.value = ''; return; }
    const tm = tmapOf(), a = tplIdx(n), b = tplIdx(m);
    tm[n] = b; tm[m] = a;
    delete state.train.sessions[sKey(n)]; delete state.train.sessions[sKey(m)];
    save(); renderTrain(); return;
  }
  const t = ev.target;
  if(t.id === 'startDate'){
    if(t.value){ state.train.start = t.value; state.train.notBefore = null; save(); renderTrain(); }
    return;
  }
  const rec = openN !== null && sessRec(openN); if(!rec) return;
  const row = t.closest('.setrow');
  if(row){
    const st = rec.ex[+row.dataset.j].sets[+row.dataset.k], v = t.value === '' ? '' : parseFloat(t.value);
    if(t.classList.contains('sw')){ st.w = v; st.auto = false; } else if(t.classList.contains('sr')) st.r = v;
    save(); return;
  }
  if(t.classList.contains('swap') && t.value){
    const j = +t.closest('.ex').dataset.j, ex = rec.ex[j];
    ex.n = t.value;
    ex.sets.forEach(st=>{ if(!st.ok) st.auto = true; });
    save(); renderTrain();
  }
});
$('tPrev').onclick = () => { tMonth = new Date(tMonth.getFullYear(), tMonth.getMonth()-1, 1); renderTrain(); };
$('tNext').onclick = () => { tMonth = new Date(tMonth.getFullYear(), tMonth.getMonth()+1, 1); renderTrain(); };

function showTab(t){
  $('viewN').hidden = t !== 'n'; $('viewT').hidden = t !== 't'; $('viewP').hidden = t !== 'p';
  $('tabN').setAttribute('aria-current', t === 'n' ? 'page' : 'false');
  $('tabT').setAttribute('aria-current', t === 't' ? 'page' : 'false');
  $('tabP').setAttribute('aria-current', t === 'p' ? 'page' : 'false');

  if(t === 'p') renderProgress();
